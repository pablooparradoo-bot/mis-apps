<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caja de Pablo</title>
<meta name="description" content="Control de gastos, ingresos, apuestas y grupos">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caja">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1318" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html{padding-top:env(safe-area-inset-top,0px);background:var(--bg,#EEF1F4)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column (max 520px), sticky month bar, floating bottom nav with a central add button; sheets slide up from the bottom. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#E4E8ED; --line:#D5DBE2;
  --fg:#141A22; --muted:#5E6875; --accent:#C9861C; --accent-ink:#1A1206; --accent-soft:#F6E7CC;
  --in:#1E8A55; --out:#C8402F; --info:#3E6FD0;
  --shadow:0 1px 2px rgba(20,26,34,.06),0 8px 24px rgba(20,26,34,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1318; --surface:#181E25; --surface-2:#222A33; --line:#2B343F;
  --fg:#EEF1F4; --muted:#93A0AE; --accent:#E9A93F; --accent-ink:#1A1206; --accent-soft:#3A2D16;
  --in:#45C487; --out:#FF7A66; --info:#7FA4F0; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1318; --surface:#181E25; --surface-2:#222A33; --line:#2B343F;
  --fg:#EEF1F4; --muted:#93A0AE; --accent:#E9A93F; --accent-ink:#1A1206; --accent-soft:#3A2D16;
  --in:#45C487; --out:#FF7A66; --info:#7FA4F0; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--in)} .neg{color:var(--out)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 4px}
.hello h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.hello p{margin:2px 0 0;color:var(--muted);font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:19px;height:19px}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-block:14px}
.month .lbl{font-family:var(--f-display);font-weight:700;font-size:16px;padding:7px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-transform:capitalize}
.month .icon-btn{width:34px;height:34px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:4px}
.hero{background:var(--fg);color:var(--bg);border:0;padding:20px}
.hero .eyebrow{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin-top:10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.split div{min-width:0}
.split small{display:block;font-size:12px;opacity:.7}
.split b{font-size:18px;font-weight:700}
.hero .pos{color:color-mix(in srgb,var(--in) 70%,var(--bg))} .hero .neg{color:color-mix(in srgb,var(--out) 70%,var(--bg))}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--out) 75%,transparent);overflow:hidden;margin-top:14px;display:flex}
.bar span{background:var(--in);height:100%}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px;font-family:var(--f-display)}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;white-space:nowrap}
.empty{text-align:center;padding:22px 8px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.dayh{font-size:12px;font-weight:600;color:var(--muted);margin:14px 4px 6px;text-transform:capitalize}
.search{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pill{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg.wide{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.seg.wide.two{grid-template-columns:repeat(2,1fr)}
.seg.wide.four{grid-template-columns:repeat(4,1fr)}
.seg button.g[aria-pressed="true"]{color:var(--out)} .seg button.i[aria-pressed="true"]{color:var(--in)} .seg button.t[aria-pressed="true"]{color:var(--info)}
.donut-wrap{display:grid;place-items:center;margin:12px 0 4px;position:relative}
.donut-wrap .c{position:absolute;text-align:center}
.donut-wrap .c b{font-family:var(--f-display);font-size:22px;display:block}
.donut-wrap .c small{color:var(--muted)}
.pct{font-size:12px;color:var(--muted);width:38px;text-align:right}
.meter{height:5px;border-radius:9px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface-2);border-radius:14px;padding:12px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{font-size:18px;font-family:var(--f-display)}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.tag.pend{background:var(--accent-soft);color:var(--accent)}
.tag.win{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.tag.lose{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.tag.void{background:var(--surface-2);color:var(--muted)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:color-mix(in srgb,var(--out) 15%,transparent);color:var(--out)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:20}
.nav-in{max-width:488px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr) 62px repeat(2,1fr);align-items:center;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;padding:6px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;min-width:0;font-weight:600;color:var(--muted);padding:6px 0;border-radius:16px}
.nav button svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
.nav .add{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);margin:-26px auto 0;justify-content:center;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.nav .add svg{width:26px;height:26px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-h h2{font-size:20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>.lab{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:14px 0 18px}
.amount input{font-family:var(--f-display);font-weight:800;font-size:52px;border:0;background:none;text-align:center;width:100%;max-width:280px;padding:0;letter-spacing:-.02em}
.amount span{font-size:26px;color:var(--muted);font-weight:700}
.sugg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:2px}
.sugg button{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 10px;font-weight:700;font-size:12px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;min-width:0;text-align:center;line-height:1.15}
.catbtn .ico{width:32px;height:32px;font-size:12px;border-radius:10px}
.catbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.toggle small{display:block;color:var(--muted);font-size:12px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.15s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{left:21px;background:var(--accent-ink)}
.freq{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.freq button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 11px;text-align:left;font-size:12px}
.freq button b{display:block;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.banner{padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--fg);font-size:13px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{font-size:12px;color:var(--muted)}
.hide-nums .money{filter:blur(7px)}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .inp{flex:1;min-width:0}
.mrow .inp.wsm{flex:0 0 86px;padding:9px 10px;text-align:right}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"]::after{content:"";width:10px;height:5px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.balbar{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:7px;margin-top:6px}
.balbar>span{background:var(--surface-2);border-radius:9px;overflow:hidden;display:flex}
.balbar>span:first-child{justify-content:flex-end}
.balbar i{display:block;height:100%;border-radius:9px}
.fx{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;margin-top:8px}
.fx .inp{min-width:0}
.btns .btn.sm{flex:1 1 auto}
.cashpane{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:8px}
.cp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.dengrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.den{border:1px solid var(--line);border-radius:10px;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;position:relative;background:var(--surface-2)}
.den b{font-size:12px;white-space:nowrap}
.den small{font-size:9.5px;color:var(--muted)}
.den.bill{border-radius:6px;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.den.coin{border-radius:999px}
.den .cnt{position:absolute;top:-7px;right:-4px;background:var(--fg);color:var(--bg);font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 6px}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pc{border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600}
.pc span{color:var(--out);font-weight:800;margin-left:2px}
.recgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.recgrid>div{min-width:0}
.recrow,.denrow{display:flex;align-items:center;gap:8px;padding:4px 0}
.recrow .inp{flex:0 0 58px;padding:7px 8px;text-align:right;min-width:0}
.recrow .mini{flex:1;text-align:right;min-width:0}
.den-tag{font-size:12px;font-weight:700;padding:3px 0;width:54px;text-align:center;flex:none}
.den-tag.bill{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:5px}
.den-tag.coin{background:var(--surface-2);border-radius:99px}
@media (max-width:420px){.recgrid{grid-template-columns:1fr}}
/* --- v2: avisos, dashboards, calendario, presupuestos, metas, Apple Pay --- */
.row .mid>span:not(.balbar){display:block}
.bellb{position:relative}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--out);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1;border:2px solid var(--bg)}
.ins{display:flex;align-items:center;gap:12px;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit}
.ins:first-child{border-top:0}
.ins .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--info)}
.ins.warn .dot{background:var(--out)} .ins.good .dot{background:var(--in)}
.ins .mid{flex:1;min-width:0}
.ins .t{font-weight:600;display:block;line-height:1.3}
.ins .s{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.ins .go svg,.row>svg{width:16px;height:16px;color:var(--muted);flex:none}
.stackbar{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;margin:2px 0 8px}
.stackbar i{display:block;height:100%;min-width:2px}
.delta{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap;flex:none}
.delta.up{background:color-mix(in srgb,var(--out) 14%,transparent);color:var(--out)}
.delta.down{background:color-mix(in srgb,var(--in) 14%,transparent);color:var(--in)}
.delta.new{background:var(--surface-2);color:var(--muted)}
.kpi small+b+small{margin-top:2px}
.pacebar{position:relative;height:10px;border-radius:99px;background:var(--surface-2);margin-top:14px}
.pacebar i{display:block;height:100%;border-radius:99px}
.pacebar b{position:absolute;top:-4px;width:3px;height:18px;background:var(--fg);border-radius:2px}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.heat .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.hd{aspect-ratio:1;border-radius:10px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12.5px;font-weight:700;padding:0;color:var(--fg);min-width:0;line-height:1.05}
.hd small{font-size:9.5px;font-weight:600;opacity:.85}
.hd.today{box-shadow:0 0 0 2px var(--fg) inset}
.hd.fut{opacity:.35}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px;word-break:break-all;-webkit-user-select:all;user-select:all}
span.code{display:inline-block;padding:2px 7px;border-radius:7px;margin-top:2px}
.steps{margin:0;padding-left:20px;font-size:14px;line-height:1.5}
.steps li{margin-bottom:8px}
.apb{display:flex;gap:8px;align-items:center}
@media (display-mode: standalone){.only-browser{display:none}}
</style>

<div class="app" id="app">
  <div class="top"><div class="hello"><h1>Caja</h1><p>Cargando tus cuentas…</p></div></div>
  <div class="card empty"><b>Preparando tu caja</b>Tus cuentas, movimientos y apuestas aparecerán aquí en cuanto se conecte la base de datos.</div>
</div>
<nav class="nav" id="nav" hidden></nav>
<div id="layer"></div>

<script>
(() => {
"use strict";
/* ---------- Catálogo ---------- */

function suggestCat(type,desc){

  const hist=sortedTx(S.tx.filter(t=>t.type===type&&t.cat&&t.cat!=="Sin categoría"));
  const exact=hist.find(t=>norm(t.desc)===n);if(exact)return{cat:exact.cat,why:"como la última vez"};

  if(first.length>=4){const w=hist.find(t=>norm(t.desc).split(" ")[0]===first);if(w)return{cat:w.cat,why:"por tu historial"};}
  // 2) diccionario
  const pad=" "+n+" ";let best=null,len=0;
  for(const[cat,words]of Object.entries(KW[type]))for(const w of words){const ww=w.trim();
    if((w.endsWith(" ")?pad.includes(" "+w):pad.includes(ww))&&ww.length>len){best=cat;len=ww.length;}}

/* ---------- Datos: se guardan en este dispositivo ---------- */
const COLS=["accounts","tx","platforms","bets","betmoves","groups","gexp","goals"];
const LSK="caja:v1:";
const lsGet=(k,d)=>{try{const v=localStorage.getItem(LSK+k);return v==null?d:JSON.parse(v)}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(LSK+k,JSON.stringify(v));return true}catch{return false}};
const LocalDB=(()=>{const data={},subs={},psubs=[];let prof=lsGet("config:profile",null);
  const load=c=>{data[c]=lsGet("col:"+c,{})||{}};COLS.forEach(load);
  const snap=c=>({docs:Object.entries(data[c]).map(([id,d])=>({id,data:()=>d}))});
  const emit=c=>(subs[c]||[]).forEach(f=>f(snap(c)));
  const psnap=()=>({exists:!!prof,data:()=>prof||{}});
  const emitP=()=>psubs.forEach(f=>f(psnap()));
  const quota=()=>{const e=new Error("quota");e.code="quota_exceeded";return e};
  const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
  window.addEventListener("storage",e=>{if(e.key&&!e.key.startsWith(LSK))return;COLS.forEach(c=>{load(c);emit(c)});prof=lsGet("config:profile",null);emitP()});
  return{
    collection(c){if(!data[c])load(c);return{
      onSnapshot(fn){(subs[c]=subs[c]||[]).push(fn);fn(snap(c))},
      doc(id){id=id||nid();return{id,
        async set(v){const had=id in data[c],prev=data[c][id];data[c][id]=JSON.parse(JSON.stringify(v));if(!lsSet("col:"+c,data[c])){if(had)data[c][id]=prev;else delete data[c][id];throw quota()}emit(c)},
        async delete(){if(!(id in data[c]))return;const prev=data[c][id];delete data[c][id];if(!lsSet("col:"+c,data[c])){data[c][id]=prev;throw quota()}emit(c)}}}}},
    doc(){return{onSnapshot(fn){psubs.push(fn);fn(psnap())},
      async set(v){const old=prof;prof=JSON.parse(JSON.stringify(v));if(!lsSet("config:profile",prof)){prof=old;throw quota()}emitP()}}},
    dump(){const o={};COLS.forEach(c=>o[c]=Object.entries(data[c]).map(([id,d])=>({id,...d})));return{data:o,config:{profile:prof||{}}}},
    restore(b){const next={};for(const c of COLS){next[c]={};for(const d of(b.data?.[c]||[])){const{id,...rest}=d;if(id)next[c][id]=rest}}
      const before={};COLS.forEach(c=>before[c]=data[c]);const oldP=prof;
      try{for(const c of COLS){data[c]=next[c];if(!lsSet("col:"+c,data[c]))throw quota()}prof={...(b.config?.profile||{})};if(!lsSet("config:profile",prof))throw quota()}
      catch(e){COLS.forEach(c=>{data[c]=before[c];lsSet("col:"+c,data[c])});prof=oldP;lsSet("config:profile",prof);throw e}
      COLS.forEach(emit);emitP()},
    wipe(){COLS.forEach(c=>{data[c]={};lsSet("col:"+c,{})});prof={name:prof?.name||"Pablo"};lsSet("config:profile",prof);COLS.forEach(emit);emitP()}
  }})();
async function boot(){
  S.db=LocalDB;
  try{navigator.storage?.persist?.().catch(()=>{})}catch{}
  for(const c of COLS)S.db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));S.ready[c]=true;render();});
  S.db.doc("config/profile").onSnapshot(s=>{S.profile={name:"Pablo",...(s.exists?s.data():{})};render();});
  render();
  handleLaunch();
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
}
async function put(col,id,data){try{const ref=id?S.db.collection(col).doc(id):S.db.collection(col).doc();await ref.set({...data});return ref.id;}catch(e){toast(e.code==="quota_exceeded"?"No queda espacio: guarda una copia y borra datos antiguos.":"No se pudo guardar ("+(e.code||"error")+")");throw e;}}
async function del(col,id){try{await S.db.collection(col).doc(id).delete();}catch(e){toast("No se pudo borrar ("+(e.code||"error")+")");throw e;}}

/* ---------- Sheets ---------- */
function openSheet(html,mount){$layer.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;const sh=$layer.querySelector(".sheet");mount&&mount(sh);const f=sh.querySelector("[autofocus]");f&&setTimeout(()=>f.focus(),60);}
function closeSheet(){$layer.innerHTML="";}
function sheetHead(t){return`<div class="sheet-h"><h2>${t}</h2><button class="icon-btn" data-act="close" aria-label="Cerrar">${ic("x")}</button></div>`}
const accOptions=(sel,none)=>(none?`<option value="">${none}</option>`:"")+sortAcc().map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.name)} · ${eur(balanceOf(a.id))}</option>`).join("");

/* ---------- Efectivo: billetes y monedas (en céntimos) ---------- */
const DEN=[50000,20000,10000,5000,2000,1000,500,200,100,50,20,10,5,2,1];
const isBill=c=>+c>=500;
const denLbl=c=>(c=+c)>=100?(c/100)+" €":c+" cts";
const isCashAcc=id=>!!id&&S.accounts.find(a=>a.id===id)?.kind==="Efectivo";
const sumC=m=>Object.entries(m||{}).reduce((s,[c,n])=>s+(+c)*(+n||0),0);
const cleanC=m=>Object.fromEntries(Object.entries(m||{}).filter(([,n])=>+n).map(([c,n])=>[c,+n]));
const shortCash=m=>DEN.filter(c=>+(m?.[c]||0)).map(c=>`${m[c]}×${denLbl(c)}`).join(", ");
function cashFlowSum(accId,excludeId){const f={};for(const t of S.tx){if(t.id===excludeId||t.cash?.acc!==accId)continue;
  for(const[c,n]of Object.entries(t.cash.in||{}))f[c]=(f[c]||0)+(+n);for(const[c,n]of Object.entries(t.cash.out||{}))f[c]=(f[c]||0)-(+n);}return f;}
function cashBreakdown(accId,excludeId){const a=S.accounts.find(x=>x.id===accId);const f=cashFlowSum(accId,excludeId);const o={};for(const c of DEN)o[c]=(+(a?.cashInit?.[c])||0)+(f[c]||0);return o;}
function greedyC(cents,avail){const out={};let r=cents;for(const c of DEN){let k=Math.floor(r/c);if(avail)k=Math.min(k,Math.max(0,avail[c]||0));if(k>0){out[c]=k;r-=k*c;}}return{out,rest:r};}
/* Con qué billetes pagar usando lo que tienes: exacto si se puede; si no, lo justo pasándote lo menos posible */
function suggestPay(cents,avail){const g=greedyC(cents,avail);if(!g.rest)return g.out;const used={...g.out};
  const asc=[...DEN].reverse();const extra=asc.find(c=>c>=g.rest&&(avail[c]||0)-(used[c]||0)>0);
  if(extra){used[extra]=(used[extra]||0)+1;let changed=true;while(changed){changed=false;for(const c of DEN){if(used[c]&&sumC(used)-c>=cents){used[c]--;if(!used[c])delete used[c];changed=true;break;}}}return used;}
  const big=asc.find(c=>c>=cents&&(avail[c]||0)>0);return big?{[big]:1}:null;}

function txSheet(tx,preset){
  if(!S.accounts.length){toast("Primero crea una cuenta en Ajustes");settingsSheet();return;}
  const st={type:tx?.type||preset?.type||"gasto",amount:tx?.amount??preset?.amount??"",accountId:tx?.accountId||preset?.accountId||sortAcc()[0].id,toAccountId:tx?.toAccountId||preset?.toAccountId||"",desc:tx?.desc??preset?.desc??"",cat:tx?.cat||preset?.cat||"Sin categoría",date:tx?.date||preset?.date||today(),recurring:!!(tx?.recurring??preset?.recurring),manualCat:!!(tx||preset?.cat),confirmDel:false,cash:{main:{},change:{}},noCash:false,card:preset?.card||null,ap:!!preset?.fromApplePay};

    if(isCashAcc(st.toAccountId))return{acc:st.toAccountId,dir:"in"};if(isCashAcc(st.accountId))return{acc:st.accountId,dir:"out"};return null;};
  if(tx?.cash){const d=cashCtx()?.dir||"out";st.cash.main={...(d==="out"?tx.cash.out:tx.cash.in)};st.cash.change={...(d==="out"?tx.cash.in:tx.cash.out)};}
  else if(tx&&cashCtx())st.noCash=true;
  const drawCash=sh=>{const box=sh.querySelector("#cashbox");if(!box)return;const ctx=cashCtx();if(!ctx){box.innerHTML="";return;}
    const avail=cashBreakdown(ctx.acc,tx?.id);const amtC=Math.round(parseAmt(st.amount)*100);const M=sumC(st.cash.main),C=sumC(st.cash.change),net=M-C;const out=ctx.dir==="out";
    if(st.noCash){box.innerHTML=`<div class="field"><div class="toggle"><span><b>Billetes y monedas</b><small>Sin desglose: el recuento del efectivo quedará descuadrado.</small></span><button class="btn ghost sm" data-k="nocash">Desglosar</button></div></div>`;return;}
    const grid=(g,dirOut)=>`<div class="dengrid">${DEN.map(c=>{const n=+(st.cash[g][c]||0);const have=avail[c]||0;return`<button class="den ${isBill(c)?"bill":"coin"}" data-k="den" data-g="${g}" data-c="${c}" aria-label="Añadir ${denLbl(c)}"><b>${denLbl(c)}</b>${n?`<span class="cnt">×${n}</span>`:""}${dirOut?`<small class="${n>have?"neg":""}">tienes ${have}</small>`:""}</button>`}).join("")}</div>`;
    const picked=g=>{const m=st.cash[g];const ks=DEN.filter(c=>+(m[c]||0));return ks.length?`<div class="picked">${ks.map(c=>`<button class="pc" data-k="denm" data-g="${g}" data-c="${c}" aria-label="Quitar un ${denLbl(c)}">${m[c]}×${denLbl(c)} <span aria-hidden="true">−</span></button>`).join("")}</div>`:""};
    const showChange=M>amtC||C>0;
    const ok=amtC>0&&net===amtC;const diff=amtC-net;
    box.innerHTML=`<div class="field cashf"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="lab">Billetes y monedas · ${esc(accName(ctx.acc))}</span><button class="link" data-k="nocash" style="padding:0">Sin desglose</button></div>
      <div class="cashpane"><div class="cp-h"><b>${out?"Entregas":"Recibes"}</b><span class="num">${eur(M/100)}</span></div>${picked("main")}${grid("main",out)}
       <div class="btns" style="margin-top:8px"><button class="btn ghost sm" data-k="cashsug">${out?"Sugerir con lo que tengo":"Desglose típico"}</button>${M>amtC&&amtC>0?`<button class="btn ghost sm" data-k="cashchg">Calcular ${out?"el cambio":"lo que devuelves"}</button>`:""}${M||C?`<button class="btn ghost sm" data-k="cashclr">Borrar</button>`:""}</div></div>
      ${showChange?`<div class="cashpane"><div class="cp-h"><b>${out?"Te devuelven (cambio)":"Das de cambio"}</b><span class="num">${eur(C/100)}</span></div>${picked("change")}${grid("change",!out)}</div>`:""}
      <p class="mini" style="margin:2px 0 0;font-weight:600;color:${ok?"var(--in)":amtC?"var(--out)":"var(--muted)"}">${!amtC?"Escribe el importe para comprobar el desglose.":ok?`Cuadra: ${out?"entregas":"recibes"} ${eur(M/100)}${C?`, ${out?"te devuelven":"devuelves"} ${eur(C/100)}`:""}.`:diff>0?`Faltan ${eur(diff/100)} para llegar a ${eur(amtC/100)}.`:`Sobran ${eur(-diff/100)}: añade el cambio.`}</p></div>`;};
  const draw=sh=>{
    const sug=st.type!=="transfer"&&!st.manualCat?null:null;
    const fr=st.type==="transfer"?[]:frequent(st.type);
    sh.innerHTML=`<div class="grab"></div>${sheetHead(tx?"Editar movimiento":st.type==="gasto"?"Nuevo gasto":st.type==="ingreso"?"Nuevo ingreso":"Nueva transferencia")}

    ${st.ap?`<div class="banner apb" style="margin-top:12px">${ic("card",'style="width:18px;height:18px;flex:none"')}<span>Pago con Apple Pay${st.card?` · <b>${esc(st.card)}</b>`:""}. Revisa la cuenta y la categoría y guarda.</span></div>`:""}
    <div class="amount"><input id="f-amt" inputmode="decimal" placeholder="0" value="${st.amount===""?"":String(st.amount).replace(".",",")}" aria-label="Importe" autofocus style="color:${st.type==="gasto"?"var(--out)":st.type==="ingreso"?"var(--in)":"var(--info)"}"><span>€</span></div>
    ${!tx&&!st.ap&&isStandalone()?`<div style="text-align:center;margin:-10px 0 12px"><button class="link" data-k="paste">Pegar pago copiado de Apple Pay</button></div>`:""}
    ${fr.length&&!tx?`<div class="field"><span class="lab">Frecuentes</span><div class="freq">${fr.map(t=>`<button data-k="freq" data-id="${t.id}"><b>${esc(t.desc)}</b><span class="num">${eur(t.amount)}</span></button>`).join("")}</div></div>`:""}

    <div class="btns">${tx?(st.confirmDel?`<button class="btn danger" data-k="delok">Sí, borrar</button><button class="btn ghost" data-k="delno">Cancelar</button>`:`<button class="btn danger" data-k="del">Borrar</button>`):""}${st.confirmDel?"":`${st.type!=="transfer"?`<button class="btn ghost" data-k="split" title="Repartir este gasto con otras personas">Dividir en grupo</button>`:""}<button class="btn" data-k="save">${tx?"Guardar cambios":"Guardar"}</button>`}</div>`;

      else if(k==="cashsug"){const ctx=cashCtx();const amtC=Math.round(parseAmt(st.amount)*100);if(!amtC)return toast("Escribe primero el importe");

          else{st.cash.main=p;const ch=sumC(p)-amtC;st.cash.change=ch>0?greedyC(ch).out:{};}}
        else st.cash={main:greedyC(amtC).out,change:{}};drawCash(sh);}
      else if(k==="cashchg"){const ctx=cashCtx();const ch=sumC(st.cash.main)-Math.round(parseAmt(st.amount)*100);if(ch>0){const g=ctx.dir==="in"?greedyC(ch,cashBreakdown(ctx.acc,tx?.id)):greedyC(ch);st.cash.change=g.rest?greedyC(ch).out:g.out;}drawCash(sh);}
      else if(k==="paste"){let txt="";try{txt=await navigator.clipboard.readText();}catch{return toast("No se pudo leer el portapapeles");}

      else if(k==="del"){st.confirmDel=true;draw(sh);} else if(k==="delno"){st.confirmDel=false;draw(sh);}
      else if(k==="delok"){await del("tx",tx.id);closeSheet();toast("Movimiento borrado");}
      else if(k==="split"){const amount=parseAmt(st.amount);
        gexpSheet(null,{kind:st.type==="ingreso"?"ingreso":"gasto",amount:amount||"",title:st.desc,cat:st.type==="gasto"&&st.cat!=="Sin categoría"?st.cat:null,date:st.date,accountId:st.accountId,txId:tx?.id||null,fromLedger:true});}
      else if(k==="save"){const amount=parseAmt(st.amount);
        if(amount<=0)return toast("Escribe un importe mayor que 0");
        if(st.type==="transfer"&&(!st.toAccountId||st.toAccountId===st.accountId))return toast("Elige una cuenta de destino distinta");
        const data={type:st.type,amount,accountId:st.accountId,desc:st.desc.trim(),date:st.date||today(),created:tx?.created||Date.now()};
        if(st.type==="transfer")data.toAccountId=st.toAccountId;else{data.cat=st.cat;data.recurring=st.recurring;}
        if(tx?.linked)data.linked=tx.linked;
        const ctx=cashCtx();
        if(ctx&&!st.noCash){const main=cleanC(st.cash.main),change=cleanC(st.cash.change);const net=sumC(main)-sumC(change);
          if(!Object.keys(main).length&&!Object.keys(change).length){const box=sh.querySelector(".cashf");box?.scrollIntoView({block:"center",behavior:"smooth"});return toast("Indica con qué billetes y monedas (o pulsa «Sin desglose»)");}
          if(net!==Math.round(amount*100))return toast(`El desglose suma ${eur(net/100)} y el importe es ${eur(amount)}`);
          data.cash={acc:ctx.acc,in:ctx.dir==="in"?main:change,out:ctx.dir==="out"?main:change};}
        b.disabled=true;try{await put("tx",tx?.id,data);closeSheet();toast(tx?"Cambios guardados":st.ap?"Pago apuntado ✓":"Movimiento guardado");
          if(st.card){const key=norm(st.card),map={...(S.profile.cardMap||{})};if(key&&map[key]!==st.accountId){map[key]=st.accountId;saveProfile({cardMap:map}).catch(()=>{});}}}catch{b.disabled=false;}}
    });});

function memberName(g,id){if(!g)return"—";const m=g.members?.find(m=>m.id===id);if(!m)return"Antiguo miembro";return m.id===g.meId?"Tú":m.name}
const mName=memberName;
function allocate(total,weights){const tw=weights.reduce((s,[,w])=>s+w,0);if(tw<=0)return{};const cents=Math.round(total*100);
  const fl=weights.map(([id,w])=>{const v=cents*w/tw;return{id,c:Math.floor(v),rem:v-Math.floor(v)}});
  let left=cents-fl.reduce((s,r)=>s+r.c,0);[...fl].sort((a,b)=>b.rem-a.rem).forEach(r=>{if(left>0){r.c++;left--;}});
  const out={};for(const r of fl)out[r.id]=r.c/100;return out;}
function expShares(e){if(e.kind==="reembolso")return{};const w=e.split?.w||{};const mode=e.split?.mode||"igual";
  const entries=Object.entries(w).filter(([,v])=>+v>0);
  if(mode==="importes"){const o={};for(const[id,v]of entries)o[id]=Math.round(+v*100)/100;return o;}
  return allocate(+e.amount||0,entries.map(([id,v])=>[id,mode==="igual"?1:+v]));}
function groupBalances(g){const bal={};for(const m of g.members||[])bal[m.id]=0;
  for(const e of S.gexp){if(e.groupId!==g.id)continue;const sh=expShares(e);
    if(e.kind==="gasto"){bal[e.paidBy]=(bal[e.paidBy]||0)+e.amount;for(const[id,v]of Object.entries(sh))bal[id]=(bal[id]||0)-v;}
    else if(e.kind==="ingreso"){bal[e.paidBy]=(bal[e.paidBy]||0)-e.amount;for(const[id,v]of Object.entries(sh))bal[id]=(bal[id]||0)+v;}
    else if(e.kind==="reembolso"){bal[e.paidBy]=(bal[e.paidBy]||0)+e.amount;bal[e.to]=(bal[e.to]||0)-e.amount;}}
  for(const k in bal)bal[k]=Math.round(bal[k]*100)/100;return bal;}
/* Mínimo número de pagos para dejar a todos en paz */
function settlePlan(bal){const cr=[],db=[];for(const[id,v]of Object.entries(bal)){if(v>0.004)cr.push({id,v});else if(v<-0.004)db.push({id,v:-v});}
  cr.sort((a,b)=>b.v-a.v);db.sort((a,b)=>b.v-a.v);const out=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const x=Math.min(db[i].v,cr[j].v);if(x>=0.005)out.push({from:db[i].id,to:cr[j].id,amt:Math.round(x*100)/100});db[i].v-=x;cr[j].v-=x;if(db[i].v<0.005)i++;if(cr[j].v<0.005)j++;}
  return out;}
function groupStats(g){const ex=S.gexp.filter(e=>e.groupId===g.id);let total=0,income=0,myShare=0,myPaid=0;const byCat=new Map(),byPayer=new Map();
  for(const e of ex){const sh=expShares(e);
    if(e.kind==="gasto"){total+=e.amount;myShare+=sh[g.meId]||0;if(e.paidBy===g.meId)myPaid+=e.amount;const c=e.cat||"Sin categoría";byCat.set(c,(byCat.get(c)||0)+e.amount);byPayer.set(e.paidBy,(byPayer.get(e.paidBy)||0)+e.amount);}
    else if(e.kind==="ingreso"){income+=e.amount;myShare-=sh[g.meId]||0;}}
  return{total,income,myShare,myPaid,byCat,byPayer,n:ex.length,bal:groupBalances(g)};}
function groupTotals(){let owed=0,owe=0,n=0;for(const g of S.groups){if(!g.archived)n++;const b=groupBalances(g)[g.meId]||0;if(b>0)owed+=b;else owe-=b;}return{owed,owe,net:Math.round((owed-owe)*100)/100,n};}
const memberUsed=(g,id)=>S.gexp.some(e=>e.groupId===g.id&&(e.paidBy===id||e.to===id||+(e.split?.w?.[id]||0)>0));

/* Lo que cada gasto del grupo deja en tu control de gastos */
function ledgerPlan(e,g){const me=g.meId;const my=expShares(e)[me]||0;
  if(e.kind==="gasto"){if(e.paidBy===me&&e.accountId)return{type:"gasto",amount:e.amount,accountId:e.accountId,share:my,cat:e.cat||"Sin categoría"};
    if(my>0)return{type:"gasto",amount:0,accountId:null,share:my,cat:e.cat||"Sin categoría"};return null;}
  if(e.kind==="ingreso"){if(e.paidBy===me&&e.accountId)return{type:"ingreso",amount:e.amount,accountId:e.accountId,share:my,cat:"Reembolsos"};
    if(my>0)return{type:"ingreso",amount:0,accountId:null,share:my,cat:"Reembolsos"};return null;}
  if(e.kind==="reembolso"&&e.accountId){if(e.paidBy===me)return{type:"gasto",amount:e.amount,accountId:e.accountId,share:0,cat:"Grupos",desc:"Pago a "+memberName(g,e.to)+" · "+g.name};
    if(e.to===me)return{type:"ingreso",amount:e.amount,accountId:e.accountId,share:0,cat:"Grupos",desc:"Cobro de "+memberName(g,e.paidBy)+" · "+g.name};}
  return null;}
async function syncLedger(e,g){const want=ledgerPlan(e,g);
  if(want)return await put("tx",e.txId||null,{desc:e.title||"Gasto compartido",date:e.date,gexp:e.id,recurring:false,created:e.created||Date.now(),...want});
  if(e.txId)await del("tx",e.txId).catch(()=>{});return null;}
function ledgerPreview(e,g){if(!g)return"";const me=g.meId;const my=expShares(e)[me]||0;const A=+e.amount||0;const acc=e.accountId?accName(e.accountId):null;
  if(e.kind==="gasto"){if(e.paidBy===me){const lent=A-my;return acc?`Sale ${eur(A)} de ${esc(acc)}, pero en tu análisis solo cuenta tu parte (${eur(my)}).${lent>0?` Te deben ${eur(lent)}.`:""}`:`No mueve ninguna cuenta. En tu análisis cuenta tu parte (${eur(my)}).${A-my>0?` Te deben ${eur(A-my)}.`:""}`;}
    return my>0?`Tu parte (${eur(my)}) cuenta como gasto en tu análisis, sin tocar tus cuentas. Se la debes a ${esc(memberName(g,e.paidBy))}.`:"No participas: no cambia nada en tus cuentas.";}
  if(e.kind==="ingreso"){if(e.paidBy===me)return acc?`Entran ${eur(A)} en ${esc(acc)}; como ingreso solo cuenta tu parte (${eur(my)}).`:`En tu análisis cuenta tu parte (${eur(my)}) como ingreso.`;
    return my>0?`Tu parte (${eur(my)}) cuenta como ingreso; ${esc(memberName(g,e.paidBy))} te la debe.`:"No participas: no cambia nada en tus cuentas.";}
  if(e.paidBy===me)return acc?`Sale ${eur(A)} de ${esc(acc)}. No cuenta como gasto: estás saldando una deuda.`:"No mueve tus cuentas; solo ajusta los saldos del grupo.";
  if(e.to===me)return acc?`Entran ${eur(A)} en ${esc(acc)}. No cuenta como ingreso: te están devolviendo dinero.`:"No mueve tus cuentas; solo ajusta los saldos del grupo.";
  return"Pago entre otras personas: no cambia nada en tus cuentas.";}

function gexpRow(e,g){const me=g.meId;const sh=expShares(e);const my=sh[me]||0;const n=Object.keys(sh).length;

  else{const d=my-(e.paidBy===me?e.amount:0);if(d>0.004){note="te deben "+eur(d);cls="pos";}else if(d<-0.004){note="debes "+eur(-d);cls="neg";}else note="no participas";}

   <div class="split"><div><small>Te deben</small><b class="num money pos">${eur(t.owed)}</b></div><div><small>Debes</small><b class="num money neg">${eur(t.owe)}</b></div></div></section>

   ${act.length?act.map(card).join(""):`<div class="empty"><b>Sin grupos</b>Crea uno para un viaje, el piso o las cenas con amigos y apunta quién paga qué.</div>`}</section>
  ${arch.length?`<section class="card"><button class="link" data-act="showarch" style="padding:0">${S.showArch?"Ocultar":"Ver"} archivados (${arch.length})</button>${S.showArch?`<div style="margin-top:6px">${arch.map(card).join("")}</div>`:""}</section>`:""}
  <p class="mini" style="margin:0 4px">Consejo: al registrar un gasto con +, pulsa «Dividir en grupo» y se reparte sin apuntarlo dos veces.</p></div>`}

    ${plan.length?`<p class="mini" style="margin:8px 0 0">Con ${plan.length} ${plan.length===1?"pago":"pagos"} quedáis todos a cero. «Saldar» lo apunta como reembolso y, si es contigo, en tu cuenta.</p>`:""}</section>`;
  else{const cats=[...st.byCat].sort((a,c)=>c[1]-a[1]);const pays=[...st.byPayer].sort((a,c)=>c[1]-a[1]);const n=(g.members||[]).length||1;
    body=`<section class="card"><div class="kpis"><div class="kpi"><small>Gasto del grupo</small><b class="num money">${eur(st.total)}</b></div><div class="kpi"><small>Media por persona</small><b class="num money">${eur(st.total/n)}</b></div><div class="kpi"><small>Tu gasto real</small><b class="num money">${eur(st.myShare)}</b></div><div class="kpi"><small>Has pagado tú</small><b class="num money">${eur(st.myPaid)}</b></div></div>${st.income?`<p class="mini" style="margin:10px 0 0">Ingresos del grupo (devoluciones, fianzas…): ${eur(st.income)}</p>`:""}</section>
    <section class="card"><div class="eyebrow" style="margin-bottom:6px">Por categoría</div>${cats.length?cats.map(([c,v])=>`<div class="row">${icoBox(c,catColor(c))}<span class="mid"><span class="t">${esc(c)}</span><span class="meter"><i style="width:${v/cats[0][1]*100}%;background:${catColor(c)}"></i></span></span><span class="pct num">${Math.round(v/st.total*100)}%</span><span class="amt num money">${eur(v)}</span></div>`).join(""):`<div class="empty">Sin gastos</div>`}</section>
    <section class="card"><div class="eyebrow" style="margin-bottom:6px">Quién ha pagado</div>${pays.map(([id,v])=>`<div class="row"><span class="ico" style="background:var(--surface-2)">${esc(initials(memberName(g,id)))}</span><span class="mid"><span class="t">${esc(memberName(g,id))}</span><span class="meter"><i style="width:${v/pays[0][1]*100}%;background:var(--accent)"></i></span></span><span class="amt num money">${eur(v)}</span></div>`).join("")||`<div class="empty">Sin gastos</div>`}</section>`;}
  return`<div class="top"><button class="icon-btn" data-act="groupsback" aria-label="Volver a grupos">${ic("l")}</button><div class="hello" style="flex:1;min-width:0"><h1 style="font-size:24px">${esc(g.name)}</h1><p style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${(g.members||[]).map(m=>esc(m.id===me?"Tú":m.name)).join(", ")}</p></div><button class="icon-btn" data-act="editgroup" aria-label="Editar grupo">${ic("pen")}</button></div>
  <div class="stack" style="margin-top:10px"><section class="card hero"><div class="eyebrow">Tu saldo en el grupo</div><div class="big num money">${Math.abs(b)<0.005?"0,00 €":seur(b)}</div><span class="chip">${b>0.004?"Te deben "+eur(b):b<-0.004?"Debes "+eur(-b):"Estás en paz"}</span>

  <div>${body}</div></div>`}

function groupSheet(g){const st={name:g?.name||"",members:g?JSON.parse(JSON.stringify(g.members)):[{id:uid(),name:S.profile.name||"Pablo"}],archived:!!g?.archived,confirm:false};
  if(!g)st.meId=st.members[0].id;else st.meId=g.meId;
  const pull=sh=>{st.name=sh.querySelector("#g-name").value;sh.querySelectorAll("[data-mid]").forEach(i=>{const m=st.members.find(x=>x.id===i.dataset.mid);if(m)m.name=i.value;});};
  const draw=sh=>{sh.innerHTML=`<div class="grab"></div>${sheetHead(g?"Editar grupo":"Nuevo grupo")}
   <div class="field"><label for="g-name">Nombre</label><input class="inp" id="g-name" value="${esc(st.name)}" placeholder="Viaje a Lisboa, Piso, Cenas…" ${g?"":"autofocus"}></div>
   <div class="field"><span class="lab">Participantes</span>${st.members.map(m=>{const locked=m.id===st.meId||(g&&memberUsed(g,m.id));return`<div class="mrow"><input class="inp" data-mid="${m.id}" value="${esc(m.name)}" aria-label="Nombre del participante" ${m.id===st.meId?'placeholder="Tu nombre"':""}>${m.id===st.meId?'<span class="tag pend">Tú</span>':`<button class="icon-btn" data-k="rm" data-id="${m.id}" aria-label="Quitar" ${locked?'disabled title="Tiene gastos en el grupo" style="opacity:.35"':""}>${ic("x")}</button>`}</div>`}).join("")}

   sh.querySelector("#g-new").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sh.querySelector('[data-k="add"]').click();}});};
  openSheet("",sh=>{draw(sh);sh.addEventListener("click",async e=>{const b=e.target.closest("[data-k]");if(!b||b.disabled)return;const k=b.dataset.k;
    if(k==="add"){pull(sh);const v=sh.querySelector("#g-new").value.trim();if(!v)return toast("Escribe un nombre");st.members.push({id:uid(),name:v});draw(sh);sh.querySelector("#g-new").focus();}
    else if(k==="rm"){pull(sh);st.members=st.members.filter(m=>m.id!==b.dataset.id);draw(sh);}
    else if(k==="arch"){st.archived=!st.archived;b.setAttribute("aria-checked",st.archived);}
    else if(k==="del"){pull(sh);st.confirm=true;draw(sh);}else if(k==="delno"){st.confirm=false;draw(sh);}
    else if(k==="delok"){b.disabled=true;for(const x of S.gexp.filter(x=>x.groupId===g.id)){if(x.txId)await del("tx",x.txId).catch(()=>{});await del("gexp",x.id).catch(()=>{});}await del("groups",g.id);S.groupId=null;closeSheet();toast("Grupo borrado");}
    else if(k==="save"){pull(sh);const pend=sh.querySelector("#g-new").value.trim();if(pend)st.members.push({id:uid(),name:pend});
      const name=st.name.trim();if(!name)return toast("Pon un nombre al grupo");

      if(members.length<2)return toast("Añade al menos otra persona");b.disabled=true;
      try{const id=await put("groups",g?.id,{name,members,meId:st.meId,archived:st.archived,created:g?.created||Date.now(),color:g?.color||PAL[S.groups.length%PAL.length]});
        closeSheet();if(!g){S.tab="groups";S.groupId=id;S.gTab="gastos";render();}toast(g?"Grupo guardado":"Grupo creado");}catch{b.disabled=false;}}});});}

  const draw=sh=>{const g=grp(st.groupId);const me=g.meId;const opts=(sel,ex)=>g.members.filter(m=>m.id!==ex).map(m=>`<option value="${m.id}" ${m.id===sel?"selected":""}>${esc(m.id===me?"Tú ("+m.name+")":m.name)}</option>`).join("");

    sh.innerHTML=`<div class="grab"></div>${sheetHead(e?"Editar":K==="gasto"?"Nuevo gasto compartido":K==="reembolso"?"Nuevo reembolso":"Nuevo ingreso del grupo")}
    ${!e&&(S.groups.length>1||preset.fromLedger)?`<div class="field"><label for="x-group">Grupo</label><select class="inp" id="x-group">${[...act,...S.groups.filter(x=>x.archived&&x.id===st.groupId)].map(x=>`<option value="${x.id}" ${x.id===st.groupId?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>`:""}
    <div class="seg wide"><button class="g" data-k="kind" data-v="gasto" aria-pressed="${K==="gasto"}">Gasto</button><button class="t" data-k="kind" data-v="reembolso" aria-pressed="${K==="reembolso"}">Reembolso</button><button class="i" data-k="kind" data-v="ingreso" aria-pressed="${K==="ingreso"}">Ingreso</button></div>
    <div class="amount"><input id="x-amt" inputmode="decimal" placeholder="0" value="${String(st.amount).replace(".",",")}" aria-label="Importe en euros" ${e?"":"autofocus"} style="color:${K==="gasto"?"var(--out)":K==="ingreso"?"var(--in)":"var(--info)"}"><span>€</span></div>
    <p class="mini" style="text-align:center;margin:-10px 0 12px">Puedes escribir operaciones: 45+12,80 o 60/4</p>
    <div class="field"><div class="toggle"><span><b>Pagado en otra moneda</b><small>Convierte a euros con el cambio que te aplicaron</small></span><button class="sw" role="switch" data-k="fx" aria-checked="${!!st.fx}" aria-label="Otra moneda"></button></div>
    ${st.fx?`<div class="fx"><input class="inp" id="fx-cur" value="${esc(st.fx.cur||"")}" placeholder="USD" maxlength="4" aria-label="Moneda"><input class="inp num" id="fx-orig" inputmode="decimal" value="${String(st.fx.orig??"").replace(".",",")}" placeholder="Importe" aria-label="Importe en esa moneda"><input class="inp num" id="fx-rate" inputmode="decimal" value="${String(st.fx.rate??"").replace(".",",")}" placeholder="1 = ? €" aria-label="Euros por unidad"></div>`:""}</div>
    ${K!=="reembolso"?`<div class="field"><label for="x-title">Concepto</label><input class="inp" id="x-title" value="${esc(st.title)}" placeholder="${K==="gasto"?"Cena, gasolina, apartamento…":"Devolución de la fianza…"}" autocomplete="off"><div class="sugg" id="x-sugg"></div></div>`:""}
    <div class="${K==="reembolso"?"two-col":""}"><div class="field"><label for="x-paid">${K==="gasto"?"Pagado por":K==="ingreso"?"Recibido por":"De"}</label><select class="inp" id="x-paid">${opts(st.paidBy)}</select></div>
    ${K==="reembolso"?`<div class="field"><label for="x-to">Para</label><select class="inp" id="x-to">${opts(st.to,st.paidBy)}</select></div>`:""}</div>
    ${showAcc()?`<div class="field"><label for="x-acc">${accLbl}</label><select class="inp" id="x-acc">${accOptions(st.accountId,"No vincular a ninguna cuenta")}</select></div>`:""}
    ${K!=="reembolso"?`<div class="field"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="lab">${K==="gasto"?"Para quién":"Entre quién"}</span><div class="seg">${[["igual","A partes iguales"],["partes","Por partes"],["importes","Importes"]].map(([v,l])=>`<button data-k="mode" data-v="${v}" aria-pressed="${st.mode===v}">${l}</button>`).join("")}</div></div>
      <div>${g.members.map(m=>{const on=+(st.w[m.id]||0)>0;return`<div class="mrow">${st.mode==="igual"?`<button class="check" data-k="tog" data-id="${m.id}" aria-pressed="${on}" aria-label="Incluir a ${esc(m.name)}"></button>`:""}<span style="flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.id===me?"Tú":m.name)}</span>${st.mode!=="igual"?`<input class="inp num wsm" data-w="${m.id}" inputmode="decimal" value="${+(st.w[m.id]||0)?String(st.w[m.id]).replace(".",","):""}" placeholder="${st.mode==="partes"?"0":"0,00"}" aria-label="${st.mode==="partes"?"Partes":"Importe"} de ${esc(m.name)}">`:""}<span class="num mini" id="sh-${m.id}" style="width:74px;text-align:right;font-weight:600;color:var(--fg)">—</span></div>`}).join("")}</div>
      ${st.mode==="igual"?`<div class="btns" style="margin-top:6px"><button class="btn ghost sm" data-k="all">Todos</button><button class="btn ghost sm" data-k="onlyme">Solo yo</button><button class="btn ghost sm" data-k="notme">Todos menos yo</button></div>`:st.mode==="partes"?`<p class="mini" style="margin:6px 0 0">Ej.: 2 partes para quien fue con pareja, 1 para el resto.</p>`:""}<p class="mini" id="rem" style="margin:6px 0 0;font-weight:600"></p></div>`:""}
    ${K==="gasto"?`<div class="field"><label for="x-cat">Categoría</label><select class="inp" id="x-cat">${["Sin categoría",...CATS.gasto].map(c=>`<option ${c===st.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`:""}
    <div class="field"><label for="x-date">Fecha</label><input class="inp" type="date" id="x-date" value="${st.date}"></div>
    <div class="banner" style="margin-bottom:14px"><b>En tu control de gastos:</b> <span id="pv"></span></div>
    <div class="btns">${e?(st.confirm?`<button class="btn danger" data-k="delok">Sí, borrar</button><button class="btn ghost" data-k="delno">Cancelar</button>`:`<button class="btn danger" data-k="del">Borrar</button>`):""}${st.confirm?"":`<button class="btn" data-k="save">Guardar</button>`}</div>`;
    const on=(sel,ev,fn)=>sh.querySelector(sel)?.addEventListener(ev,fn);
    on("#x-amt","input",ev=>{st.amount=ev.target.value;update(sh);});
    const fxCalc=()=>{const o=parseAmt(st.fx.orig),r=parseAmt(st.fx.rate);if(o&&r){st.amount=(Math.round(o*r*100)/100).toFixed(2);sh.querySelector("#x-amt").value=st.amount.replace(".",",");update(sh);}};
    on("#fx-cur","input",ev=>st.fx.cur=ev.target.value.toUpperCase());on("#fx-orig","input",ev=>{st.fx.orig=ev.target.value;fxCalc();});on("#fx-rate","input",ev=>{st.fx.rate=ev.target.value;fxCalc();});
    const sugg=()=>{const box=sh.querySelector("#x-sugg");if(!box||K!=="gasto")return;const s=suggestCat("gasto",st.title);
      if(s&&!st.manualCat&&s.cat!==st.cat){st.cat=s.cat;const sel=sh.querySelector("#x-cat");if(sel)sel.value=s.cat;}
      box.innerHTML=s?(s.cat===st.cat?`Categoría automática: <b style="color:var(--fg)">${esc(s.cat)}</b> (${s.why})`:`Sugerida: <button data-k="sugcat" data-v="${esc(s.cat)}">${esc(s.cat)}</button>`):"";};
    on("#x-title","input",ev=>{st.title=ev.target.value;sugg();});
    on("#x-cat","change",ev=>{st.cat=ev.target.value;st.manualCat=true;sugg();});
    on("#x-group","change",ev=>{st.groupId=ev.target.value;const g=grp(st.groupId);st.w=allW(g);st.paidBy=g.meId;st.to=(g.members.find(m=>m.id!==g.meId)||{}).id||"";draw(sh);});
    on("#x-paid","change",ev=>{st.paidBy=ev.target.value;if(st.to===st.paidBy)st.to=(g.members.find(m=>m.id!==st.paidBy)||{}).id||"";draw(sh);});
    on("#x-to","change",ev=>{st.to=ev.target.value;draw(sh);});
    on("#x-acc","change",ev=>{st.accountId=ev.target.value;update(sh);});
    on("#x-date","change",ev=>st.date=ev.target.value);
    sh.querySelectorAll("[data-w]").forEach(i=>i.addEventListener("input",ev=>{st.w[i.dataset.w]=parseAmt(ev.target.value);update(sh);}));
    sugg();update(sh);};
  openSheet("",sh=>{draw(sh);sh.addEventListener("click",async ev=>{const b=ev.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;const g=grp(st.groupId);const me=g.meId;
    if(k==="kind"){st.kind=b.dataset.v;if(st.kind==="reembolso"&&(!st.to||st.to===st.paidBy))st.to=(g.members.find(m=>m.id!==st.paidBy)||{}).id||"";draw(sh);}
    else if(k==="fx"){st.fx=st.fx?null:{cur:"",orig:"",rate:""};draw(sh);}
    else if(k==="sugcat"){st.cat=b.dataset.v;st.manualCat=true;draw(sh);}
    else if(k==="mode"){const prev=st.mode;st.mode=b.dataset.v;const inc=g.members.filter(m=>+(st.w[m.id]||0)>0).map(m=>m.id);const ids=inc.length?inc:g.members.map(m=>m.id);
      if(st.mode==="importes"){const al=allocate(parseAmt(st.amount),ids.map(id=>[id,prev==="partes"?+st.w[id]:1]));st.w=Object.fromEntries(g.members.map(m=>[m.id,al[m.id]||0]));}
      else st.w=Object.fromEntries(g.members.map(m=>[m.id,ids.includes(m.id)?(st.mode==="partes"&&prev==="partes"?st.w[m.id]:1):0]));draw(sh);}
    else if(k==="tog"){const id=b.dataset.id;st.w[id]=+(st.w[id]||0)>0?0:1;b.setAttribute("aria-pressed",st.w[id]>0);update(sh);}
    else if(k==="all"||k==="onlyme"||k==="notme"){st.w=Object.fromEntries(g.members.map(m=>[m.id,k==="all"?1:k==="onlyme"?(m.id===me?1:0):(m.id===me?0:1)]));draw(sh);}
    else if(k==="del"){st.confirm=true;draw(sh);}else if(k==="delno"){st.confirm=false;draw(sh);}
    else if(k==="delok"){b.disabled=true;if(e.txId)await del("tx",e.txId).catch(()=>{});await del("gexp",e.id);closeSheet();toast("Borrado");}
    else if(k==="save"){const amount=parseAmt(st.amount);if(amount<=0)return toast("Escribe un importe mayor que 0");
      const c=cur();
      if(st.kind==="reembolso"){if(!st.to||st.to===st.paidBy)return toast("Elige a quién va el reembolso");}
      else{const shs=expShares(c);if(!Object.keys(shs).length)return toast("Elige al menos una persona");
        if(st.mode==="importes"){const s=Object.values(shs).reduce((a,b)=>a+b,0);if(Math.abs(s-amount)>=0.005)return toast(`Los importes suman ${eur(s)}, no ${eur(amount)}`);}}
      b.disabled=true;
      try{const id=e?.id||S.db.collection("gexp").doc().id;
        const w=st.kind==="reembolso"?{}:Object.fromEntries(Object.entries(st.w).filter(([,v])=>+v>0).map(([k2,v])=>[k2,+v]));
        const doc={groupId:st.groupId,kind:st.kind,amount,title:st.kind==="reembolso"?"":st.title.trim(),cat:st.kind==="gasto"?st.cat:null,paidBy:st.paidBy,to:st.kind==="reembolso"?st.to:null,
          accountId:showAcc()?(st.accountId||null):null,split:{mode:st.kind==="reembolso"?"igual":st.mode,w},date:st.date||today(),fx:st.fx&&st.fx.cur?{cur:st.fx.cur,orig:parseAmt(st.fx.orig),rate:parseAmt(st.fx.rate)}:null,created:e?.created||Date.now()};
        const txId=await syncLedger({...doc,id,txId:st.txId},g);
        await put("gexp",id,{...doc,txId:txId||null});closeSheet();toast(preset.fromLedger?"Gasto repartido en "+g.name:"Guardado");}catch{b.disabled=false;}}});});}
async function copySummary(g){const bal=groupBalances(g);const plan=settlePlan(bal);const st=groupStats(g);
  const nm=id=>{const m=g.members.find(x=>x.id===id);return m?m.name:"?"};
  const txt=[`${g.name} — cuentas`,`Gasto total: ${eur(st.total)} (${eur(st.total/(g.members.length||1))} por persona)`,"",
    "Saldos:",...g.members.map(m=>`• ${m.name}: ${Math.abs(bal[m.id]||0)<0.005?"en paz":seur(bal[m.id])}`),"",
    plan.length?"Para saldar:":"Todo saldado ✔",...plan.map(p=>`• ${nm(p.from)} paga ${eur(p.amt)} a ${nm(p.to)}`)].join("\n");
  try{await navigator.clipboard.writeText(txt);toast("Resumen copiado: pégalo en WhatsApp");}
  catch{openSheet(`${sheetHead("Resumen del grupo")}<textarea class="inp" id="sumtxt" rows="12" readonly style="font:inherit;resize:vertical">${esc(txt)}</textarea><p class="mini">Mantén pulsado para seleccionar y copiar.</p>`,sh=>{const t=sh.querySelector("#sumtxt");t.focus();t.select();});}}

/* ---------- Eventos ---------- */
let toastT;function toast(m){clearTimeout(toastT);let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}t.textContent=m;toastT=setTimeout(()=>t.remove(),2600);}
document.addEventListener("click",async e=>{
  if(e.target.matches(".scrim")){closeSheet();return;}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="close")closeSheet();
  else if(a==="tab"){closeSheet();if(b.dataset.tab==="groups"&&S.tab==="groups")S.groupId=null;S.tab=b.dataset.tab;S.q="";render();window.scrollTo(0,0);}
  else if(a==="mprev"){S.ym=shiftYm(S.ym,-1);render();}else if(a==="mnext"){S.ym=shiftYm(S.ym,1);render();}
  else if(a==="new"){if(S.tab==="groups"&&S.groupId)gexpSheet(null,{groupId:S.groupId});else txSheet();}
  else if(a==="opengroup"){S.groupId=b.dataset.id;S.gTab="gastos";render();window.scrollTo(0,0);}
  else if(a==="groupsback"){S.groupId=null;render();}
  else if(a==="newgroup")groupSheet();else if(a==="editgroup")groupSheet(S.groups.find(g=>g.id===S.groupId));
  else if(a==="gtab"){S.gTab=b.dataset.v;render();}
  else if(a==="showarch"){S.showArch=!S.showArch;render();}
  else if(a==="newgexp")gexpSheet(null,{groupId:S.groupId,kind:b.dataset.k||"gasto"});
  else if(a==="editgexp")gexpSheet(S.gexp.find(e=>e.id===b.dataset.id));
  else if(a==="settle"){gexpSheet(null,{groupId:S.groupId,kind:"reembolso",paidBy:b.dataset.from,to:b.dataset.to,amount:+b.dataset.amt});}
  else if(a==="copysum")copySummary(S.groups.find(g=>g.id===S.groupId));
  else if(a==="edittx"){const t=S.tx.find(x=>x.id===b.dataset.id);if(t?.gexp){const ge=S.gexp.find(e=>e.id===t.gexp);if(ge){gexpSheet(ge);return;}}if(t?.linked){const mv=S.betmoves.find(m=>m.id===t.linked);if(mv){moveSheet(mv);return;}}txSheet(t);}
  else if(a==="regrec"){const t=S.tx.find(x=>x.id===b.dataset.id);txSheet(null,{...t,date:b.dataset.date,cat:t.cat});}
  else if(a==="settings")settingsSheet();
  else if(a==="hide"){S.hide=!S.hide;render();}
  else if(a==="newacc")accSheet();else if(a==="editacc")accSheet(S.accounts.find(x=>x.id===b.dataset.id));
  else if(a==="patr"){S.patRange=b.dataset.r;render();}
  else if(a==="accf"){const id=b.dataset.id;if(!id)S.acctFilter.clear();else S.acctFilter.has(id)?S.acctFilter.delete(id):S.acctFilter.add(id);render();}
  else if(a==="anam"){S.anaMode=b.dataset.m;render();}
  else if(a==="catdetail")catDetail(b.dataset.cat);
  else if(a==="newbet")betSheet();else if(a==="editbet")betSheet(S.bets.find(x=>x.id===b.dataset.id));
  else if(a==="newmove")moveSheet(null,b.dataset.k);else if(a==="editmove")moveSheet(S.betmoves.find(x=>x.id===b.dataset.id));
  else if(a==="newplat")platSheet();else if(a==="editplat")platSheet(S.platforms.find(x=>x.id===b.dataset.id));
  else if(a==="betview"){S.betView=b.dataset.v;render();}
  else if(a==="export")exportCsv();
  else if(a==="insights")insightsSheet();
  else if(a==="budget")budgetSheet();
  else if(a==="anabudg"){S.tab="ana";S.anaView="budg";render();window.scrollTo(0,0);}
  else if(a==="inscat"){S.ym=curYm();S.anaMode="gasto";render();catDetail(b.dataset.cat);}
  else if(a==="homecat"){S.anaMode="gasto";catDetail(b.dataset.cat);}
  else if(a==="homeinc"){S.anaMode="ingreso";catDetail(b.dataset.cat);}
  else if(a==="day")daySheet(b.dataset.d);
  else if(a==="newon")txSheet(null,{date:b.dataset.d});
  else if(a==="anav"){S.anaView=b.dataset.v;render();}
  else if(a==="merch")merchSheet(b.dataset.k);
  else if(a==="newgoal")goalSheet();
  else if(a==="editgoal"){const g=S.goals.find(x=>x.id===b.dataset.id);if(g)goalSheet(g);}
  else if(a==="backup")exportJson();
  else if(a==="restore")pickRestore();
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById("q");q.focus();q.setSelectionRange(pos,pos);}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")render();});
boot();
})();
</script>
