function startLoop(){P.last=performance.now();cancelAnimationFrame(P.raf);const loop=now=>{if(!P.open)return;const dt=Math.min(.5,(now-P.last)/1000);P.last=now;if(P.run){P.el+=dt;P.spent+=dt}frame(false);P.raf=requestAnimationFrame(loop)};P.raf=requestAnimationFrame(loop)}
function frame(force){
  if(P.stage!=="run")return;const s=P.steps[P.idx];if(!s)return;
  if(P.el>=s.dur){advance(1,true);return}
  const done=P.steps.slice(0,P.idx).reduce((a,x)=>a+x.dur,0)+P.el;const pr=document.getElementById("pProg");if(pr)pr.style.width=(done/P.total*100)+"%";
  const left=s.dur-P.el;const $=id=>document.getElementById(id);
  if(s.type==="mob"){
    const prep=8;let sub,remain,frac;
    if(P.el<prep){sub="Prepárate";remain=prep-P.el;frac=P.el/prep}
    else{const e=P.el-prep;const side=s.m.sides?(e<s.m.dur?1:2):0;
      if(side&&side!==P.lastSide){if(P.lastSide){bell("soft");say("Cambia de lado")}else{bell("soft");say(s.m.sides?"Empieza por el lado derecho":"Mantén y respira",true)}P.lastSide=side}
      else if(!s.m.sides&&!P.lastSide){bell("soft");P.lastSide=1}
      const e2=s.m.sides?(e%s.m.dur):e;remain=s.m.dur-e2;frac=e2/s.m.dur;sub=side===1?"Lado derecho":side===2?"Lado izquierdo":"Mantén y respira"}
    {const r=Math.ceil(remain);if(r<=3&&r>=1&&P.lastTick!==P.idx+"-"+(P.lastSide||0)+"-"+r){P.lastTick=P.idx+"-"+(P.lastSide||0)+"-"+r;bell("count")}}
    if($("pTime"))$("pTime").textContent=Math.ceil(remain);if($("pSub"))$("pSub").textContent=sub;
    if($("pRing"))$("pRing").setAttribute("stroke-dashoffset",(326.7*frac).toFixed(1));
  }else if(s.type==="breath"){
    const B=BREATHS[s.b];const cyc=B.ph.reduce((a,p)=>a+p[1],0);const lead=C.cfg.voice?10:3;
    if(P.el<lead){if($("pPhase"))$("pPhase").textContent="Prepárate";if($("pCount"))$("pCount").textContent=Math.ceil(lead-P.el);setOrb(.62);}
    else{const e=P.el-lead;let x=e%cyc;let i=0;while(x>=B.ph[i][1]){x-=B.ph[i][1];i++}
      const ph=B.ph[i];const f=x/ph[1];const key=Math.floor(e/cyc)+"-"+i;
      if(key!==P.lastPhase){P.lastPhase=key;if($("pPhase"))$("pPhase").textContent=ph[2];bell(ph[0].startsWith("in")?"in":ph[0]==="out"?"out":"hold");say(ph[2])}
      if($("pCount"))$("pCount").textContent=Math.ceil(ph[1]-x);
      // escala: inhalar crece, exhalar decrece, retener se mantiene
      const lo=.55,hi=1,mid=B.ph.some(q=>q[0]==="in2")?lo+.8*(hi-lo):hi;
      const tgt=p=>p[0]==="in"?mid:p[0]==="in2"?hi:p[0]==="out"?lo:null;
      let lv=lo;for(let j=0;j<i;j++){const g=tgt(B.ph[j]);if(g!=null)lv=g}
      const g=tgt(ph);const sc=g==null?lv:lv+(g-lv)*(ph[0]==="out"?1-Math.pow(1-f,1.6):f);
      setOrb(sc);
      if($("pCycles"))$("pCycles").textContent="ciclo "+(Math.floor(e/cyc)+1);}
    if($("pTime"))$("pTime").textContent=fmtClock(left)+" restantes";
  }else{
    if(s.type==="med"){let ci=-1;s.cues.forEach((c,i)=>{if(c.at<=P.el)ci=i});
      if(ci!==P.lastCue){P.lastCue=ci;const el=$("pCue");if(el&&ci>=0){el.classList.remove("in");void el.offsetWidth;el.textContent=s.cues[ci].text;el.classList.add("in");say(s.cues[ci].text)}}}

    if($("pTime"))$("pTime").textContent=fmtClock(left);
  }
}

function calmAction(a,b){
  switch(a){
    case"c-goto":go("calma");break;

    case"c-reroll":C.reroll++;render();break;
    case"c-part":C.cfg.parts[b.dataset.k]=b.checked;saveCalmCfg();render();break;
    case"c-min":{const k=b.dataset.k;const lim={mobMin:[3,25],breathMin:[2,15],medMin:[3,30]}[k];C.cfg[k]=Math.min(lim[1],Math.max(lim[0],C.cfg[k]+(+b.dataset.n)));saveCalmCfg();render();break}
    case"c-set":C.cfg[b.dataset.k]=b.checked;saveCalmCfg();if(b.dataset.k==="sound"&&b.checked)bell("soft");if(b.dataset.k==="voice"&&b.checked)say("Voz activada");break;
    case"c-start":{unlockAudio();const f=curFocus();const sess=buildSession(todayStr(),f,C.reroll);openPlayer(sessionSteps(sess),"Sesión de hoy · "+FOCI[f].name);break}
    case"c-solotype":C.soloType=b.dataset.k;render();break;
    case"c-solo":{unlockAudio();const d=C.soloMin*60;let st,title;
      if(C.soloType==="breath"){st=[{type:"breath",b:C.soloBreath,dur:d}];title=BREATHS[C.soloBreath].name}
      else if(C.soloType==="med"){st=[{type:"med",k:C.soloMed,dur:d}];title=MEDS[C.soloMed].name}
      else{st=[{type:"timer",dur:d}];title="Meditación en silencio"}
      openPlayer(st,title,true);break}
    case"c-close":closePlayer();break;
    case"c-mb":P.mb=+b.dataset.v;renderPlayer();break;
    case"c-ma":P.note=(document.getElementById("calmNote")||{}).value||"";P.ma=+b.dataset.v;renderPlayer();break;
    case"c-go":unlockAudio();P.stage="run";P.run=true;wake();bell("bell");startLoop();renderPlayer();break;
    case"c-toggle":P.run=!P.run;if(P.run){wake();P.last=performance.now()}else{try{speechSynthesis.cancel()}catch(e){}}const pb=document.getElementById("pPlay");if(pb){pb.textContent=P.run?"❚❚":"▶";pb.setAttribute("aria-label",P.run?"Pausa":"Reanudar")}break;

function mdLite(t){

  esc(t).split(/\n/).forEach(line=>{const l=line.trim();
    const b=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");

${calmMin?`- Ese día hizo ${calmMin} min de movilidad, respiración o meditación.\n`:""}${tags?`- Ese día hubo: ${tags}.\n`:""}${SL.mood?`- Cómo se levantó (1 = fatal, 5 = genial): ${SL.mood}.\n`:""}${SL.note.trim()?`- Su nota: "${SL.note.trim().slice(0,400)}"\n`:""}${recent?`- Noches anteriores:\n${recent}\n`:""}

async function runAnalysis(reuse){
  const ds=sleepDate();if(!SL.sample||SL.busy)return;
  let images=null,manualText="";
  if(reuse){const n=SL.nights[ds];if(!n)return;manualText=Object.entries(n.metrics||{}).filter(([k,v])=>v!=null).map(([k,v])=>`${(MET.find(x=>x[0]===k)||[k,k])[1]}: ${isDur(k)?fmtH(v):v}`).join("; ")+(n.extra&&n.extra.length?"; "+n.extra.map(x=>x.label+": "+x.value).join("; "):"");
    if(n.ctx){SL.mood=SL.mood||n.ctx.mood||null;if(!SL.tags.length)SL.tags=n.ctx.tags||[];if(!SL.note)SL.note=n.ctx.note||""}}
  else if(SL.files.length&&SL.imgOK){images=SL.files.map(f=>f.file)}
  else{const mm=manMetrics();if(!mm){SL.err="Apunta al menos las horas dormidas.";render();return}manualText=Object.entries(mm).filter(([k,v])=>v!=null).map(([k,v])=>`${(MET.find(x=>x[0]===k)||[k,k==="bedtime"?"Se acostó":"Se levantó"])[1]}: ${isDur(k)?fmtH(v):v}`).join("; ")}
  SL.busy=true;SL.err="";SL.progress=images?"Claude está leyendo tu captura…":"Claude está analizando tus datos…";render();
  const ctl=new AbortController();SL.ctl=ctl;
  try{
    const res=await SL.sample.json(sleepPrompt(ds,{images:images?images.length:0,manualText}),{images:images||undefined,cache:false,signal:ctl.signal,onText:()=>{if(SL.progress!=="Escribiendo el análisis…"){SL.progress="Escribiendo el análisis…";const b=document.querySelector(".busy b");if(b)b.textContent=SL.progress}}});
    if(!res||res.ok===false){SL.err=(res&&res.reason)?"Claude dice: "+res.reason:"No he podido leer datos de sueño en esa imagen. Prueba con otra captura.";return}
    const metrics={};MET.forEach(([k])=>{const v=res.metrics&&res.metrics[k];metrics[k]=(v===null||v===undefined||v===""||isNaN(+v))?null:+v});
    ["bedtime","waketime"].forEach(k=>{const v=res.metrics&&res.metrics[k];metrics[k]=(typeof v==="string"&&/^\d{1,2}:\d{2}$/.test(v.trim()))?v.trim().padStart(5,"0"):null});
    if(reuse){const old=SL.nights[ds].metrics||{};Object.keys(old).forEach(k=>{if(old[k]!=null)metrics[k]=old[k]})}
    else if(!images){const mm=manMetrics();Object.keys(mm).forEach(k=>{if(mm[k]!=null)metrics[k]=mm[k]})}
    const a=res.analysis||{};const clean=x=>Array.isArray(x)?x.filter(s=>typeof s==="string"&&s.trim()).slice(0,6):[];
    const analysis={grade:Math.max(1,Math.min(5,Math.round(+a.grade||3))),headline:String(a.headline||"").slice(0,90),summary:String(a.summary||""),positives:clean(a.positives),improve:clean(a.improve),
      tips:(Array.isArray(a.tips)?a.tips:[]).filter(t=>t&&t.title).slice(0,6).map(t=>({title:String(t.title),detail:String(t.detail||""),category:String(t.category||"consejo")})),tonight:clean(a.tonight),warning:a.warning?String(a.warning):null};
    const extra=(Array.isArray(res.extra)?res.extra:[]).filter(x=>x&&x.label).slice(0,10).map(x=>({label:String(x.label),value:String(x.value)}));
    const prevN=SL.nights[ds];let imgs=reuse&&prevN?(prevN.imgs||[]):[];
    const toStore=reuse?[]:SL.files.map(f=>f.file);
    if(toStore.length&&SL.assets&&SL.cfg.keepImgs){SL.progress="Guardando la captura…";const b=document.querySelector(".busy b");if(b)b.textContent=SL.progress;
      for(const f of toStore){try{const small=await shrink(f);const up=await SL.assets.upload(small,{type:small.type});imgs.push(up.id)}catch(e){}}}
    const doc={date:ds,createdAt:new Date().toISOString(),app:res.app?String(res.app):(prevN&&prevN.app)||null,metrics,extra:reuse&&prevN?(prevN.extra||[]):extra,analysis,imgs,manual:!images&&!reuse?true:!!(reuse&&prevN&&prevN.manual),
      ctx:{mood:SL.mood,tags:SL.tags.slice(),note:SL.note.trim(),prev:prevDayHabits(ds).reduce((o,h)=>(o[h.id]=h.done,o),{})},tonightDone:[]};
    saveNight(doc);
    SL.files.forEach(f=>URL.revokeObjectURL(f.url));SL.files=[];SL.mood=null;SL.tags=[];SL.note="";SL.man={};SL.manual=false;SL.editing=false;
    toast("Noche analizada");
  }catch(e){
    const c=e&&e.code;
    if(c==="cancelled"){}
    else if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed"){SL.err="No se ha dado permiso para usar Claude desde esta página. Puedes apuntar los datos a mano.";}
    else if(c==="images_unavailable"){SL.imgOK=false;SL.err="Aquí no se pueden enviar imágenes a Claude. Apunta los datos a mano y te los analiza igual.";SL.manual=true}
    else if(c==="image_rejected")SL.err="Claude no ha podido abrir esa imagen. Prueba con otra captura en PNG o JPG.";
    else if(c==="rate_limited")SL.err="Has llegado al límite de uso por ahora. Prueba dentro de un rato.";
    else if(c==="invalid_json"||c==="empty_completion")SL.err="La respuesta salió incompleta. Vuelve a intentarlo.";
    else if(c==="refused")SL.err="Claude no ha querido analizar esa imagen. Prueba con otra captura.";
    else if(c==="session_expired")SL.err="Tu sesión ha caducado. Vuelve a entrar en Claude.";
    else SL.err="Algo ha fallado al hablar con Claude. Vuelve a intentarlo.";
  }finally{SL.busy=false;SL.ctl=null;render()}
}
function manMetrics(){const m=SL.man;const num=k=>m[k]!==undefined&&m[k]!==""&&!isNaN(+m[k])?+m[k]:null;const h=num("asleep_h");if(h==null)return null;
  return{bedtime:m.bedtime||null,waketime:m.waketime||null,asleep_min:Math.round(h*60),deep_min:num("deep_min"),rem_min:num("rem_min"),awake_min:num("awake_min"),score:num("score")}}
async function shrink(file){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1400/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/webp",.82));return b&&b.size<file.size?b:file}catch(e){return file}
}

function sleepAction(a,b){
  switch(a){
    case"s-goto":SL.date=todayStr();go("sueno");break;
    case"s-pick":{const i=document.getElementById("sFile");if(i)i.click();break}
    case"s-day":{const n=addDays(sleepDate(),+b.dataset.n);if(n<=todayStr()){SL.date=n;SL.editing=false;SL.delConfirm=false;render()}break}
    case"s-sel":SL.date=b.dataset.d;SL.editing=false;SL.delConfirm=false;render();window.scrollTo({top:0,behavior:"smooth"});break;
    case"s-rmfile":{const f=SL.files.splice(+b.dataset.i,1)[0];if(f)URL.revokeObjectURL(f.url);render();break}
    case"s-mood":SL.mood=SL.mood===+b.dataset.v?null:+b.dataset.v;render();break;
    case"s-tag":{const k=b.dataset.k;SL.tags=SL.tags.includes(k)?SL.tags.filter(x=>x!==k):SL.tags.concat(k);render();break}
    case"s-manual":SL.manual=!SL.manual;render();break;
    case"s-analyze":runAnalysis(false);break;
    case"s-reanalyze":runAnalysis(true);break;
    case"s-stop":SL.ctl&&SL.ctl.abort();break;
    case"s-savemanual":{const mm=manMetrics();if(!mm)break;const ds=sleepDate();const prev=SL.nights[ds];
      saveNight({date:ds,createdAt:new Date().toISOString(),app:null,metrics:{...(prev&&prev.metrics||{}),...mm},extra:[],analysis:prev&&prev.analysis||null,imgs:prev&&prev.imgs||[],manual:true,ctx:{mood:SL.mood,tags:SL.tags.slice(),note:SL.note.trim()},tonightDone:[]});
      SL.man={};SL.manual=false;SL.mood=null;SL.tags=[];SL.note="";render();toast("Noche guardada");break}
    case"s-edit":SL.editing=true;render();break;
    case"s-editno":SL.editing=false;render();break;
    case"s-tn":{const n=SL.nights[sleepDate()];if(!n)break;const i=+b.dataset.i;const d=(n.tonightDone||[]).slice();const j=d.indexOf(i);if(j>=0)d.splice(j,1);else d.push(i);n.tonightDone=d;saveNight(n);render();break}
    case"s-del":SL.delConfirm=true;render();break;
    case"s-delno":SL.delConfirm=false;render();break;
    case"s-delyes":{const ds=sleepDate();const n=SL.nights[ds];if(!n)break;
      (n.imgs||[]).forEach(id=>{SL.assets&&SL.assets.delete(id).catch(()=>{})});
      delete SL.nights[ds];SL.delConfirm=false;saveLocal();if(db){delete dirty["sleep/"+ds];db.doc("sleep/"+ds).delete().catch(()=>toast("No se pudo borrar. Revisa la conexión."))}render();toast("Noche borrada");break}
    case"s-range":SL.range=+b.dataset.r;render();break;
    case"s-report":runReport();break;
    case"s-keep":SL.cfg.keepImgs=b.checked;saveSleepCfg();break;
  }
}

/* --- gimnasio: cálculos --- */
function exHistory(exId){
  const out=[];woList().slice().reverse().forEach(w=>{(w.exercises||[]).forEach(e=>{if(e.exId!==exId)return;const sets=(e.sets||[]).filter(s=>s.done&&s.t!=="w");if(!sets.length)return;
    let best=null;sets.forEach(s=>{const v=e1rm(+s.kg||0,+s.reps||0);if(!best||v>best.e)best={e:v,kg:+s.kg||0,reps:+s.reps||0}});
    out.push({date:w.date,wid:w.id,sets,best,vol:sets.reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0),maxKg:Math.max(...sets.map(s=>+s.kg||0)),maxReps:Math.max(...sets.map(s=>+s.reps||0)),maxSec:Math.max(...sets.map(s=>+s.sec||0))})})});
  return out;
}
function exPR(exId,before){
  const h=exHistory(exId).filter(x=>!before||x.date<before);if(!h.length)return null;
  const r={e1rm:0,maxKg:0,maxReps:0,maxVol:0,maxSec:0};
  h.forEach(x=>{if(x.best.e>r.e1rm){r.e1rm=x.best.e;r.e1rmSet=x.best;r.e1rmDate=x.date}if(x.maxKg>r.maxKg){r.maxKg=x.maxKg;r.maxKgDate=x.date}if(x.maxReps>r.maxReps)r.maxReps=x.maxReps;if(x.vol>r.maxVol)r.maxVol=x.vol;if(x.maxSec>r.maxSec)r.maxSec=x.maxSec});
  return r;
}

}

/* --- carrera: cálculos (fórmulas VDOT de Daniels) --- */
const vo2=v=>-4.6+.182258*v+.000104*v*v;
const pctMax=t=>.8+.1894393*Math.exp(-.012778*t)+.2989558*Math.exp(-.1932605*t);
const vdotOf=(m,s)=>{const t=s/60;return vo2(m/t)/pctMax(t)};
function predictTime(m,V){let lo=m/1000*2*60,hi=m/1000*15*60;for(let i=0;i<60;i++){const mid=(lo+hi)/2;if(vdotOf(m,mid)>V)lo=mid;else hi=mid}return(lo+hi)/2}
function paceAtFrac(f,V){const o=f*V;const v=(-.182258+Math.sqrt(.182258**2+4*.000104*(o+4.6)))/(2*.000104);return 60000/v}
const BE={Fastest400:400,Fastest1k:1000,FastestMile:1609,Fastest2Mile:3219,Fastest5k:5000,Fastest10k:10000,Fastest15k:15000,Fastest10Mile:16093,Fastest20k:20000,FastestHalfMarathon:21097,Fastest30k:30000,FastestMarathon:42195};
const PRD=[[400,"400 m"],[1000,"1 km"],[1609,"1 milla"],[5000,"5 km"],[10000,"10 km"],[21097,"Media maratón"],[42195,"Maratón"]];
// mejores tramos dentro de una carrera a partir de los parciales por km (ritmo de cada km)
function splitBests(r){
  const sp=(r.splits||[]).filter(x=>x>0);const full=Math.min(sp.length,Math.floor((r.km||sp.length)+.05));const out={};if(full<1)return out;
  const S=sp.slice(0,Math.max(full,Math.min(sp.length,full+1)));
  PRD.forEach(([d])=>{if(d<1000)return;const n=Math.floor(d/1000),fr=d/1000-n;const need=n+(fr>.001?1:0);
    if(need>S.length||(n>full))return;let best=null;
    for(let i=0;i+need<=S.length&&i+n<=full;i++){let t=0;for(let j=0;j<n;j++)t+=S[i+j];if(fr>.001)t+=fr*S[i+n];if(best==null||t<best)best=t}
    if(best!=null)out[d]=Math.round(best)});
  return out;
}
// todos los mejores esfuerzos de una carrera: Strava, parciales y la carrera completa
function runEfforts(r){
  const e={};const put=(d,s,src)=>{if(!s||s<=0)return;if(!e[d]||s<e[d].s)e[d]={s,src}};
  Object.entries(r.best||{}).forEach(([k,s])=>{const d=BE[k];if(d)put(d,s,"strava")});
  Object.entries(splitBests(r)).forEach(([d,s])=>put(+d,s,"parciales"));
  const m=(r.km||0)*1000;PRD.forEach(([d])=>{if(d>=1000&&r.sec&&m>=d*.99&&m<=d*1.05)put(d,r.sec*d/m,"run")});
  return e;
}
function runPRs(){
  const best={};
  runList().filter(r=>r.type!=="caminar").forEach(r=>{const e=runEfforts(r);
    PRD.forEach(([d])=>{const x=e[d];if(x&&(!best[d]||x.s<best[d].s))best[d]={s:x.s,date:r.date,rid:r.id,src:x.src,km:r.km}})});
  return best;
}
function currentVdot(){

function calcPRs(w){
  const out=[];(w.exercises||[]).forEach(e=>{const ex=exById(e.exId);const pr=exPR(e.exId,w.date===todayStr()?null:w.date);const sets=e.sets.filter(s=>s.done&&s.t!=="w");if(!sets.length)return;
    if(!pr){out.push(ex.name+": primera vez");return}
    if(ex.type==="t"){const m=Math.max(...sets.map(s=>+s.sec||0));if(m>pr.maxSec)out.push(ex.name+": "+m+" s");return}
    let best=null;sets.forEach(s=>{const v=e1rm(+s.kg||0,+s.reps||0);if(!best||v>best.v)best={v,kg:+s.kg||0,r:+s.reps||0}});
    if(best&&best.v>pr.e1rm+.01)out.push(ex.name+": "+kgf(best.kg)+"×"+best.r+" (1RM ~"+kgf(best.v)+" kg)");
    else{const mr=Math.max(...sets.map(s=>+s.reps||0));if(!pr.maxKg&&mr>pr.maxReps)out.push(ex.name+": "+mr+" reps")}});
  return out;
}
function saveWorkout(){

    exercises:w.exercises.map(e=>({exId:e.exId,target:e.target||null,sets:e.sets.filter(s=>s.done).map(s=>({kg:s.kg===""?null:+s.kg,reps:s.reps===""?null:+s.reps,sec:s.sec===""?null:+s.sec,done:true,t:s.t}))})).filter(e=>e.sets.length)};
  SP.workouts[doc.id]=doc;queue("workouts/"+doc.id,()=>JSON.parse(JSON.stringify(doc)));
  SP.active=null;SP.rest=null;saveActive();try{localStorage.removeItem("habituario.active")}catch(e){}
  markSportHabit(doc.date);saveLocal();closeWo();SP.sub="gym";SP.woOpen=doc.id;render();toast(prs.length?"Entreno guardado · 🏆 "+prs.length+" récord"+(prs.length>1?"s":""):"Entreno guardado");
}

function saveRun(f){
  const km=+String(f.km).replace(",",".");const sec=parseHms(f.time);if(!(km>0)||!sec){toast("Pon la distancia y el tiempo.");return false}
  const id=f.id||"r"+uid().slice(1);const old=SP.runs[id]||{};
  const splits=(f.splits||"").split(/[,;\s]+/).map(parseHms).filter(x=>x>0);
  const doc={...old,id,date:f.date,type:f.type,km:Math.round(km*1000)/1000,sec,hr:f.hr?+f.hr:old.hr||null,elev:f.elev!==""&&f.elev!=null?+f.elev:old.elev??null,rpe:f.rpe?+f.rpe:null,shoe:f.shoe||null,note:(f.note||"").trim(),splits:splits.length?splits:old.splits||[],src:old.src||"manual",name:f.name||old.name||null};
  const prsBefore=runPRs();SP.runs[id]=doc;const prsAfter=runPRs();doc.prs=Object.keys(prsAfter).filter(d=>prsAfter[d].rid===id&&(!prsBefore[d]||prsBefore[d].rid!==id)).length||0;

async function importStrava(){
  if(!SP.mcp||SP.importing)return;SP.importing=true;SP.importMsg="Buscando carreras en Strava…";render();
  let added=0;
  try{
    const since=SP.cfg.lastImport?addDays(SP.cfg.lastImport,-3):addDays(todayStr(),-90);
    let acts=[],after=null;
    for(let page=0;page<4;page++){const input={first:50,range_start:since+"T00:00:00"};if(after)input.after=after;
      const res=await SP.mcp.callTool("Strava","list_activities",input,{cache:false});const p=res&&res.payload||{};
      acts=acts.concat(Array.isArray(p.activities)?p.activities:[]);if(!p.has_next_page||!p.end_cursor)break;after=p.end_cursor}
    const runs=acts.filter(a=>a&&/run/i.test(a.sport_type||"")&&a.summary&&a.summary.distance>300);
    const fresh=runs.filter(a=>!SP.runs["st"+a.id]);
    for(let i=0;i<fresh.length;i++){const a=fresh[i];const sm=a.summary||{};const id="st"+a.id;
      SP.importMsg=`Importando ${i+1} de ${fresh.length}…`;const b=document.querySelector(".sp-strava");if(b)b.textContent=SP.importMsg;
      const doc={id,src:"strava",stravaId:String(a.id),name:a.name||null,date:String(a.start_local||"").slice(0,10),time:String(a.start_local||"").slice(11,16),type:/caminat|walk|paseo/i.test(a.name||"")?"caminar":"rodaje",
        km:Math.round((sm.distance||0))/1000,sec:sm.moving_time||sm.elapsed_time||0,elapsed:sm.elapsed_time||null,elev:sm.elevation_gain??null,cad:sm.avg_cadence?sm.avg_cadence*2:null,
        temp:a.weather&&a.weather.temperature!=null?a.weather.temperature:null,best:{},splits:[],note:""};
      if(i<25){try{const pr=await SP.mcp.callTool("Strava","get_activity_performance",{activity_id:String(a.id)});const pp=pr&&pr.payload||{};
        if(pp.average_heartrate)doc.hr=pp.average_heartrate;if(pp.max_heartrate)doc.hrMax=pp.max_heartrate;
        (pp.best_efforts||[]).forEach(be=>{if(be&&be.type_value&&be.value)doc.best[be.type_value]=be.value});
        doc.splits=(pp.laps||[]).filter(l=>l.distance>=950&&l.distance<=1050).map(l=>Math.round((l.moving_time||l.elapsed_time)*1000/l.distance))}catch(e){}}
      if(!doc.date)continue;
      const prsBefore=runPRs();SP.runs[id]=doc;const prsAfter=runPRs();doc.prs=Object.keys(prsAfter).filter(d=>prsAfter[d].rid===id&&(!prsBefore[d]||prsBefore[d].rid!==id)).length||0;
      queue("runs/"+id,()=>JSON.parse(JSON.stringify(SP.runs[id])));if(doc.type!=="caminar")markSportHabit(doc.date);added++}
    SP.cfg.lastImport=todayStr();saveSpCfg();saveLocal();
    toast(added?`${added} carrera${added>1?"s":""} importada${added>1?"s":""} de Strava`:"No hay carreras nuevas en Strava");
  }catch(e){const c=e&&e.code;
    toast(c==="needs_reauth"?"Vuelve a conectar Strava en Ajustes → Conectores de claude.ai.":c==="server_not_connected"?"Añade Strava en Ajustes → Conectores de claude.ai.":c==="not_in_manifest"||c==="not_granted"?"No se ha dado permiso para usar Strava desde esta página.":c==="server_unavailable"?"Strava no responde ahora. Prueba en un rato.":"No se pudo importar de Strava.")}
  finally{SP.importing=false;SP.importMsg="";render()}
}

function jPrompt(ds){
  const e=jEntry(ds)||{hours:{},ans:{}};const F=jFacts(ds);const d=parse(ds);
  const hours=Object.entries(e.hours||{}).filter(([h,x])=>x&&x.t&&x.t.trim()).sort((a,b)=>a[0]-b[0]).map(([h,x])=>`- ${pad(h%24)}:00${x.c?" ["+JC[x.c][1]+"]":""}: ${x.t.trim()}`).join("\n");
  const ans=jQs().filter(q=>(e.ans||{})[q.id]&&e.ans[q.id].trim()).map(q=>`- ${q.q} → ${e.ans[q.id].trim()}`).join("\n")+((e.qd||"").trim()?`\n- ${jQoD(ds)} → ${e.qd.trim()}`:"");
  const tone={natural:"Natural y cercano, como alguien que escribe su diario personal. Entre 120 y 220 palabras.",breve:"Breve y directo: 60-100 palabras, un solo párrafo.",reflexivo:"Reflexivo e introspectivo, conectando lo que pasó con cómo me sentí y lo que aprendí. Entre 180 y 280 palabras, uno o dos párrafos."}[J.cfg.tone]||"";
  return`Escribe la página de diario personal del ${WD[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]} de ${d.getFullYear()} a partir de mis notas.
Reglas:
- En primera persona, en español de España, en pasado, como si lo escribiera yo esa noche.
- Usa SOLO lo que aparece en mis notas y datos. No inventes hechos, personas, lugares ni sentimientos que no estén. Si hay pocas notas, escribe un texto corto.
- Nada de listas ni horas en formato «a las 9:00…» una tras otra: cuenta el día con fluidez (por la mañana, a mediodía, por la tarde, por la noche).
- Integra las respuestas a las preguntas de forma natural. Termina con lo que quiero para mañana si lo he escrito.
- Sin frases hechas ni moralejas, sin título, sin comillas, sin emojis.
- Estilo: ${tone}

MIS NOTAS
${e.mood?`Cómo fue el día (1-5): ${e.mood} (${JMOODS[e.mood-1][1]})\n`:""}${e.energy?`Energía (1-5): ${e.energy}\n`:""}${hours?`Hora a hora:\n${hours}\n`:""}${ans?`Respuestas:\n${ans}\n`:""}${F.facts.length?`Datos registrados en mi app:\n${F.facts.map(x=>"- "+(x.h!=null?pad(x.h)+":00 ":"")+x.t).join("\n")}\n`:""}${F.habits.total?`Hábitos cumplidos: ${F.habits.done.join(", ")||"ninguno"} (${F.habits.done.length} de ${F.habits.total}).\n`:""}
Devuelve solo el texto del diario.`;
}
function jLocal(ds){
  const e=jEntry(ds)||{hours:{},ans:{}};const F=jFacts(ds);
  const low=s=>{s=s.trim().replace(/[.\s]+$/,"");return s?s[0].toLowerCase()+s.slice(1):s};
  const parts=[[6,12,"Por la mañana"],[12,16,"A mediodía"],[16,21,"Por la tarde"],[21,25,"Por la noche"]].map(([a,b,l])=>{const xs=Object.entries(e.hours||{}).filter(([h,x])=>+h>=a&&+h<b&&x&&x.t&&x.t.trim()).sort((p,q)=>p[0]-q[0]).map(([,x])=>low(x.t));return xs.length?`${l}, ${xs.join("; luego, ")}.`:""}).filter(Boolean);
  const A=id=>((e.ans||{})[id]||"").trim();const out=[];
  if(e.mood)out.push(["Hoy ha sido un día difícil.","Hoy no ha sido mi mejor día.","Hoy ha sido un día normal.","Hoy ha sido un buen día.","Hoy ha sido un día genial."][e.mood-1]);
  out.push(...parts);
  const facts=F.facts.filter(f=>!Object.values(e.hours||{}).some(x=>x&&x.t&&x.t.includes(f.t))).map(f=>f.t);if(facts.length)out.push(facts.join(". ")+".");
  if(A("q-mejor"))out.push(`Lo mejor del día: ${low(A("q-mejor"))}.`);
  if(A("q-apr"))out.push(`He aprendido que ${low(A("q-apr"))}.`);
  if(A("q-grat"))out.push(`Me siento agradecido por ${low(A("q-grat"))}.`);
  if(A("q-dif"))out.push(`Lo que más me ha costado: ${low(A("q-dif"))}.`);
  if(A("q-dist"))out.push(`La próxima vez haría distinto ${low(A("q-dist"))}.`);
  jQs().filter(q=>!JQDEF.some(d=>d.id===q.id)&&A(q.id)).forEach(q=>out.push(A(q.id).replace(/[.\s]+$/,"")+"."));
  if((e.qd||"").trim())out.push(e.qd.trim().replace(/[.\s]+$/,"")+".");
  if(A("q-man"))out.push(`Mañana quiero ${low(A("q-man"))}.`);
  return out.join(" ").replace(/\s+/g," ").trim();
}

  try{const{text}=await SL.sample(jPrompt(ds),{cache:false,signal:ctl.signal,onText:({text})=>{J.out=text;const el=document.querySelector(".jpage.writing p");if(el)el.innerHTML=esc(text).replace(/\n+/g,"</p><p>")}});

}

    case"j-go":J.date=b.dataset.d;J.tagOpen=null;J.month=ym(b.dataset.d);render();window.scrollTo({top:0,behavior:"smooth"});break;

    case"j-energy":{const e=jEntry(ds,true);e.energy=e.energy===+b.dataset.v?null:+b.dataset.v;jSave(ds);render();break}
    case"j-tag":J.tagOpen=J.tagOpen===+b.dataset.h?null:+b.dataset.h;render();break;
    case"j-cat":{const e=jEntry(ds,true);const h=b.dataset.h;e.hours[h]=e.hours[h]||{t:""};e.hours[h].c=b.dataset.k||null;J.tagOpen=null;jSave(ds);render();break}
    case"j-sug":{const e=jEntry(ds,true);const h=b.dataset.h;const x=e.hours[h]=e.hours[h]||{t:""};x.t=(x.t&&x.t.trim()?x.t.trim().replace(/[.]$/,"")+". ":"")+b.dataset.t;if(!x.c)x.c=b.dataset.c;jSave(ds);render();break}

/* --- cronómetro --- */
function timerElapsed(){const tm=O.timer;if(!tm)return 0;return Math.floor((tm.acc||0)+(tm.run?(Date.now()-tm.since)/1000:0))}
function oTimerSave(){try{localStorage.setItem("habituario.otimer",JSON.stringify(O.timer))}catch(e){}}
function oTimerTick(){
  const tm=O.timer;if(!tm||!tm.run)return;const el=document.getElementById("oClock");const p=TM[tm.mode];const sec=timerElapsed();
  if(tm.brk){const left=p[2]*60-sec;if(el)el.textContent="Descanso · "+fmtClock(Math.max(0,left));if(left<=0){bell("bell");say("Fin del descanso. A estudiar.");tm.brk=false;tm.acc=0;tm.since=Date.now();oTimerSave();if(S.view==="opos")render()}return}
  if(p[1]){const left=p[1]*60-sec;if(el)el.textContent=fmtClock(Math.max(0,left));
    if(left<=0){oLog(tm,p[1]);bell("bell");if(p[2]){say("Bloque terminado. Descansa "+p[2]+" minutos.");tm.brk=true;tm.acc=0;tm.since=Date.now();oTimerSave()}else{say("Simulacro terminado. Suelta el bolígrafo.");O.timer=null;oTimerSave();toast("Simulacro terminado y guardado")}if(S.view==="opos")render()}}
  else if(el)el.textContent=fmtClock(sec);
}

setInterval(oTimerTick,1000);
function oposAction(a,b){
  const n=b.dataset&&+b.dataset.n;
  switch(a){
    case"o-open":O.open=O.open===n?null:n;if(O.filter!=="all"&&O.open){const el=document.getElementById("ot_"+n);if(!el){O.filter="all";O.q=""}}render();setTimeout(()=>{const el=document.getElementById("ot_"+n);if(el)el.scrollIntoView({block:"nearest",behavior:"smooth"})},40);break;
    case"o-stage":{const t=oT(n);const k=b.dataset.k;if(t[k])delete t[k];else{t[k]=todayStr();if(k==="mem"&&!t.next){t.reps=t.reps||[];oSchedule(n)}{const L=ST();const ix=L.findIndex(x=>x.k===k);L.slice(0,Math.max(0,ix)).forEach(x=>{if(!t[x.k])t[x.k]=todayStr()})}}
      oSave();render();if(t[k]&&k==="mem")toast(`Tema ${n} memorizado 🎉`);break}
    case"o-conf":{const t=oT(n);t.conf=t.conf===+b.dataset.v?0:+b.dataset.v;oSave();render();break}
    case"o-rep":{const t=oT(n);t.reps=(t.reps||[]).concat(todayStr());oSchedule(n);oSave();render();toast(`Repaso del tema ${n} hecho. El próximo: ${parse(t.next).getDate()} ${MON_S[parse(t.next).getMonth()]}`);break}
    case"o-filter":O.filter=b.dataset.k;O.open=null;render();break;
    case"o-draw":{const all=TEMAS.map((_,i)=>i+1);const out=[];while(out.length<O.cfg.bolas){const x=all.splice(Math.floor(Math.random()*all.length),1)[0];out.push(x)}O.draw=out.sort((x,y)=>x-y);bell("soft");render();break}
    case"o-mode":O.cfg.timerMode=b.dataset.k;oSave();render();break;
    case"o-study":O.cfg.timerTema=String(n);O.open=null;oSave();render();window.scrollTo({top:0,behavior:"smooth"});break;
    case"o-tstart":{audio();const sel=document.getElementById("oTimerTema");O.timer={mode:O.cfg.timerMode,n:sel&&sel.value?+sel.value:null,acc:0,since:Date.now(),run:true,brk:false,start:Date.now()};oTimerSave();bell("soft");render();break}
    case"o-tpause":{const tm=O.timer;if(!tm)break;if(tm.run){tm.acc=timerElapsed();tm.run=false}else{tm.since=Date.now();tm.run=true}oTimerSave();render();break}
    case"o-tstop":{const tm=O.timer;if(!tm)break;if(!tm.brk){const m=timerElapsed()/60;oLog(tm,m);toast(m>=1?`${fmtHM(m)} de estudio guardados`:"Menos de un minuto: no se guarda")}O.timer=null;oTimerSave();render();break}
    case"o-addtest":O.addTest=!O.addTest;render();break;
    case"o-deltest":{const sorted=O.log.tests.slice().sort((a,b)=>a.d<b.d?-1:1);const x=sorted[+b.dataset.i];O.log.tests=O.log.tests.filter(y=>y!==x);oSave();render();break}
    case"o-udrm":O.log.uds.splice(+b.dataset.i,1);oSave();render();break;
  }
}

/* ---------- AGENDA ---------- */
const AGCATS=[["foro","Foro","#17A398"],["entrega","Entrega","#E4572E"],["actividad","Actividad","#8A4FD3"],["master","Máster","#2F6FDB"],["opos","Oposiciones","#E0A100"],["personal","Personal","#5D6B89"],["recordatorio","Recordatorio","#D2408F"]];
const agCat=k=>AGCATS.find(c=>c[0]===k)||AGCATS[5];
const AG={tasks:{},view:"hoy",open:null,cat:"personal",date:"",time:"",prio:0,rep:"",q:"",month:null,sel:null,notified:{},more:false};
const agList=()=>Object.values(AG.tasks).filter(x=>x&&x.id);
function agOn(ds){return agList().filter(x=>x.date===ds)}
function agSort(a,b){return((a.date||"9999")+(a.time||"99"))<((b.date||"9999")+(b.time||"99"))?-1:((a.date||"9999")+(a.time||"99"))>((b.date||"9999")+(b.time||"99"))?1:(b.prio||0)-(a.prio||0)}
function agOverdue(){const t=todayStr();return agList().filter(x=>!x.done&&x.date&&x.date<t)}
function agToday(){const t=todayStr();return agList().filter(x=>!x.done&&x.date===t)}
function agSaveT(){saveLocal();agBadge()}
function agBadge(){try{const n=agOverdue().length+agToday().length;if(navigator.setAppBadge){n?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch(e){}}
// lenguaje natural: «foro de familia el viernes a las 18», «entregar TFM 12/2», «mañana 9:30 llamar»
function agParse(txt){
  let s=" "+txt+" ";let date=null,time=null,cat=null,prio=0;const t=todayStr();const low=()=>s.toLowerCase();
  const take=re=>{const m=re.exec(s);if(m){s=s.slice(0,m.index)+" "+s.slice(m.index+m[0].length);return m}return null};
  let m;
  if(m=take(/\s(?:a las |a la )?(\d{1,2})(?::|\.|h)(\d{2})\s?(?:h)?(?=\s)/i))time=pad(+m[1])+":"+m[2];
  else if(m=take(/\sa las? (\d{1,2})(?:\s?h)?(?=\s)/i))time=pad(+m[1])+":00";
  else if(m=take(/\s(\d{1,2})\s?h(?=\s)/i))time=pad(+m[1])+":00";
  if(m=take(/\s(?:el |para el )?pasado mañana(?=\s)/i))date=addDays(t,2);
  else if(m=take(/\s(?:para )?hoy(?=\s)/i))date=t;
  else if(m=take(/\s(?:para )?mañana(?=\s)/i))date=addDays(t,1);
  else if(m=take(/\s(?:el |este |para el )?(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)(?=\s)/i)){const map={domingo:0,lunes:1,martes:2,"miércoles":3,miercoles:3,jueves:4,viernes:5,"sábado":6,sabado:6};const w=map[m[1].toLowerCase()];let d=t;for(let i=1;i<=7;i++){d=addDays(t,i);if(parse(d).getDay()===w)break}date=d}
  else if(m=take(/\s(?:el |para el )?(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?(?=\s)/)){let yy=m[3]?+m[3]:parse(t).getFullYear();if(yy<100)yy+=2000;let d=fmt(new Date(yy,+m[2]-1,+m[1]));if(!m[3]&&d<t)d=fmt(new Date(yy+1,+m[2]-1,+m[1]));date=d}
  else if(m=take(/\s(?:el |para el )?(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)(?=\s)/i)){const mo=MONTHS.indexOf(m[2].toLowerCase());let yy=parse(t).getFullYear();let d=fmt(new Date(yy,mo,+m[1]));if(d<t)d=fmt(new Date(yy+1,mo,+m[1]));date=d}
  if(m=take(/\s#(\w+)(?=\s)/)){const k=m[1].toLowerCase();const c=AGCATS.find(c=>c[0].startsWith(k)||c[1].toLowerCase().startsWith(k));if(c)cat=c[0]}
  if(!cat){const l=low();if(/\bforo/.test(l))cat="foro";else if(/\bentreg/.test(l))cat="entrega";else if(/\bactividad|\btarea del m/.test(l))cat="actividad";else if(/\btema \d|\boposic|\bpreparador/.test(l))cat="opos";else if(/\btfm|\bm[aá]ster|\bclase/.test(l))cat="master"}
  if(m=take(/\s!{1,2}(?=\s)/))prio=m[0].trim().length;
  return{title:s.replace(/\s+/g," ").trim().replace(/^(el|para)\s+/i,""),date,time,cat,prio};
}
function agAdd(raw){const p=agParse(raw);if(!p.title)return null;const id="t"+uid().slice(1);
  const x={id,title:p.title[0].toUpperCase()+p.title.slice(1),date:AG.date||p.date||null,time:AG.time||p.time||null,cat:p.cat||AG.cat,prio:Math.max(AG.prio,p.prio),rep:AG.rep||null,notes:"",subs:[],done:false,created:new Date().toISOString()};
  AG.tasks[id]=x;agSaveT();return x}
function agComplete(x){x.done=!x.done;x.doneAt=x.done?new Date().toISOString():null;
  if(x.done&&x.rep&&x.date){const nd=x.rep==="d"?addDays(x.date,1):x.rep==="w"?addDays(x.date,7):fmt(new Date(parse(x.date).getFullYear(),parse(x.date).getMonth()+1,parse(x.date).getDate()));const id="t"+uid().slice(1);AG.tasks[id]={...x,id,date:nd,done:false,doneAt:null,subs:(x.subs||[]).map(s=>({...s,done:false})),created:new Date().toISOString()}}
  agSaveT()}
function agICS(list){
  const st=s=>s.replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");const d0=new Date();const stamp=d0.toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const ev=list.filter(x=>x.date).map(x=>{const d=x.date.replace(/-/g,"");let dt;if(x.time){const tt=x.time.replace(":","")+"00";const end=new Date(parse(x.date).getTime());const[h,mm]=x.time.split(":").map(Number);end.setHours(h,mm+30);dt=`DTSTART;TZID=Europe/Madrid:${d}T${tt}\r\nDTEND;TZID=Europe/Madrid:${fmt(end).replace(/-/g,"")}T${pad(end.getHours())}${pad(end.getMinutes())}00`}else{dt=`DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${addDays(x.date,1).replace(/-/g,"")}`}
    return`BEGIN:VEVENT\r\nUID:${x.id}@habituario\r\nDTSTAMP:${stamp}\r\n${dt}\r\nSUMMARY:${st(x.title)}\r\nDESCRIPTION:${st(agCat(x.cat)[1]+(x.notes?" · "+x.notes:""))}\r\n${x.rep?`RRULE:FREQ=${{d:"DAILY",w:"WEEKLY",m:"MONTHLY"}[x.rep]}\r\n`:""}BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${st(x.title)}\r\nTRIGGER:${x.time?"-PT15M":"PT9H"}\r\nEND:VALARM\r\nEND:VEVENT`}).join("\r\n");
  return`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Mi Habituario//ES\r\nCALSCALE:GREGORIAN\r\n${ev}\r\nEND:VCALENDAR\r\n`}
function agDownload(name,txt){try{const url=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}catch(e){toast("No se pudo crear el evento")}}
function agRow(x){
  const c=agCat(x.cat);const t=todayStr();const late=!x.done&&x.date&&x.date<t;const subs=x.subs||[];const sd=subs.filter(s=>s.done).length;

        <small>${x.time?x.time+" · ":""}<span class="tkc">${c[1]}</span>${subs.length?` · ${sd}/${subs.length}`:""}${x.rep?" · ↻":""}${x.notes?" · 📝":""}</small></button>
      ${x.date?`<span class="tk-d ${late?"late":x.date===t?"today":""}">${late?"Atrasada · ":""}${relDay(x.date)}</span>`:""}</div>
    ${AG.open===x.id?agEditor(x):""}</div>`;
}

  return`<div class="tke">

function vAgenda(){
  const t=todayStr();const all=agList();const pend=all.filter(x=>!x.done).sort(agSort);
  const tabs=[["hoy","Hoy",agOverdue().length+agToday().length],["semana","7 días",pend.filter(x=>x.date&&x.date>t&&x.date<=addDays(t,7)).length],["todo","Todas",pend.length],["hechas","Hechas",0]];
  let body="";
  if(AG.view==="hoy"){const od=agOverdue().sort(agSort),td=agToday().sort(agSort),nd=pend.filter(x=>!x.date);const mo=msOn(t);const doneToday=all.filter(x=>x.done&&x.doneAt&&x.doneAt.slice(0,10)===t);

        ${mo.cls.map(c=>`<div class="ev" style="--c:${c.color}"><b>${c.start}</b> Clase de ${esc(c.short)} (${c.n}/${c.tot})</div>`).join("")}${mo.miles.filter(x=>x.kind!=="festivo").map(x=>`<div class="ev sq" style="--c:${x.col}"><b>${x.kl}</b> ${esc(x.label)}</div>`).join("")}
        ${td.map(agRow).join("")||(!mo.cls.length?'<p class="small muted" style="margin:4px 0">Nada pendiente para hoy. 👌</p>':"")}
        ${doneToday.length?`<div class="small muted" style="margin-top:4px">✓ Hechas hoy: ${doneToday.length}</div>`:""}</div>
      ${nd.length?`<div class="agg"><div class="lbl">Sin fecha · ${nd.length}</div>${nd.slice(0,8).map(agRow).join("")}</div>`:""}`}
  else if(AG.view==="semana"){body=[...Array(8)].map((_,i)=>{const d=addDays(t,i);const ts=pend.filter(x=>x.date===d).concat(i===0?agOverdue():[]);const mo=msOn(d);if(!ts.length&&!mo.cls.length&&!mo.miles.filter(x=>x.kind!=="festivo").length)return"";
      const dl=i===0?"Hoy":i===1?"Mañana":WD[parse(d).getDay()];return`<div class="agg"><div class="lbl">${dl} · ${parse(d).getDate()} ${MON_S[parse(d).getMonth()]}</div>${mo.cls.map(c=>`<div class="ev" style="--c:${c.color}"><b>${c.start}</b> Clase de ${esc(c.short)}</div>`).join("")}${mo.miles.filter(x=>x.kind!=="festivo").map(x=>`<div class="ev sq" style="--c:${x.col}"><b>${x.kl}</b> ${esc(x.label)}</div>`).join("")}${ts.sort(agSort).map(agRow).join("")}</div>`}).join("")||'<p class="muted small">Semana libre.</p>'}
  else if(AG.view==="todo"){const q=AG.q.trim().toLowerCase();const l=pend.filter(x=>!q||(x.title+" "+(x.notes||"")).toLowerCase().includes(q));const groups={};l.forEach(x=>{const k=x.date?ym(x.date):"zz";(groups[k]=groups[k]||[]).push(x)});
    body=`<input type="text" id="agQ" data-agq value="${esc(AG.q)}" placeholder="Buscar tareas…" aria-label="Buscar">`+Object.keys(groups).sort().map(k=>`<div class="agg"><div class="lbl">${k==="zz"?"Sin fecha":MONTHS[+k.slice(5)-1]+" "+k.slice(0,4)}</div>${groups[k].map(agRow).join("")}</div>`).join("")||'<p class="muted small">No tienes tareas pendientes.</p>'}
  else{const l=all.filter(x=>x.done).sort((a,b)=>(a.doneAt||"")<(b.doneAt||"")?1:-1).slice(0,40);body=l.map(agRow).join("")||'<p class="muted small">Todavía no has completado ninguna.</p>'}

function agendaAction(a,b){
  const x=b.dataset&&b.dataset.id?AG.tasks[b.dataset.id]:null;
  switch(a){
    case"ag-view":AG.view=b.dataset.k;AG.open=null;render();break;
    case"ag-more":AG.more=!AG.more;render();break;
    case"ag-ddate":AG.date=b.dataset.d;AG.more=true;render();break;
    case"ag-dcat":AG.cat=b.dataset.k;render();break;
    case"ag-dprio":AG.prio=(AG.prio+1)%3;render();break;
    case"ag-drep":AG.rep=b.dataset.k;render();break;
    case"ag-newon":AG.date=b.dataset.d;AG.more=true;go("agenda");setTimeout(()=>{const i=document.getElementById("agNew");if(i)i.focus()},60);break;
    case"ag-open":AG.open=AG.open===x.id?null:x.id;AG.del=null;render();break;
    case"ag-done":{agComplete(x);if(x.done){bell("soft");toast(x.rep?"Hecha · se ha creado la siguiente":"¡Hecha!")}render();break}
    case"ag-cat":x.cat=b.dataset.k;agSaveT();render();break;
    case"ag-sub":x.subs[+b.dataset.i].done=!x.subs[+b.dataset.i].done;if(x.subs.every(s=>s.done)&&!x.done){agComplete(x);toast("Todas las subtareas hechas: tarea completada")}agSaveT();render();break;
    case"ag-subrm":x.subs.splice(+b.dataset.i,1);agSaveT();render();break;
    case"ag-dup":{const id="t"+uid().slice(1);AG.tasks[id]={...x,id,done:false,doneAt:null,subs:(x.subs||[]).map(s=>({...s,done:false}))};AG.open=id;agSaveT();render();break}
    case"ag-del":AG.del=x.id;render();break;case"ag-delno":AG.del=null;render();break;
    case"ag-delyes":delete AG.tasks[x.id];AG.del=null;AG.open=null;agSaveT();render();toast("Tarea borrada");break;
    case"ag-ics":agDownload((x.title.slice(0,40)||"tarea")+".ics",agICS([x]));break;
    case"ag-icsall":agDownload("mis-tareas.ics",agICS(agList().filter(y=>!y.done&&y.date)));break;
    case"ag-notif":try{Notification.requestPermission().then(()=>render())}catch(e){}break;

function parseTest(txt){
  const lines=String(txt||"").replace(/\r/g,"").split("\n").map(l=>l.trim());const qs=[];let cur=null,inAns=false;const ans={};
  const temaOf=s=>{const m=/\[\s*(?:t|tema)\s*\.?\s*(\d{1,2})\s*\]|\(\s*tema\s*(\d{1,2})\s*\)/i.exec(s);return m?+(m[1]||m[2]):null};
  const clean=s=>s.replace(/\[\s*(?:t|tema)\s*\.?\s*\d{1,2}\s*\]|\(\s*tema\s*\d{1,2}\s*\)/ig,"").replace(/\*\*/g,"").trim();
  for(const raw of lines){const l=raw.replace(/^[-*•]\s+/,"");if(!l)continue;
    if(/^(respuestas|soluciones|solucionario|clave de respuestas|plantilla)\b/i.test(l)){inAns=true;}
    if(inAns){let m;const re=/(\d{1,3})\s*[\.\-\):=]?\s*\(?([a-dA-D])\)?(?![a-zA-Z])/g;while(m=re.exec(l))ans[+m[1]]=m[2].toLowerCase();continue}
    let m;
    if(m=/^(?:\*\*)?(?:pregunta\s*)?(\d{1,3})\s*[\.\):\-]\s*(.+)$/i.exec(l)){cur={n:+m[1],q:clean(m[2]),tema:temaOf(m[2]),opts:[],ans:null,exp:""};qs.push(cur);continue}
    if(cur&&(m=/^\(?([a-dA-D])\s*[\)\.\-:]\s*(.+)$/.exec(l))){let t=m[2];let ok=false;if(/\s*(\(correcta\)|✓|✔|\*)$/i.test(t)){ok=true;t=t.replace(/\s*(\(correcta\)|✓|✔|\*)$/i,"")}cur.opts[L4.indexOf(m[1].toLowerCase())]=clean(t);if(ok)cur.ans=L4.indexOf(m[1].toLowerCase());continue}
    if(cur&&(m=/^(?:respuesta|correcta|soluci[oó]n|opci[oó]n correcta)(?:\s*correcta)?\s*[:\-]\s*\(?([a-dA-D])\)?/i.exec(l))){cur.ans=L4.indexOf(m[1].toLowerCase());continue}
    if(cur&&(m=/^(?:explicaci[oó]n|justificaci[oó]n|por qu[eé])\s*[:\-]\s*(.+)$/i.exec(l))){cur.exp=m[1];continue}
    if(cur&&cur.exp){cur.exp+=" "+l;continue}
    if(cur&&!cur.opts.length){cur.q+=" "+clean(l);if(!cur.tema)cur.tema=temaOf(l)}
  }
  qs.forEach(q=>{if(q.ans==null&&ans[q.n])q.ans=L4.indexOf(ans[q.n])});
  const ok=qs.filter(q=>q.opts.filter(Boolean).length>=2&&q.ans!=null&&q.opts[q.ans]).map(q=>({q:q.q,opts:q.opts.filter(Boolean),ans:q.ans,exp:q.exp,tema:q.tema}));
  return{ok,bad:qs.length-ok.length};
}

  case"t-pasteclip":(async()=>{try{const x=await navigator.clipboard.readText();if(x){O.pasteTxt=x;render()}}catch(e){toast("Mantén pulsado el recuadro y elige Pegar")}})();break;
  case"t-start":{const r=parseTest(O.pasteTxt);if(!r.ok.length){toast("No encuentro preguntas con respuesta. Revisa el formato.");break}if(r.bad)toast(`${r.ok.length} preguntas listas (${r.bad} sin respuesta clara, se omiten)`);O.pasteTxt="";startTest(r.ok,"test");break}
  case"t-gen":genTest();break;
  case"t-fallos":{const l=O.bank.slice().sort((a,b)=>(b.fails||1)-(a.fails||1)).slice(0,20).map(({q,opts,ans,exp,tema})=>({q,opts,ans,exp,tema}));startTest(l,"fallos");break}
  case"t-pick":{const r=O.run;r.picks[r.i]=+b.dataset.i;bell(r.picks[r.i]===r.qs[r.i].ans?"soft":"tick");render();break}
  case"t-skip":{const r=O.run;r.picks[r.i]=null;if(r.i+1<r.qs.length){r.i++;render()}else finishTest();break}
  case"t-next":{const r=O.run;if(r.i+1<r.qs.length){r.i++;render()}else finishTest();break}
  case"t-quit":O.run=null;render();break;
  case"t-close":O.run=null;render();break;
  case"k-start":{const ids=cardsDue(O.cardTema||null).sort((a,b)=>(a.due||"")<(b.due||"")?-1:1).slice(0,50).map(c=>c.id);O.cardSes={ids,i:0,show:false};render();window.scrollTo({top:0,behavior:"smooth"});break}
  case"k-show":O.cardSes.show=true;render();break;
  case"k-rate":{const s=O.cardSes;const c=O.cards[s.ids[s.i]];const g=+b.dataset.g;rateCard(c,g);if(g===0)s.ids.push(c.id);s.i++;s.show=false;if(s.i>=s.ids.length){O.cardSes=null;toast("¡Repaso de tarjetas terminado!")}render();break}
  case"k-quit":O.cardSes=null;render();break;
  case"k-form":O.cardForm=!O.cardForm;O.cardImp=false;render();break;
  case"k-imp":O.cardImp=!O.cardImp;O.cardForm=false;render();break;
  case"k-copyprompt":copyTxt(cardsPrompt());break;
  case"k-doimp":{const l=parseCards((document.getElementById("kImp")||{}).value,O.cardTema);if(!l.length){toast("No encuentro tarjetas. Usa «pregunta | respuesta» en cada línea.");break}addCards(l);O.cardImp=false;render();toast(`${l.length} tarjetas importadas`);break}
  case"k-gen":genCards((document.getElementById("kImp")||{}).value||"");break;
  case"k-del":delete O.cards[b.dataset.id];oSave();render();break;
  case"p-day":{const d=+b.dataset.d;const ds=(O.cfg.days||[1,2,3,4,5]).slice();const i=ds.indexOf(d);if(i>=0)ds.splice(i,1);else ds.push(d);O.cfg.days=ds;oSave();render();break}
  case"p-agenda":{const P=planWeek(weekStart(todayStr()));let n=0;P.wd.forEach(d=>{const x=P.plan[d];if(!x.adv.length&&!x.rev.length)return;const key="plan-"+d;if(agList().some(y=>y.planKey===key))return;const id="t"+uid().slice(1);
      AG.tasks[id]={id,planKey:key,title:"Oposiciones: "+[...x.adv.map(a=>`tema ${a.n} (${STEPN[a.s]})`),...x.rev.map(r=>`repasar tema ${r}`)].join(", "),date:d,time:null,cat:"opos",prio:0,rep:null,notes:"",subs:[...x.adv.map(a=>({t:`Tema ${a.n}: ${STEPN[a.s]}`,done:false})),...x.rev.map(r=>({t:`Repasar tema ${r}`,done:false}))],done:false,created:new Date().toISOString()};n++});
    agSaveT();toast(n?`${n} días añadidos a la Agenda`:"El plan ya estaba en la Agenda");break}
  case"f-open":focusOpen();break;
  case"f-close":focusClose();break;
  case"f-skip":FOC.bEnd=Date.now();break;
  case"f-go":oposAction("o-tstart",{dataset:{}});FOC.stage="run";focusRender();break;
  case"f-stop":oposAction("o-tstop",{dataset:{}});FOC.stage="breath";FOC.after=true;FOC.bEnd=Date.now()+60000;FOC.b0=Date.now();FOC.ph=null;say("Bien hecho. Un minuto para respirar antes de descansar.");focusRender();break;
}}
async function copyTxt(s){try{await navigator.clipboard.writeText(s);toast("Copiado. Pégalo en Claude")}catch(e){toast("No se pudo copiar")}}
document.addEventListener("input",e=>{const t=e.target;
  if(t.matches("[data-tpaste]")){const had=!!O.pasteTxt.trim();O.pasteTxt=t.value;if(had!==!!t.value.trim())render()}
  else if(t.matches("[data-ttemas]"))O.genTemas=t.value;
  else if(t.matches("[data-tgen]"))O.genTxt=t.value});
document.addEventListener("change",e=>{const t=e.target;if(t.matches("[data-kt]")){O.cardTema=t.value;render()}});
document.addEventListener("submit",e=>{const f=e.target.closest("form[data-form='k-add']");if(!f)return;e.preventDefault();e.stopImmediatePropagation();const q=(document.getElementById("kQ")||{}).value||"",a=(document.getElementById("kA")||{}).value||"";if(!q.trim()||!a.trim()){toast("Escribe pregunta y respuesta");return}addCards([{q:q.trim(),a:a.trim(),tema:O.cardTema?+O.cardTema:null}]);render();toast("Tarjeta guardada");setTimeout(()=>{const x=document.getElementById("kQ");if(x)x.focus()},40)},true);

/* ---------- MÁSTER: diario de clases, TFM y prácticas ---------- */
const TFMSECS=["Introducción y justificación","Marco teórico","Objetivos","Metodología","Propuesta / desarrollo","Evaluación y resultados","Conclusiones","Referencias (APA 7)","Anexos"];
const TFMDEF={title:"",tutor:"",type:"",words:0,goal:12000,secs:TFMSECS.map(t=>({t,done:false})),st:{}};
const PRDEF={centro:"",tutor:"",goalH:0,entries:[]};
Object.assign(MS,{sub:"cal",notes:{},tfm:JSON.parse(JSON.stringify(TFMDEF)),prac:JSON.parse(JSON.stringify(PRDEF)),delFor:null,clsAll:false,prForm:false});
const nowHM=()=>pad(new Date().getHours())+":"+pad(new Date().getMinutes());
const clsPast=c=>{const t=todayStr();return c.date<t||(c.date===t&&c.end<=nowHM())};
function vMasterTabs(){const fp=Object.values(MS.foros).filter(f=>f&&!foroDone(f)).length,ap=Object.values(MS.acts).filter(a=>a&&!a.done).length;const subs=[["cal","Calendario"],["cls","Clases"],["foros","Foros"+(fp?` <small>${fp}</small>`:"")],["acts","Actividades"+(ap?` <small>${ap}</small>`:"")],["test","Test"],["cards","Tarjetas"+(mkDue().length?` <small>${mkDue().length}</small>`:"")],["eval","Evaluación"],["tfm","TFM"],["prac","Prácticas"]];
  return`<div class="subtabs scroll" role="tablist">${subs.map(([k,l])=>`<button role="tab" data-act="m-sub" data-k="${k}" aria-selected="${MS.sub===k}">${l}</button>`).join("")}</div>`}
function vMasterAll(){return vMasterTabs()+(MS.sub==="cls"?vClases():MS.sub==="foros"?vForos():MS.sub==="acts"?vActs():MS.sub==="eval"?vEval():MS.sub==="test"?vMTest():MS.sub==="cards"?vMCards():MS.sub==="tfm"?vTFM():MS.sub==="prac"?vPrac():vMaster())}
/* --- diario de clases --- */
function vClases(){
  const t=todayStr();const all=msClasses();const past=all.filter(clsPast).reverse();const nx=all.find(c=>!clsPast(c));
  const shown=MS.clsAll?past:past.slice(0,8);const withNotes=Object.values(MS.notes).filter(n=>n&&n.txt&&n.txt.trim()).length;
  const card=c=>{const n=MS.notes[c.key]||{};const att=MS.att[c.key];
    return`<div class="cls" style="--c:${c.color}"><div class="cls-h"><i></i><span><b>${esc(c.short)} · sesión ${c.n}/${c.tot}</b><small>${relDay(c.date)} · ${c.start}–${c.end}${att===true?" · asististe ✓":att===false?" · no fuiste":""}</small></span>
        ${att===undefined?`<button class="btn ghost" data-act="m-att" data-k="${c.key}" data-v="1">Fui ✓</button>`:""}</div>
      <textarea class="ta" rows="${n.txt?3:2}" data-mnote="${c.key}" placeholder="¿Qué se vio? Ideas clave, lo que dijo el profesor sobre el examen o las actividades…">${esc(n.txt||"")}</textarea>
      <div class="row small">${n.task?`<span class="muted">📌 Entrega apuntada en la Agenda</span>`:MS.delFor===c.key?"":`<button class="linkbtn ag-l" data-act="m-del" data-k="${c.key}">¿Hay entrega? Apúntala</button>`}</div>
      ${MS.delFor===c.key?`<form class="mgrid" data-form="m-del" data-k="${c.key}"><label style="grid-column:1/-1"><span>Qué hay que entregar</span><input type="text" id="mdT" value="${esc(c.short)}: " maxlength="120"></label><label><span>Fecha límite</span><input type="date" id="mdD" value="${addDays(t,7)}"></label><label><span>Hora</span><input type="time" id="mdH" value="23:59"></label><button class="btn ag-btn">Añadir a la Agenda</button></form>`:""}</div>`};
  return`<section class="sheet" style="display:flex;flex-direction:column;gap:12px">
    <div class="spread"><div><div class="lbl">Diario de clases</div><h2 class="sec">${withNotes?`${withNotes} clases con apuntes`:"Tus clases"}</h2></div>${withNotes?`<button class="btn" data-act="m-export">Exportar apuntes</button>`:""}</div>
    <p class="small muted" style="margin:0">Después de cada clase, dos líneas: lo que se vio y si mandaron algo. Al llegar los exámenes tendrás el resumen de todo el cuatrimestre.</p>
    ${nx?`<div class="ev" style="--c:${nx.color}"><b>Próxima</b> ${esc(nx.short)} · ${relDay(nx.date)} ${nx.start} · sesión ${nx.n}/${nx.tot}</div>`:""}
    ${past.length?shown.map(card).join(""):`<p class="small muted">Aún no ha habido clases.</p>`}
    ${past.length>8?`<button class="btn ghost" data-act="m-clsall">${MS.clsAll?"Ver menos":`Ver las ${past.length} clases`}</button>`:""}
  </section>`;
}
function exportNotes(){const by={};msClasses().forEach(c=>{const n=MS.notes[c.key];if(n&&n.txt&&n.txt.trim())(by[c.subj]=by[c.subj]||[]).push(`### Sesión ${c.n} · ${parse(c.date).getDate()} ${MON_S[parse(c.date).getMonth()]}\n\n${n.txt.trim()}\n`)});
  const md="# Apuntes de clase · Máster de Profesorado\n\n"+Object.entries(by).map(([k,l])=>`## ${MS.data.subjects[k]?MS.data.subjects[k].name:k}\n\n${l.join("\n")}`).join("\n");dlText(md,`apuntes-master-${todayStr()}.md`)}
function dlText(txt,name){try{const url=URL.createObjectURL(new Blob([txt],{type:"text/markdown"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Descargado")}catch(e){copyTxt(txt)}}
/* --- TFM --- */
const isTfmDel=m=>/entrega|solicitar/i.test(m.label);
function tfmMiles(){return msMiles().filter(m=>m.kind==="tfm"||m.kind==="range-tfm").sort((a,b)=>a.date<b.date?-1:1)}

        ${del?`<span class="row" style="margin-top:6px"><select data-tfmst="${m.date}" aria-label="Estado">${[["","Pendiente"],["wip","En marcha"],["ok","Entregado ✓"]].map(([k,l])=>`<option value="${k}" ${(s.s||"")===k?"selected":""}>${l}</option>`).join("")}</select></span>
        ${s.s==="ok"||s.fb?`<textarea class="ta" rows="2" data-tfmfb="${m.date}" placeholder="Correcciones del tutor…">${esc(s.fb||"")}</textarea>`:""}`:""}</span></li>`}).join("")}</ul>

function exportPrac(){const P=MS.prac;const hrs=P.entries.reduce((a,e)=>a+(+e.h||0),0);

function master2Action(a,b){switch(a){
  case"m-sub":MS.sub=b.dataset.k;render();window.scrollTo({top:0});break;
  case"m-del":MS.delFor=b.dataset.k;render();setTimeout(()=>{const i=document.getElementById("mdT");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},40);break;

  case"m-export":exportNotes();break;
  case"m-sec":{const s=MS.tfm.secs[+b.dataset.i];s.done=!s.done;saveLocal();render();break}
  case"m-secrm":MS.tfm.secs.splice(+b.dataset.i,1);saveLocal();render();break;
  case"m-tfmag":{let n=0;tfmMiles().filter(m=>isTfmDel(m)&&m.date>=todayStr()&&(MS.tfm.st[m.date]||{}).s!=="ok").forEach(m=>{const key="tfm-"+m.date;if(agList().some(x=>x.planKey===key))return;const id="t"+uid().slice(1);AG.tasks[id]={id,planKey:key,title:m.label.replace("TFM · ","TFM: "),date:m.date,time:"23:59",cat:"entrega",prio:2,rep:null,notes:"",subs:[],done:false,created:new Date().toISOString()};n++});agSaveT();toast(n?`${n} entregas añadidas a la Agenda`:"Ya estaban en la Agenda");break}
  case"m-prform":MS.prForm=!MS.prForm;render();break;
  case"m-prexp":exportPrac();break;
  case"m-prrm":MS.prac.entries=MS.prac.entries.filter(e=>e.id!==b.dataset.id);saveLocal();render();break;
}}

function evItemGrade(k,it){if(it.auto==="act"){const g=Object.values(MS.acts).filter(a=>a.subj===k&&pnum(a.grade)!=null).map(a=>pnum(a.grade));return g.length?g.reduce((x,y)=>x+y,0)/g.length:null}
  if(it.auto==="foro"){const f=Object.values(MS.foros).filter(x=>x.subj===k);return f.length?f.filter(foroDone).length/f.length*10:null}return pnum(it.grade)}
function evCalc(k){const E=evOf(k);let w=0,got=0,wg=0;E.items.forEach(it=>{const p=pnum(it.w)||0;w+=p;const g=evItemGrade(k,it);if(g!=null){got+=p*g/100;wg+=p}});
  return{w,got,wg,max:got+(w-wg)/10,cur:wg?got/(wg/100):null}}

        ${it.auto?`<span class="evauto" title="${it.auto==="act"?"Media de las notas de tus actividades":"Según foros completados"}">${fmtN(g)}<small>${it.auto==="act"?"auto · actividades":"auto · foros"}</small></span>`:`<input type="text" inputmode="decimal" data-ev="grade" data-k="${k}" data-i="${i}" value="${esc(String(it.grade??"").replace(".",","))}" placeholder="—" aria-label="Nota">`}
        <b>${g!=null?fmtN(p*g/100):"—"}</b><button class="icon-btn" data-act="m-evdel" data-k="${k}" data-i="${i}" aria-label="Quitar">×</button></div>
        <div class="evx"><input type="text" data-ev="desc" data-k="${k}" data-i="${i}" value="${esc(it.desc||"")}" placeholder="A qué corresponde: examen tipo test online, 4 actividades…"><select data-ev="auto" data-k="${k}" data-i="${i}" aria-label="Cálculo"><option value="">Nota a mano</option><option value="act" ${it.auto==="act"?"selected":""}>Media de mis actividades</option><option value="foro" ${it.auto==="foro"?"selected":""}>Según foros hechos</option></select>
          <input type="text" data-ev="min" data-k="${k}" data-i="${i}" value="${esc(it.min||"")}" placeholder="Nota mínima" class="evmin" aria-label="Nota mínima exigida"></div>`}).join("")}

    <label class="rq"><span>Comentarios y aclaraciones</span><textarea class="ta" rows="3" data-evnotes="${k}" placeholder="Hay que aprobar el examen con un 5 para que haga media · el foro cuenta solo si participas antes del día X · el profesor dijo que…">${esc(E.notes||"")}</textarea></label>

  case"m-adel":if(!confirmSoft(b,"¿Borrar esta actividad?"))break;delete MS.acts[id];saveLocal();render();break;

  case"m-evadd":{const E=evOf(b.dataset.k);E.items.push({id:uid(),name:b.dataset.n,w:b.dataset.w?+b.dataset.w:"",grade:"",auto:b.dataset.a||"",desc:"",min:""});saveLocal();render();if(!b.dataset.n)setTimeout(()=>{const l=document.querySelectorAll('[data-ev="name"]');if(l.length)l[l.length-1].focus()},50);break}

    SL.nights=m;saveLocal();if(S.view==="sueno"||S.view==="hoy")render();
  },()=>{});
  db.doc("config/calm").onSnapshot(snap=>{
    if(snap.exists){const c=snap.data();C.cfg={...CDEF,...c,parts:{...CDEF.parts,...(c.parts||{})}};saveLocal();if(S.view==="calma")render()}
  },()=>{});
  db.collection("calmlog").onSnapshot(qs=>{
    const m={};qs.docs.forEach(doc=>{const b=doc.data();m[doc.id]={s:JSON.parse(JSON.stringify((b&&b.s)||[]))}});
    Object.keys(dirty).forEach(p=>{if(dirty[p]&&p.startsWith("calmlog/")){const k=p.slice(8);if(C.log[k])m[k]=C.log[k]}});
    C.log=m;saveLocal();if(S.view==="calma"||S.view==="hoy")render();
  },()=>{});
  db.collection("months").onSnapshot(qs=>{
    const m={};qs.docs.forEach(doc=>{const b=doc.data();m[doc.id]={d:JSON.parse(JSON.stringify((b&&b.d)||{})),s:JSON.parse(JSON.stringify((b&&b.s)||{}))}});
    // keep local edits still being written
    Object.keys(dirty).forEach(p=>{if(dirty[p]&&p.startsWith("months/")){const k=p.slice(7);if(S.months[k])m[k]=S.months[k]}});
    S.months=m;saveLocal();render();
  },()=>{});
}).catch(()=>{S.mode="local";S.loaded=true;render()});
})();
</script>

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
