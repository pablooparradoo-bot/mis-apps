<title>Mi Habituario</title>

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">

<link rel="icon" href="icon-180.png?v=3">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
/* Versión GitHub Pages: fuera de Claude no hay base de datos ni conectores; los datos van en este dispositivo.
   Si el usuario guarda su clave de la API de Anthropic, se activan las funciones con Claude (sueño, diario, entrenador). */
(function(){
  if(window.claude)return;window.__ghApp=true;
  const key=()=>{try{return localStorage.getItem("habituario.apikey")||""}catch(e){return""}};
  const MODEL="claude-sonnet-5";
  async function toB64(blob){
    let b=blob;
    try{const bmp=await createImageBitmap(blob);const sc=Math.min(1,1568/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85))||blob}catch(e){}
    const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});
    const m=/^data:([^;]+);base64,(.*)$/.exec(url);return{media_type:m[1],data:m[2]};
  }
  async function call(input,opts){
    opts=opts||{};const k=key();if(!k)throw{code:"not_granted",message:"Sin clave"};
    const imgs=[];if(opts.images){const list=opts.images instanceof Blob?[opts.images]:Array.from(opts.images);for(const im of list.slice(0,5)){const x=await toB64(im);imgs.push({type:"image",source:{type:"base64",media_type:x.media_type,data:x.data}})}}
    const turns=typeof input==="string"?[{role:"user",content:input}]:input;
    const messages=turns.map((m,i)=>({role:m.role,content:i===turns.length-1&&imgs.length?[...imgs,{type:"text",text:m.content}]:m.content}));
    let res;
    try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opts.signal,headers:{"content-type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL,max_tokens:3000,messages})})}
    catch(e){throw{code:e&&e.name==="AbortError"?"cancelled":"upstream_error",message:String(e)}}
    if(!res.ok){const c=res.status===429||res.status===529?"rate_limited":res.status===401||res.status===403?"not_granted":"upstream_error";throw{code:c,message:"HTTP "+res.status}}
    const j=await res.json();const text=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim();
    if(!text)throw{code:"empty_completion",message:"Sin texto"};
    if(opts.onText)try{opts.onText({text,delta:text})}catch(e){}
    return{text,truncated:j.stop_reason==="max_tokens",modelTierApplied:"default"};
  }
  const sample=(i,o)=>call(i,o);
  sample.json=async(i,o)=>{const r=await call(typeof i==="string"?i+"\n\nResponde únicamente con el JSON, sin texto alrededor.":i,o);const t=r.text;
    const tries=[t,(/```(?:json)?\s*([\s\S]*?)```/.exec(t)||[])[1],(()=>{const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));return a>=0&&b>a?t.slice(a,b+1):null})()];
    for(const x of tries){if(!x)continue;try{return JSON.parse(x)}catch(e){}}throw{code:"invalid_json",message:"Respuesta sin JSON",text:t}};
  sample.limits=async()=>({maxPromptBytes:65536,images:{maxCount:3,maxInputBytes:20e6,mediaTypes:["image/png","image/jpeg","image/webp","image/gif"]}});
  window.claude={use:async n=>n==="sample"&&key()?sample:null};
})();
</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&family=Figtree:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{
  --paper:#F4F2EE; --sheet:#FFFFFF; --ink:#1E1B18; --ink-2:#5F5A53; --ink-3:#928C84;
  --line:#E5E1DA; --dot:#D8D2C8; --accent:#26221E; --accent-soft:#EDE9E2; --accent-ink:#FFFFFF;
  --cell:#EFECE7; --danger:#A7472F; --danger-soft:#F6E8E3; --good:#557A4E; --calm:#6E5C49; --calm-soft:#EFE9E1; --calm-ink:#FFFFFF; --ov:#F7F5F1; --sleep:#4A4540; --sleep-soft:#ECE9E5; --sleep-ink:#FFFFFF; --sl-deep:#3A342E; --sl-rem:#8D8072; --sl-light:#CDC5B9; --sl-awake:#B8915F; --gym:#6E5C49; --gym-soft:#EFE9E1; --gym-ink:#FFFFFF; --run:#4A4540; --run-soft:#ECE9E5; --run-ink:#FFFFFF; --j:#7A6450; --j-soft:#F1EBE3; --j-ink:#FFFFFF; --j-paper:#FFFDF9; --op:#7A5A3E; --op-soft:#F2EBE2; --op-ink:#FFFFFF; --ag:#4A4642; --ag-soft:#ECEAE7; --ag-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(30,27,24,.06),0 6px 20px -10px rgba(30,27,24,.16);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141210; --sheet:#1C1A17; --ink:#EDE8E1; --ink-2:#AAA39A; --ink-3:#77716A;
    --line:#2F2B27; --dot:#2A2622; --accent:#EDE8E1; --accent-soft:#2A2622; --accent-ink:#141210;
    --cell:#272420; --danger:#DB8A74; --danger-soft:#3A221B; --good:#93B88B; --calm:#C7AE93; --calm-soft:#2B241D; --calm-ink:#141210; --ov:#12100E; --sleep:#CFC6BA; --sleep-soft:#25221F; --sleep-ink:#141210; --sl-deep:#8D8072; --sl-rem:#C9BBAA; --sl-light:#4A433C; --sl-awake:#D2A86F; --gym:#C7AE93; --gym-soft:#2B241D; --gym-ink:#141210; --run:#CFC6BA; --run-soft:#25221F; --run-ink:#141210; --j:#D2B596; --j-soft:#2B241D; --j-ink:#141210; --j-paper:#1E1B17; --op:#D3B08A; --op-soft:#2C241B; --op-ink:#141210; --ag:#CFC9C1; --ag-soft:#262320; --ag-ink:#141210;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141210; --sheet:#1C1A17; --ink:#EDE8E1; --ink-2:#AAA39A; --ink-3:#77716A;
  --line:#2F2B27; --dot:#2A2622; --accent:#EDE8E1; --accent-soft:#2A2622; --accent-ink:#141210;
  --cell:#272420; --danger:#DB8A74; --danger-soft:#3A221B; --good:#93B88B; --calm:#C7AE93; --calm-soft:#2B241D; --calm-ink:#141210; --ov:#12100E; --sleep:#CFC6BA; --sleep-soft:#25221F; --sleep-ink:#141210; --sl-deep:#8D8072; --sl-rem:#C9BBAA; --sl-light:#4A433C; --sl-awake:#D2A86F; --gym:#C7AE93; --gym-soft:#2B241D; --gym-ink:#141210; --run:#CFC6BA; --run-soft:#25221F; --run-ink:#141210; --j:#D2B596; --j-soft:#2B241D; --j-ink:#141210; --j-paper:#1E1B17; --op:#D3B08A; --op-soft:#2C241B; --op-ink:#141210; --ag:#CFC9C1; --ag-soft:#262320; --ag-ink:#141210;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);
  background-size:18px 18px;
  color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45;
  padding-inline:16px; padding-block:18px 48px; min-height:100vh;
}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,34px);letter-spacing:-.02em;margin:0;line-height:1}
.brand p{margin:4px 0 0;color:var(--ink-2);font-size:13px}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync.ok i{background:var(--good)}

nav.tabs{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:var(--shadow);overflow-x:auto}
nav.tabs button{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);display:inline-grid;place-items:center;font-size:18px;line-height:1}
.icon-btn:disabled{opacity:.35;cursor:default}
input[type=text],select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;min-width:0}
input[type=text]{flex:1}

.banner{border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner b{font-family:var(--display)}

/* today */
.day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.day-title{font-family:var(--hand);font-weight:700;color:var(--accent);font-size:clamp(34px,8vw,44px);line-height:.9;margin:0}
.day-sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.today-grid{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:start}
@media (max-width:640px){.today-grid{grid-template-columns:1fr}}
.ring-box{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
@media (max-width:640px){.ring-box{flex-direction:row;justify-content:flex-start;gap:14px}}
.ring-num{font-family:var(--display);font-weight:800;font-size:30px;fill:var(--ink)}
.ring-cap{font-size:11px;fill:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.habits{display:flex;flex-direction:column;gap:8px}
.habit{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:10px 12px;transition:border-color .15s,background .15s}
.habit:hover{border-color:var(--c)}
.habit.done{background:color-mix(in srgb,var(--c) 10%,var(--sheet));border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.check{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c);display:grid;place-items:center;transition:background .15s,transform .15s}
.check svg{opacity:0;transform:scale(.6);transition:all .15s}
.habit.done .check{background:var(--c)}
.habit.done .check svg{opacity:1;transform:scale(1)}
.h-name{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.habit.done .h-name{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--c) 70%,transparent);text-decoration-thickness:2px}
.h-meta{font-size:12px;color:var(--ink-2)}
.week-dots{display:flex;gap:4px}
.week-dots span{width:9px;height:9px;border-radius:3px;background:var(--cell)}
.week-dots span.on{background:var(--c)}
@media (max-width:420px){.week-dots span{width:7px;height:7px}}
.quick{display:flex;gap:8px;margin-top:6px}
.hgroup{display:flex;flex-direction:column}
.hgroup.open>.habit{border-bottom-left-radius:0;border-bottom-right-radius:0}
.hright{display:flex;align-items:center;gap:10px}
.chev{color:var(--ink-3);font-size:14px;transition:transform .15s;display:inline-block}
.hgroup.open .chev{transform:rotate(180deg)}
.pie{width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),transparent 0)}
.habit.done .pie{display:none}
.habit:not(.done) .check.has-pie svg{display:none}
.subs{border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));border-top:0;border-radius:0 0 14px 14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:12px;background:var(--sheet)}
.sub-group{display:flex;flex-direction:column;gap:2px}
.sub-when{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding-left:4px;margin-bottom:2px}
.sub{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:7px 6px;border-radius:9px}
.sub:hover{background:var(--paper)}
.sub .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--c);display:grid;place-items:center}
.sub .box svg{opacity:0}
.sub.on .box{background:var(--c)}
.sub.on .box svg{opacity:1}
.sub .snm{font-weight:500;overflow-wrap:anywhere}
.sub.on .snm{text-decoration:line-through;color:var(--ink-2)}
.dose{font-size:12px;color:var(--ink-2);background:var(--cell);border-radius:999px;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sub-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.cell.part{background:color-mix(in srgb,var(--c) 32%,var(--cell))}
.items-ed{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:10px}
.irow{display:grid;grid-template-columns:1fr 1.5fr .8fr 36px;gap:6px;align-items:center}
.irow input[type=text]{width:100%;padding:7px 9px;font-size:14px}
@media (max-width:560px){.irow{grid-template-columns:1fr 1fr 36px}.irow .in-n{grid-column:1/3;grid-row:2}}

/* grid */
.grid-wrap{overflow-x:auto;margin-inline:-6px;padding:2px 6px 6px}
table.hgrid{border-collapse:separate;border-spacing:3px;font-variant-numeric:tabular-nums}
.hgrid th,.hgrid td{padding:0;text-align:center}
.hgrid thead th{font-size:10px;color:var(--ink-3);font-weight:600;line-height:1.15;padding-bottom:4px}
.hgrid thead th b{display:block;font-size:12px;color:var(--ink-2)}
.hgrid thead th.wk b{color:var(--accent)}
.hgrid th.hn{position:sticky;left:0;z-index:2;background:var(--sheet);text-align:left;padding-right:10px;font-size:13px;font-weight:600;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.hn .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:-1px}
.cell{width:24px;height:24px;border-radius:6px;border:0;background:var(--cell);display:block;padding:0}
.cell.on{background:var(--c)}
.cell.today{box-shadow:0 0 0 2px var(--accent)}
.cell:disabled{opacity:.35;cursor:default}
.cell.pre{background:repeating-linear-gradient(45deg,var(--cell) 0 3px,transparent 3px 6px)}
.hgrid td.cnt{font-size:12px;color:var(--ink-2);padding-left:8px;text-align:left;white-space:nowrap}
.hgrid tfoot td{vertical-align:bottom;height:34px}
.pbar{width:24px;margin:0 auto;border-radius:3px 3px 0 0;background:var(--accent);opacity:.8}
.hgrid tfoot th{font-size:11px;color:var(--ink-3);text-align:left;position:sticky;left:0;background:var(--sheet);font-weight:600}

/* stats */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--paper)}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 11px 5px 9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent))}
.chip[aria-pressed="true"]{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--sheet))}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:600;color:var(--ink-2)}
.chart{width:100%;min-height:220px}
.chart svg{display:block}
.chart text{font-family:var(--body)}
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.hcard{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.hcard h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.hcard h3 i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.hstats{display:flex;gap:16px;font-size:12px;color:var(--ink-2)}
.hstats b{display:block;font-family:var(--display);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat span{aspect-ratio:1;border-radius:3px;background:var(--cell)}
.heat span.on{background:var(--c)}
.heat span.fut{background:transparent}

/* manage */
.form{display:flex;flex-direction:column;gap:12px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.0)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--c)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.mrow .spread>div:first-child{display:flex;align-items:center;gap:10px;min-width:0}
.mrow .dot{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.mrow .nm{font-weight:600;overflow-wrap:anywhere}
.confirm{background:var(--danger-soft);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h2.sec{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

[hidden]{display:none!important}

/* sueño */
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);overflow:visible}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;font-size:12.5px;min-width:0}
nav.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .short{display:none}
@media (max-width:520px){nav.tabs .full{display:none}nav.tabs .short{display:inline}nav.tabs button{font-size:11px;padding:8px 0;letter-spacing:-.01em}}
.upl{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border:2px dashed color-mix(in srgb,var(--sleep) 50%,var(--line));border-radius:18px;padding:22px 16px;background:var(--sheet);transition:border-color .15s,background .15s;cursor:pointer}
.upl:hover,.upl.over{border-color:var(--sleep);background:var(--sleep-soft)}
.upl.has{cursor:default;align-items:stretch;text-align:left}
.upl-ic{width:76px;height:76px;border-radius:22px;background:var(--sleep);color:var(--sleep-ink);display:grid;place-items:center;box-shadow:0 10px 24px -10px var(--sleep)}
.upl-ic svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.upl-t{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15}
.big-up{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;font-size:16px;border-radius:14px;width:100%;max-width:320px;justify-content:center}
.big-up svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.addtile{width:92px;height:160px;border-radius:12px;border:2px dashed color-mix(in srgb,var(--sleep) 50%,var(--line));background:var(--sleep-soft);color:var(--sleep);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px}
.addtile b{font-size:26px;line-height:1}
.stepn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.stepn i{width:24px;height:24px;border-radius:50%;background:var(--sleep);color:var(--sleep-ink);display:grid;place-items:center;font-style:normal;font-size:12px;flex:none}
.stepn.done i{background:var(--good)}
.info{background:var(--sleep-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.sleep-card.big{flex-direction:column;align-items:stretch;gap:12px;padding:16px}
.sleep-card .row{justify-content:flex-start}
.sleep-btn{background:var(--sleep);color:var(--sleep-ink);border-color:var(--sleep)}
.sleep-btn:disabled{opacity:.4;cursor:default}
.sleep-hero{display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,var(--sleep-soft),var(--sheet) 200px)}
.night-l{font-family:var(--hand);font-size:clamp(24px,5.5vw,30px);color:var(--sleep);margin:-4px 0 0;line-height:1.1}
.done-pill.sl{background:var(--sleep);color:var(--sleep-ink);font-family:var(--body);font-size:12px;vertical-align:middle}
.drop{display:block;border:2px dashed color-mix(in srgb,var(--sleep) 45%,var(--line));border-radius:16px;padding:18px;cursor:pointer;background:var(--sheet);transition:border-color .15s,background .15s}
.drop:hover,.drop.over,.drop:focus-visible{border-color:var(--sleep);background:var(--sleep-soft)}
.drop-in{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.drop-ic{width:52px;height:52px;border-radius:50%;background:var(--sleep);color:var(--sleep-ink);display:grid;place-items:center;font-size:26px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.thumb{position:relative;width:92px;height:160px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.addmore{font-weight:600;color:var(--sleep);padding:8px}
.ctxs{display:flex;gap:6px;flex-wrap:wrap}
.ctx{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--cell);color:var(--ink-2)}
.ctx.on{background:var(--sleep-soft);color:var(--sleep)}
.moods.left{justify-content:flex-start}
#sNote,#sAbout{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;font:inherit;color:inherit;resize:vertical}
.linkbtn{border:0;background:none;color:var(--sleep);font-weight:600;padding:0;align-self:flex-start}
.manual,.editm{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:12px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.mgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.mgrid input{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 10px;font:inherit;color:var(--ink);min-width:0}
.warn{background:var(--danger-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.busy{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--sheet)}
.busy>div:nth-child(2){flex:1}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--sleep-soft);border-top-color:var(--sleep);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.night{display:flex;flex-direction:column;gap:14px}
.grade{font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px;white-space:nowrap}
.grade.g1,.grade.g2{background:var(--danger-soft);color:var(--danger)}
.grade.g3{background:color-mix(in srgb,var(--sl-awake) 22%,var(--sheet));color:color-mix(in srgb,var(--sl-awake) 70%,var(--ink))}
.grade.g4,.grade.g5{background:var(--sleep-soft);color:var(--sleep)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:600px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;border-top:3px solid var(--line)}
.tile.ok{border-top-color:var(--good)}.tile.mid{border-top-color:var(--sl-awake)}.tile.bad{border-top-color:var(--danger)}
.tv{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}
.phbar{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px}
.phbar i{display:block;min-width:4px}
.phleg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.phleg span{display:inline-flex;align-items:center;gap:5px}
.phleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.phleg em{font-style:normal;color:var(--ink-3)}
.xms{display:flex;gap:6px;flex-wrap:wrap}
.xm{font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink-2)}
.xm b{color:var(--ink);font-variant-numeric:tabular-nums}
.sum{margin:0;font-size:15px;line-height:1.55;max-width:68ch}
.pi{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.pi{grid-template-columns:1fr}}
.pi ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.good-l{color:var(--good)}.bad-l{color:var(--danger)}
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tip{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tip p{margin:0;font-size:14px;color:var(--ink-2)}
.tag.sl{background:var(--sleep-soft);color:var(--sleep);text-transform:capitalize}
.tonight{background:var(--sleep-soft);border-radius:14px;padding:12px}
.chk{list-style:none;margin:6px 0 0;padding:0}
.simgs{display:flex;gap:8px;flex-wrap:wrap}
.simg img{width:72px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.night-ctl{align-items:center}
.corr{display:flex;flex-direction:column;gap:6px}
.cr{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:10px;align-items:center;font-size:13px}
.cn{display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cn i{width:9px;height:9px;border-radius:50%;flex:none}
.cbar{position:relative;height:10px;background:var(--cell);border-radius:5px}
.cbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink-3)}
.cbar b{position:absolute;top:0;bottom:0;border-radius:5px}
.cbar b.pos{background:var(--sleep)}.cbar b.neg{background:var(--sl-awake)}
.cv{font-variant-numeric:tabular-nums;font-weight:700;min-width:62px;text-align:right}
.cv.pos{color:var(--sleep)}.cv.neg{color:color-mix(in srgb,var(--sl-awake) 75%,var(--ink))}
.report{border-left:3px solid var(--sleep);padding:2px 0 2px 14px;font-size:15px;line-height:1.55;max-width:70ch}
.report h4{font-family:var(--display);font-size:16px;margin:12px 0 4px}
.report p{margin:4px 0}.report ul{margin:4px 0;padding-left:18px}
.askf{display:flex;gap:8px}
.shist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.shist button{width:100%;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:8px 12px}
.shist button[aria-current="true"]{border-color:var(--sleep);background:var(--sleep-soft)}
.sd{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink-3);text-transform:uppercase;line-height:1.1}
.sd b{font-family:var(--display);font-size:20px;color:var(--ink)}
.sleep-card{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;background:linear-gradient(90deg,var(--sleep-soft),var(--sheet))}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* deporte */
nav.tabs{grid-template-columns:repeat(7,1fr)}
@media (max-width:520px){nav.tabs button{font-size:10.5px}.tic{width:19px;height:19px}}
.gym-btn{background:var(--gym);color:var(--gym-ink);border-color:var(--gym)}
.gym-btn:disabled{opacity:.4;cursor:default}
.run-btn{background:var(--run);color:var(--run-ink);border-color:var(--run)}
.gym-soft{background:var(--gym-soft);color:var(--gym);border:2px dashed color-mix(in srgb,var(--gym) 45%,var(--line))}
.gym-l{color:var(--gym)}
.tag.gymt{background:var(--gym-soft);color:var(--gym)}
.sp-head{display:flex;justify-content:center}
.sp-seg{width:100%;max-width:420px}.sp-seg button{flex:1}
.sp-hero{display:flex;flex-direction:column;gap:14px;background:linear-gradient(135deg,var(--gym-soft),var(--sheet) 55%,var(--run-soft))}
.sp-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.sp-actions{grid-template-columns:1fr}}
.sp-big{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:16px;padding:16px;color:#fff;box-shadow:var(--shadow)}
.sp-big.gym{background:var(--gym);color:var(--gym-ink)}.sp-big.run{background:var(--run);color:var(--run-ink)}
.sp-big svg{width:36px;height:36px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sp-big b{display:block;font-family:var(--display);font-size:18px}.sp-big small{opacity:.85;font-size:13px}
.sp-strava{align-self:flex-start;border-color:#FC4C02;color:#FC4C02;font-weight:700}
.sp-rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sp-ring{display:flex;align-items:center;gap:8px}
.sp-ring div{display:flex;flex-direction:column;line-height:1.15}.sp-ring b{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}.sp-ring span{font-size:12px;color:var(--ink-2)}
@media (max-width:560px){.sp-ring{flex-direction:column;text-align:center;gap:4px}.sp-ring svg{width:60px;height:60px}.sp-ring div{align-items:center}}
body.noscroll .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.sp-cal{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;max-width:520px}
.sp-cal span{aspect-ratio:1;border-radius:3px;background:var(--cell)}
.sp-cal span.g{background:var(--gym)}.sp-cal span.r{background:var(--run)}.sp-cal span.both{background:linear-gradient(135deg,var(--gym) 50%,var(--run) 50%)}.sp-cal span.fut{background:transparent}
.sp-feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sp-feed li>button{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:9px 12px}
.sp-feed li>button[aria-expanded="true"]{border-color:var(--ink-3)}
.sp-feed:not(.big) li>button{grid-template-columns:52px 34px 1fr}
.sp-feed b{display:block;font-size:14px}.sp-feed small{color:var(--ink-2);font-size:12.5px}
.dt{font-size:12px;color:var(--ink-3);font-weight:700;text-transform:uppercase}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff}.ic.g{background:var(--gym)}.ic.r{background:var(--run)}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prb{font-size:12px;font-weight:700;background:var(--gym-soft);color:var(--gym);border-radius:999px;padding:2px 8px}
.wod{display:flex;flex-direction:column;gap:10px;padding:12px 4px 4px}
.wod-ex{display:flex;flex-direction:column;gap:4px}
.wod-sets{display:flex;gap:6px;flex-wrap:wrap}.wod-sets span{font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}.wod-sets span.wu{opacity:.55}
.prchips{display:flex;gap:6px;flex-wrap:wrap}.prchips span{font-size:13px;background:var(--gym-soft);color:var(--gym);border-radius:999px;padding:3px 10px;font-weight:600}
.note{margin:0;font-style:italic;color:var(--ink-2);font-size:14px}
.rts{display:flex;flex-direction:column;gap:8px}
.rt{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-left:4px solid var(--gym);border-radius:12px;padding:10px 12px}
.rt b{display:block}.rt small{color:var(--ink-2);font-size:12.5px}
.rted{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:12px}
.rtrow{display:flex;align-items:center;gap:6px}.rtrow span:first-child{flex:1;font-size:14px}.rtrow input[type=number]{width:56px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px}
.prgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.prc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px 12px;border-top:3px solid var(--gym)}
.prc b{font-size:14px;line-height:1.2}.prv{font-family:var(--display);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}.prc small{font-size:12px;color:var(--ink-2)}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.exlist>div{display:flex;flex-direction:column;gap:2px}.exlist button{border:0;background:none;text-align:left;padding:4px 0;font-size:14px;color:var(--ink)}
.dotpr{color:var(--gym);font-size:10px}
.muss{display:flex;flex-direction:column;gap:6px}
.mus{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;font-size:13px}.mus em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.mbar{position:relative;height:10px;background:var(--cell);border-radius:5px;overflow:hidden;display:block}
.mbar b{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink-3)}.mbar b.ok{background:var(--good)}.mbar b.mid{background:var(--gym)}.mbar b.bad{background:var(--danger)}
.mbar i{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-2);opacity:.5}
.nt{background:var(--gym-soft);border-radius:10px;padding:8px 12px;font-size:14px}.nt.sm{font-size:12.5px;padding:5px 10px}
.rms{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (max-width:520px){.rms{grid-template-columns:repeat(3,1fr)}}
.rms div{border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column}.rms span{font-size:11px;color:var(--ink-3);font-weight:700}.rms b{font-variant-numeric:tabular-nums}
.exh{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}.exh li{display:grid;grid-template-columns:60px 1fr;gap:8px;font-size:14px;font-variant-numeric:tabular-nums;padding:4px 0;border-bottom:1px dashed var(--line)}
.rpr{display:flex;flex-direction:column}
.rprr{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.rprr:last-child{border-bottom:0}.rd{font-weight:700;font-size:14px}
.rprr b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}.rprr small{display:block;font-size:12px;color:var(--ink-2)}
.pred{text-align:right}.pred b{color:var(--run)}
.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:560px){.zones{grid-template-columns:repeat(2,1fr)}}
.zone{border:1px solid var(--line);border-radius:12px;padding:8px 10px;border-left:4px solid var(--zc);display:flex;flex-direction:column}
.zone span{font-weight:800;color:var(--zc);font-size:12px}.zone b{font-variant-numeric:tabular-nums;font-size:14px}.zone small{font-size:11.5px;color:var(--ink-2)}
.rwork{display:flex;flex-direction:column;gap:6px}
.rw{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rw summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none}.rw summary::-webkit-details-marker{display:none}
.rw summary b{display:block;font-size:14px}.rw summary small{color:var(--ink-2);font-size:12.5px}
.rw p{margin:8px 0 4px;font-size:14px;color:var(--ink-2)}.rw ol{margin:4px 0 10px;padding-left:20px;font-size:14px}
.zb{width:28px;height:28px;border-radius:8px;background:var(--zc);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:13px}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.drill{border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:2px;font-size:13.5px}.drill span{color:var(--ink-2)}
.shoe{display:flex;align-items:center;gap:10px}.shoe>span:first-child{min-width:140px}.shoe b{display:block;font-size:14px}.shoe small{font-size:12px;color:var(--ink-2)}
.runform{border-color:var(--run)}
.runform .col{display:flex;flex-direction:column;gap:4px}
.ta{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;font:inherit;color:inherit;resize:vertical}
.rfpace{display:block;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--run-soft);color:var(--run);font-weight:700;font-variant-numeric:tabular-nums}
.mgrid select{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 10px;min-width:0}
.splits{display:flex;flex-direction:column;gap:3px}
.srcp{color:var(--run);font-weight:600}
.xm.xpr{border-color:var(--run);background:var(--run-soft)}.xm em{font-style:normal;color:var(--ink-3)}
.splits div{display:grid;grid-template-columns:22px 1fr 50px;gap:8px;align-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.splits i{display:block;height:12px;border-radius:4px;background:color-mix(in srgb,var(--run) 55%,var(--cell))}.splits i.best{background:var(--run)}
.numin{width:80px;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 9px}
.sport-card{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;background:linear-gradient(90deg,var(--gym-soft),var(--sheet) 60%,var(--run-soft))}
.report.sp-rep{border-left-color:var(--gym)}
/* entreno en curso */
.wo{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:14px 16px 20px}
.wo-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:var(--ov);padding:6px 0;z-index:2}

<script>
(function(){
"use strict";
const COLORS=["#3A6FF7","#E4572E","#F2A20C","#1FA187","#8E44EC","#E8467C","#23A6D5","#6BAA3A","#B0724A","#5D6B89","#D35DB3","#0E9F9A"];
const MONTHS=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MON_S=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const WD=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const WDL=["D","L","M","X","J","V","S"];
const LS="habituario.v1";

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const todayStr=()=>fmt(new Date());
const ym=s=>s.slice(0,7);
const weekStart=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return fmt(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>"h"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- state ---------- */
const S={
  habits:[], months:{}, mode:"loading", loaded:false,
  view:(["inicio","hoy","agenda","master","opos","habituario","stats","calma","sueno","habitos","mas","revision","logros","atajos","lecturas"].includes(location.hash.slice(1))?location.hash.slice(1):"inicio"),
  date:todayStr(), gridMonth:ym(todayStr()),
  range:"diario", filter:"all",
  open:{}, editId:null, delId:null, newColor:null, newTarget:7, newName:""
};
let DEMO=null;
const isDemo=()=>S.loaded&&S.habits.length===0;
const H=()=>isDemo()?DEMO.habits:S.habits;
const M=()=>isDemo()?DEMO.months:S.months;
const active=()=>H().filter(h=>!h.archived);

function isDone(hid,ds){const m=M()[ym(ds)];const a=m&&m.d&&m.d[String(+ds.slice(8))];return !!(a&&a.includes(hid))}
function setDone(hid,ds,on){
  const months=M();const k=ym(ds),day=String(+ds.slice(8));
  const m=months[k]||(months[k]={d:{}});m.d=m.d||{};
  const arr=(m.d[day]||[]).filter(x=>x!==hid);if(on)arr.push(hid);
  if(arr.length)m.d[day]=arr;else delete m.d[day];
  if(!isDemo())saveMonth(k);
}
const hasItems=h=>Array.isArray(h.items)&&h.items.length>0;
function subRaw(hid,ds){const m=M()[ym(ds)];const x=m&&m.s&&m.s[String(+ds.slice(8))];return (x&&x[hid])||[]}
function subEff(h,ds){
  const ids=h.items.map(i=>i.id);const l=subRaw(h.id,ds).filter(id=>ids.includes(id));
  if(!l.length&&isDone(h.id,ds))return ids.slice();return l;
}
function setSubs(h,ds,list){
  const months=M();const k=ym(ds),day=String(+ds.slice(8));
  const m=months[k]||(months[k]={d:{}});m.s=m.s||{};
  const dayS=m.s[day]||{};
  if(list.length)dayS[h.id]=list;else delete dayS[h.id];
  if(Object.keys(dayS).length)m.s[day]=dayS;else delete m.s[day];
  setDone(h.id,ds,h.items.every(it=>list.includes(it.id)));
}

/* ---------- demo ---------- */
function makeDemo(){
  const t=todayStr(),start=addDays(t,-120);
  const habits=[
    {id:"d1",name:"Leer 20 minutos",color:COLORS[0],target:7,created:start},
    {id:"d2",name:"Beber 2 L de agua",color:COLORS[6],target:7,created:start},
    {id:"d3",name:"Entrenar",color:COLORS[1],target:4,created:start},
    {id:"d4",name:"Estudiar",color:COLORS[4],target:5,created:start},
    {id:"d5",name:"Dormir antes de las 00:00",color:COLORS[7],target:7,created:start}
  ];
  const months={};let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const p={d1:.78,d2:.85,d3:.55,d4:.66,d5:.6};
  for(let i=120;i>=1;i--){const ds=addDays(t,-i);const k=ym(ds),day=String(+ds.slice(8));
    habits.forEach(h=>{const boost=i<30?.08:0;if(rnd()<p[h.id]+boost){(months[k]=months[k]||{d:{}}).d[day]=(months[k].d[day]||[]).concat(h.id)}})}
  const k=ym(t),day=String(+t.slice(8));(months[k]=months[k]||{d:{}}).d[day]=["d1","d2"];
  return{habits,months};
}
DEMO=makeDemo();

/* ---------- storage ---------- */
let db=null;
function saveLocal(noAch){try{localStorage.setItem(LS,JSON.stringify({habits:S.habits,months:S.months,calm:C.cfg,calmLog:C.log,sleep:SL.nights,sleepCfg:SL.cfg,sleepMeta:SL.meta,workouts:SP.workouts,runs:SP.runs,sportCfg:SP.cfg,sportMeta:SP.meta,journal:J.entries,journalCfg:J.cfg,agenda:AG.tasks,opos:O.t,oposCfg:O.cfg,oposLog:O.log,msAtt:MS.att,oBank:O.bank,oCards:O.cards,oQstat:O.qstat,oCrev:O.crev,msNotes:MS.notes,tfm:MS.tfm,prac:MS.prac,rev:REV.w,ach:ACH.u,lect:LB.books,lectCfg:LB.cfg,msForos:MS.foros,msActs:MS.acts,msEval:MS.ev,msTq:MS.tq,msCards:MS.mcards,msCrev:MS.mcrev}))}catch(e){}if(!noAch){clearTimeout(saveLocal.t);saveLocal.t=setTimeout(achCheck,600)}}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r&&Array.isArray(r.habits)){S.habits=r.habits;S.months=r.months||{};if(r.calm)C.cfg={...CDEF,...r.calm,parts:{...CDEF.parts,...(r.calm.parts||{})}};if(r.calmLog)C.log=r.calmLog;if(r.sleep)SL.nights=r.sleep;if(r.sleepCfg)SL.cfg={...SDEF,...r.sleepCfg};if(r.sleepMeta)SL.meta=r.sleepMeta;if(r.workouts)SP.workouts=r.workouts;if(r.runs)SP.runs=r.runs;if(r.sportCfg)SP.cfg={...SPDEF,...r.sportCfg};if(r.sportMeta)SP.meta=r.sportMeta;if(r.journal)J.entries=r.journal;if(r.journalCfg)J.cfg={...JDEF,...r.journalCfg};if(r.agenda)AG.tasks=r.agenda;if(r.opos)O.t=r.opos;if(r.oposCfg)O.cfg={...ODEF,...r.oposCfg};if(r.oposLog)O.log={s:[],tests:[],uds:[],prog:"",...r.oposLog};if(r.msAtt)MS.att=r.msAtt;if(r.oBank)O.bank=r.oBank;if(r.oCards)O.cards=r.oCards;if(r.oQstat)O.qstat=r.oQstat;if(r.oCrev)O.crev=r.oCrev;if(r.msNotes)MS.notes=r.msNotes;if(r.tfm)MS.tfm={...JSON.parse(JSON.stringify(TFMDEF)),...r.tfm};if(r.prac)MS.prac={...JSON.parse(JSON.stringify(PRDEF)),...r.prac};if(r.rev)REV.w=r.rev;if(r.ach)ACH.u=r.ach;if(r.lect)LB.books=r.lect;if(r.lectCfg)LB.cfg={...LB.cfg,...r.lectCfg};if(r.msForos)MS.foros=r.msForos;if(r.msActs)MS.acts=r.msActs;if(r.msEval)MS.ev=r.msEval;if(r.msTq)MS.tq={...MS.tq,...r.msTq};if(r.msCards)MS.mcards=r.msCards;if(r.msCrev)MS.mcrev=r.msCrev;return true}}catch(e){}return false}
const dirty={},running={};
function queue(path,body){
  if(!db)return;dirty[path]=body;if(running[path])return;running[path]=true;
  (async()=>{while(dirty[path]){const b=dirty[path]();dirty[path]=null;
    try{await db.doc(path).set(b)}catch(e){if(e&&e.code==="quota_exceeded")toast("No queda espacio para guardar más meses.");else if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await db.doc(path).set(b)}catch(_){toast("No se pudo guardar. Revisa la conexión.")}}else toast("No se pudo guardar el cambio.")}}
    running[path]=false})();
}
function saveHabits(){saveLocal();queue("config/habits",()=>({habits:S.habits}))}
function saveMonth(k){saveLocal();queue("months/"+k,()=>({d:(S.months[k]&&S.months[k].d)||{},s:(S.months[k]&&S.months[k].s)||{}}))}

function setSync(){
  const el=document.getElementById("sync");
  const t={loading:"Cargando…",db:"Guardado en tu cuenta",local:window.__ghApp?"Guardado en este móvil":"Guardado en este navegador"}[S.mode];
  el.className="sync"+(S.mode==="db"?" ok":"");el.querySelector("span").textContent=t;
}

/* ---------- stats ---------- */
function score(start,end,list){
  const t=todayStr();if(end>t)end=t;let num=0,den=0;
  list.forEach(h=>{const s=start>h.created?start:h.created;if(s>end)return;
    const days=daysBetween(s,end)+1;const exp=h.target*days/7;let done=0;
    for(let d=s;d<=end;d=addDays(d,1))if(isDone(h.id,d))done++;
    num+=Math.min(done,exp);den+=exp});
  return den?num/den:null;
}
function streak(h,upto){
  let d=upto||todayStr();if(!isDone(h.id,d))d=addDays(d,-1);let n=0;
  while(d>=h.created&&isDone(h.id,d)){n++;d=addDays(d,-1)}return n;
}
function bestStreak(h){let best=0,cur=0;const t=todayStr();for(let d=h.created;d<=t;d=addDays(d,1)){if(isDone(h.id,d)){cur++;if(cur>best)best=cur}else cur=0}return best}
function countDone(h,start,end){let n=0;for(let d=start;d<=end;d=addDays(d,1))if(isDone(h.id,d))n++;return n}

/* ---------- render ---------- */
const main=document.getElementById("main");
function render(){
  const ae=document.activeElement;const fid=ae&&ae.id&&main.contains(ae)?ae.id:null;let sel=null;try{sel=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null}catch(e){}
  try{_render()}finally{if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{if(sel)el.setSelectionRange(sel[0],sel[1])}catch(e){}}}}
}
function _render(){
  const navV=["habituario","stats","habitos","revision","logros","atajos"].includes(S.view)?"mas":S.view;document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===navV));
  document.getElementById("demo").innerHTML=isDemo()?`<div class="banner"><div><b>Vista de ejemplo.</b> <span class="muted small">Estos hábitos y datos son inventados para que veas cómo funciona. Desaparecen al crear el primero tuyo.</span></div><div class="row"><button class="btn" data-act="bk-load">Restaurar mi copia</button><button class="btn primary" data-act="go-add">Crear mi primer hábito</button></div></div>`:"";
  setSync();
  if(S.view==="hoy")main.innerHTML=(S.loaded&&!isDemo()?vSleepCard():"")+vHoy()+(S.loaded?vCalmCard():"");
  else if(S.view==="inicio")main.innerHTML=vInicio();
  else if(S.view==="agenda")main.innerHTML=vAgenda();
  else if(S.view==="master")main.innerHTML=vMasterAll();
  else if(S.view==="revision")main.innerHTML=vRevision();
  else if(S.view==="lecturas")main.innerHTML=vLecturas();
  else if(S.view==="logros")main.innerHTML=vLogros();
  else if(S.view==="atajos")main.innerHTML=vAtajos();
  else if(S.view==="opos")main.innerHTML=vOpos();
  else if(S.view==="mas")main.innerHTML=vMas();
  else if(S.view==="calma")main.innerHTML=vCalm();
  else if(S.view==="sueno")main.innerHTML=vSleep();
  else if(S.view==="habituario")main.innerHTML=vGrid();
  else if(S.view==="stats"){main.innerHTML=vStats();drawChart()}
  else main.innerHTML=vManage();
  document.querySelectorAll(".subtabs.scroll").forEach(st=>{const el=st.querySelector('[aria-selected="true"]');if(el)st.scrollLeft=el.offsetLeft-st.offsetLeft-(st.clientWidth-el.offsetWidth)/2});
}

const checkSvg=`<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function vHoy(){
  const t=todayStr(),d=S.date,dd=parse(d);
  const list=active().filter(h=>h.created<=d);
  const done=list.filter(h=>isDone(h.id,d)).length;
  const pct=list.length?done/list.length:0;
  const R=52,C=2*Math.PI*R;
  const label=d===t?"Hoy":d===addDays(t,-1)?"Ayer":WD[dd.getDay()][0].toUpperCase()+WD[dd.getDay()].slice(1);
  const rows=list.map(h=>{
    const on=isDone(h.id,d);const st=streak(h,d);
    const dots=[...Array(7)].map((_,i)=>{const x=addDays(d,i-6);return`<span class="${isDone(h.id,x)?"on":""}" title="${x}"></span>`}).join("");
    const tgt=h.target===7?"todos los días":h.target+" días/semana";
    if(hasItems(h)){
      const eff=subEff(h,d);const n=h.items.length,k=eff.length;
      const open=S.open[h.id]!==undefined?S.open[h.id]:!on;
      const groups=[];h.items.forEach(it=>{const w=(it.when||"").trim()||"En cualquier momento";let g=groups.find(x=>x.w===w);if(!g)groups.push(g={w,items:[]});g.items.push(it)});
      const subsHtml=groups.map(g=>`<div class="sub-group"><div class="sub-when">${esc(g.w)}</div>${g.items.map(it=>{const s=eff.includes(it.id);
        return`<button class="sub ${s?"on":""}" data-act="sub" data-id="${h.id}" data-item="${it.id}" aria-pressed="${s}"><span class="box">${checkSvg.replace('width="16" height="16"','width="13" height="13"')}</span><span class="snm">${esc(it.name)}</span>${it.dose?`<span class="dose">${esc(it.dose)}</span>`:"<span></span>"}</button>`}).join("")}</div>`).join("");
      return`<div class="hgroup ${open?"open":""}" style="--c:${h.color}">
        <button class="habit ${on?"done":""}" style="--c:${h.color}" data-act="expand" data-id="${h.id}" aria-expanded="${open}">
          <span class="check has-pie">${checkSvg}${on?"":`<span class="pie" style="--p:${Math.round(k/n*100)}"></span>`}</span>
          <span><span class="h-name">${esc(h.name)}</span><br><span class="h-meta">${k} de ${n} tomas${st?` · 🔥 ${st} ${st===1?"día seguido":"días seguidos"}`:""}</span></span>
          <span class="hright"><span class="week-dots" aria-hidden="true">${dots}</span><span class="chev" aria-hidden="true">▾</span></span></button>
        ${open?`<div class="subs">${subsHtml}<div class="sub-foot"><span class="small muted">${on?"Completado ✓":"Se completa al marcar todas las tomas."}</span>
          <button class="btn" data-act="sub-all" data-id="${h.id}">${k===n?"Desmarcar todo":"Marcar todo"}</button></div></div>`:""}
      </div>`;
    }
    return`<button class="habit ${on?"done":""}" style="--c:${h.color}" data-act="toggle" data-id="${h.id}" aria-pressed="${on}">
      <span class="check">${checkSvg}</span>
      <span><span class="h-name">${esc(h.name)}</span><br><span class="h-meta">${st?`🔥 ${st} ${st===1?"día seguido":"días seguidos"} · `:""}${tgt}</span></span>
      <span class="week-dots" aria-hidden="true">${dots}</span></button>`}).join("");
  return`<section class="sheet" style="display:flex;flex-direction:column;gap:16px">
    <div class="day-head">
      <div><p class="day-title">${label}, ${dd.getDate()} de ${MONTHS[dd.getMonth()]}</p>
      <div class="day-sub">${d===t?"Marca lo que ya has hecho hoy.":"Puedes corregir días pasados."}</div></div>
      <div class="row">
        <button class="icon-btn" data-act="day" data-n="-1" aria-label="Día anterior">‹</button>
        ${d!==t?`<button class="btn" data-act="day-today">Hoy</button>`:""}
        <button class="icon-btn" data-act="day" data-n="1" aria-label="Día siguiente" ${d>=t?"disabled":""}>›</button>
      </div>
    </div>
    <div class="today-grid">
      <div class="ring-box">
        <svg width="136" height="136" viewBox="0 0 136 136" role="img" aria-label="${done} de ${list.length} hábitos">
          <circle cx="68" cy="68" r="${R}" fill="none" stroke="var(--cell)" stroke-width="12"/>
          <circle cx="68" cy="68" r="${R}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 68 68)" style="transition:stroke-dashoffset .4s"/>
          <text x="68" y="70" text-anchor="middle" class="ring-num">${Math.round(pct*100)}%</text>
          <text x="68" y="90" text-anchor="middle" class="ring-cap">${done} de ${list.length}</text>
        </svg>
        <div class="small muted" style="text-align:center">${pct===1&&list.length?"Día completo ✓":"Últimos 7 días a la derecha"}</div>
      </div>
      <div class="habits">${rows||`<p class="muted">No hay hábitos activos este día.</p>`}
        <form class="quick" data-form="quick"><input type="text" id="quickName" placeholder="Añadir hábito rápido…" maxlength="60" aria-label="Nuevo hábito"><button class="btn primary">Añadir</button></form>
      </div>
    </div></section>`;
}

function vGrid(){
  const [y,m]=S.gridMonth.split("-").map(Number);const n=new Date(y,m,0).getDate();const t=todayStr();
  const list=active();
  const days=[...Array(n)].map((_,i)=>S.gridMonth+"-"+pad(i+1));
  const head=days.map(ds=>{const w=parse(ds).getDay();return`<th class="${w===0||w===6?"wk":""}">${WDL[w]}<b>${+ds.slice(8)}</b></th>`}).join("");
  const body=list.map(h=>{
    let c=0;const cells=days.map(ds=>{const on=isDone(h.id,ds);if(on)c++;const fut=ds>t,pre=ds<h.created;
      const part=!on&&hasItems(h)&&subEff(h,ds).length>0;
      return`<td><button class="cell ${on?"on":""} ${part?"part":""} ${ds===t?"today":""} ${pre&&!on&&!part?"pre":""}" style="--c:${h.color}" data-act="gtoggle" data-id="${h.id}" data-d="${ds}" ${fut?"disabled":""} aria-label="${esc(h.name)} ${ds}${on?" hecho":""}"></button></td>`}).join("");
    const upto=S.gridMonth===ym(t)?+t.slice(8):(S.gridMonth<ym(t)?n:0);
    return`<tr><th class="hn" style="--c:${h.color}" title="${esc(h.name)}"><span class="dot"></span>${esc(h.name)}</th>${cells}<td class="cnt"><b>${c}</b>/${upto}</td></tr>`}).join("");
  const foot=days.map(ds=>{if(ds>t)return"<td></td>";const s=score(ds,ds,list);return`<td><div class="pbar" style="height:${s==null?0:Math.max(2,Math.round(s*30))}px" title="${s==null?"":Math.round(s*100)+"%"}"></div></td>`}).join("");
  const ms=score(S.gridMonth+"-01",S.gridMonth+"-"+pad(n),list);
  return`<section class="sheet" style="display:flex;flex-direction:column;gap:14px">
    <div class="spread">
      <div><div class="lbl">Habituario</div><h2 class="sec" style="text-transform:capitalize">${MONTHS[m-1]} ${y}</h2></div>
      <div class="row">
        <span class="small muted">Cumplimiento del mes: <b style="color:var(--ink)">${ms==null?"—":Math.round(ms*100)+"%"}</b></span>
        <button class="icon-btn" data-act="gm" data-n="-1" aria-label="Mes anterior">‹</button>
        <button class="icon-btn" data-act="gm" data-n="1" aria-label="Mes siguiente" ${S.gridMonth>=ym(t)?"disabled":""}>›</button>
      </div>
    </div>
    ${list.length?`<div class="grid-wrap"><table class="hgrid"><thead><tr><th class="hn"></th>${head}<th></th></tr></thead><tbody>${body}</tbody>
      <tfoot><tr><th>% día</th>${foot}<td></td></tr></tfoot></table></div>
      <p class="small muted" style="margin:0">Toca una casilla para marcarla o desmarcarla. Las rayadas son días anteriores a crear el hábito.</p>`:`<p class="muted">Añade hábitos para ver tu habituario.</p>`}
  </section>`;
}

function periods(){
  const t=todayStr();
  if(S.range==="diario")return[...Array(30)].map((_,i)=>{const d=addDays(t,i-29);const dd=parse(d);return{s:d,e:d,l:String(dd.getDate()),full:dd.getDate()+" "+MON_S[dd.getMonth()]}});
  if(S.range==="semanal"){const w0=weekStart(t);return[...Array(12)].map((_,i)=>{const s=addDays(w0,(i-11)*7),e=addDays(s,6);const dd=parse(s);return{s,e,l:dd.getDate()+" "+MON_S[dd.getMonth()],full:"Semana del "+dd.getDate()+" "+MON_S[dd.getMonth()]}})}
  const [y,m]=t.split("-").map(Number);return[...Array(12)].map((_,i)=>{const d=new Date(y,m-1-(11-i),1);const s=fmt(d),e=fmt(new Date(d.getFullYear(),d.getMonth()+1,0));return{s,e,l:MON_S[d.getMonth()],full:MONTHS[d.getMonth()]+" "+d.getFullYear()}});
}
function statList(){const a=active();return S.filter==="all"?a:a.filter(h=>h.id===S.filter)}

function vStats(){
  const a=active();if(S.filter!=="all"&&!a.find(h=>h.id===S.filter))S.filter="all";
  const list=statList();const t=todayStr();
  const ps=periods();const vals=ps.map(p=>score(p.s,p.e,list)).filter(v=>v!=null);
  const avg=vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:null;
  const cur=list.length?Math.max(...list.map(h=>streak(h))):0;
  const best=list.length?Math.max(...list.map(bestStreak)):0;
  let perfect=0;for(let i=0;i<30;i++){const d=addDays(t,-i);const s=score(d,d,list);if(s!=null&&s>=.999)perfect++}
  const rangeTxt={diario:"últimos 30 días",semanal:"últimas 12 semanas",mensual:"últimos 12 meses"}[S.range];
  const chips=`<button class="chip" data-act="filter" data-id="all" aria-pressed="${S.filter==="all"}"><i></i>Todos</button>`+a.map(h=>`<button class="chip" style="--c:${h.color}" data-act="filter" data-id="${h.id}" aria-pressed="${S.filter===h.id}"><i></i>${esc(h.name)}</button>`).join("");
  const s30=addDays(t,-29);
  const cards=list.map(h=>{
    const r=score(s30,t,[h]);const w0=weekStart(t);const start=addDays(w0,-11*7);
    const cells=[...Array(84)].map((_,i)=>{const d=addDays(start,i);const cls=d>t?"fut":(isDone(h.id,d)?"on":"");return`<span class="${cls}" title="${d}"></span>`}).join("");
    return`<div class="hcard" style="--c:${h.color}"><h3><i></i>${esc(h.name)}</h3>
      <div class="hstats"><div><b>${r==null?"—":Math.round(r*100)+"%"}</b>30 días</div><div><b>${streak(h)}</b>racha</div><div><b>${bestStreak(h)}</b>mejor</div><div><b>${countDone(h,h.created,t)}</b>total</div></div>
      <div class="heat" aria-label="Últimas 12 semanas">${cells}</div></div>`}).join("");
  return`<section class="sheet" style="display:flex;flex-direction:column;gap:16px">
    <div class="spread"><div><div class="lbl">Gráficas</div><h2 class="sec">Cómo vas</h2></div>
      <div class="seg" role="group" aria-label="Periodo">
        ${["diario","semanal","mensual"].map(r=>`<button data-act="range" data-r="${r}" aria-pressed="${S.range===r}">${r[0].toUpperCase()+r.slice(1)}</button>`).join("")}
      </div></div>
    <div class="chips">${chips}</div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">Media</div><div class="v">${avg==null?"—":Math.round(avg*100)}<small>%</small></div><div class="small muted">${rangeTxt}</div></div>
      <div class="kpi"><div class="lbl">Racha actual</div><div class="v">${cur}<small> días</small></div><div class="small muted">${S.filter==="all"?"el hábito más constante":"seguidos"}</div></div>
      <div class="kpi"><div class="lbl">Mejor racha</div><div class="v">${best}<small> días</small></div><div class="small muted">desde que empezaste</div></div>
      <div class="kpi"><div class="lbl">Días completos</div><div class="v">${perfect}<small>/30</small></div><div class="small muted">todo cumplido</div></div>
    </div>
    <div class="chart" id="chart" aria-label="Gráfica de cumplimiento"></div>
    <p class="small muted" style="margin:0">El % tiene en cuenta el objetivo de cada hábito: si uno es de 4 días por semana, cumplir 4 cuenta como el 100%.</p>
  </section>
  ${list.length?`<section class="sheet" style="display:flex;flex-direction:column;gap:12px"><div><div class="lbl">Por hábito</div><h2 class="sec">Últimas 12 semanas</h2></div><div class="hcards">${cards}</div></section>`:""}`;
}

function drawChart(){
  const el=document.getElementById("chart");if(!el)return;
  const list=statList();const ps=periods();const data=ps.map(p=>({...p,v:score(p.s,p.e,list)}));
  const W=Math.max(280,el.clientWidth),Hh=220,L=36,Rp=6,T=14,B=26;const pw=W-L-Rp,ph=Hh-T-B;
  const color=S.filter==="all"?"var(--accent)":(list[0]&&list[0].color)||"var(--accent)";
  const bw=pw/data.length;const every=Math.max(1,Math.ceil(data.length*34/pw));
  let g="";[0,.25,.5,.75,1].forEach(v=>{const y=T+ph*(1-v);g+=`<line x1="${L}" x2="${W-Rp}" y1="${y}" y2="${y}" stroke="var(--line)" ${v?'stroke-dasharray="3 4"':""}/>`;if(v*100%50===0)g+=`<text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${v*100}%</text>`});
  const avg=data.filter(d=>d.v!=null);const av=avg.length?avg.reduce((a,b)=>a+b.v,0)/avg.length:null;
  let bars="";data.forEach((d,i)=>{const x=L+i*bw+bw*.16,w=bw*.68;
    if(d.v!=null){const h=Math.max(2,ph*d.v);const last=i===data.length-1;bars+=`<rect x="${x}" y="${T+ph-h}" width="${w}" height="${h}" rx="${Math.min(4,w/3)}" fill="${color}" opacity="${last?1:.72}"><title>${d.full}: ${Math.round(d.v*100)}%</title></rect>`;
      if(last)bars+=`<text x="${x+w/2}" y="${T+ph-h-5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${Math.round(d.v*100)}%</text>`}
    else bars+=`<rect x="${x}" y="${T+ph-2}" width="${w}" height="2" fill="var(--line)"/>`;
    if((data.length-1-i)%every===0)bars+=`<text x="${x+w/2}" y="${Hh-8}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${d.l}</text>`});
  if(av!=null){const y=T+ph*(1-av);bars+=`<line x1="${L}" x2="${W-Rp}" y1="${y}" y2="${y}" stroke="var(--ink-2)" stroke-width="1.2" stroke-dasharray="6 4"/><text x="${W-Rp}" y="${y-5}" text-anchor="end" font-size="11" fill="var(--ink-2)">media ${Math.round(av*100)}%</text>`}
  el.innerHTML=`<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img">${g}${bars}</svg>`;
}

function colorForm(sel,act){return`<div class="swatches">${COLORS.map(c=>`<button type="button" class="sw" style="--c:${c}" data-act="${act}" data-c="${c}" aria-pressed="${sel===c}" aria-label="Color ${c}"></button>`).join("")}</div>`}
function targetSelect(id,v){return`<select id="${id}" aria-label="Objetivo">${[7,6,5,4,3,2,1].map(n=>`<option value="${n}" ${v===n?"selected":""}>${n===7?"Todos los días":n+" días por semana"}</option>`).join("")}</select>`}
function nextColor(){const used=S.habits.map(h=>h.color);return COLORS.find(c=>!used.includes(c))||COLORS[S.habits.length%COLORS.length]}

function vManage(){
  if(!S.newColor)S.newColor=nextColor();
  const real=S.habits;const act=real.filter(h=>!h.archived),arc=real.filter(h=>h.archived);
  const row=(h,i,arr)=>{
    if(S.editId===h.id){const dr=S.editDraft||{};const items=S.editItems||[];
      return`<div class="mrow" style="--c:${h.color}"><form class="form" data-form="edit" data-id="${h.id}">
      <input type="text" id="en_${h.id}" value="${esc(dr.name!=null?dr.name:h.name)}" maxlength="60" aria-label="Nombre">
      ${colorForm(S.editColor||h.color,"ecolor")}
      <div class="items-ed"><div class="lbl">Desglose (opcional)</div>
        ${items.map(it=>`<div class="irow"><input type="text" id="iw_${it.id}" placeholder="Momento" value="${esc(it.when||"")}" aria-label="Momento">
          <input type="text" class="in-n" id="in_${it.id}" placeholder="Qué (p. ej. Creatina)" value="${esc(it.name||"")}" aria-label="Paso">
          <input type="text" id="id_${it.id}" placeholder="Dosis" value="${esc(it.dose||"")}" aria-label="Dosis">
          <button type="button" class="icon-btn" data-act="irm" data-item="${it.id}" aria-label="Quitar paso">×</button></div>`).join("")}
        <div class="row"><button type="button" class="btn" data-act="iadd">+ Añadir paso</button>
        <span class="small muted">Con desglose, el hábito se marca solo cuando completas todos los pasos.</span></div></div>
      <div class="row">${targetSelect("et_"+h.id,dr.target||h.target)}<button class="btn primary">Guardar</button><button type="button" class="btn ghost" data-act="cancel-edit">Cancelar</button></div></form></div>`}
    return`<div class="mrow" style="--c:${h.color}"><div class="spread">
      <div><span class="dot"></span><div><div class="nm">${esc(h.name)}</div><div class="small muted">${h.target===7?"Todos los días":h.target+" días por semana"}${hasItems(h)?` · ${h.items.length} pasos`:""} · desde ${parse(h.created).getDate()} ${MON_S[parse(h.created).getMonth()]}</div></div></div>
      <div class="row">
        ${h.archived?`<button class="btn" data-act="unarchive" data-id="${h.id}">Recuperar</button>`:`
        <button class="icon-btn" data-act="up" data-id="${h.id}" aria-label="Subir" ${i===0?"disabled":""}>↑</button>
        <button class="icon-btn" data-act="down" data-id="${h.id}" aria-label="Bajar" ${i===arr.length-1?"disabled":""}>↓</button>
        <button class="btn" data-act="edit" data-id="${h.id}">Editar</button>
        <button class="btn" data-act="archive" data-id="${h.id}">Archivar</button>`}
        <button class="btn ghost" data-act="del" data-id="${h.id}" style="color:var(--danger)">Eliminar</button>
      </div></div>
      ${S.delId===h.id?`<div class="confirm"><span class="small">Se borrará el hábito y todo su historial. No se puede deshacer.</span><button class="btn danger" data-act="del-yes" data-id="${h.id}">Eliminar</button><button class="btn ghost" data-act="del-no">Cancelar</button></div>`:""}
    </div>`};
  return`<section class="sheet" style="display:flex;flex-direction:column;gap:14px" id="addBox">
    <div><div class="lbl">Nuevo hábito</div><h2 class="sec">Añadir</h2></div>
    <form class="form" data-form="add">
      <input type="text" id="newName" placeholder="Ej.: Leer 20 minutos, meditar, no azúcar…" maxlength="60" value="${esc(S.newName)}" aria-label="Nombre del hábito">
      ${colorForm(S.newColor,"ncolor")}
      <div class="row">${targetSelect("newTarget",S.newTarget)}<button class="btn primary">Añadir hábito</button></div>
    </form></section>
  <section class="sheet" style="display:flex;flex-direction:column;gap:12px">
    <div><div class="lbl">Tus hábitos</div><h2 class="sec">${act.length} activos</h2></div>
    <div class="mlist">${act.map(row).join("")||`<p class="muted small">Todavía no tienes hábitos. Crea el primero arriba.</p>`}</div>
    ${arc.length?`<div class="lbl" style="margin-top:6px">Archivados</div><div class="mlist">${arc.map(row).join("")}</div><p class="small muted" style="margin:0">Los archivados no salen en Hoy ni en las gráficas, pero conservan su historial.</p>`:""}
  </section>`+vBackup();
}

/* ---------- actions ---------- */
function exitDemoIfNeeded(){/* real data starts empty; demo is derived from S.habits being empty */}
function addHabit(name,color,target){
  name=name.trim();if(!name)return false;
  S.habits.push({id:uid(),name,color:color||nextColor(),target:target||7,created:todayStr(),archived:false});
  saveHabits();return true;
}
function captureEdit(){
  const id=S.editId;if(!id)return;const v=x=>{const el=document.getElementById(x);return el?el.value:null};
  S.editDraft={name:v("en_"+id),target:+(v("et_"+id)||7)};
  (S.editItems||[]).forEach(it=>{const w=v("iw_"+it.id),n=v("in_"+it.id),d=v("id_"+it.id);if(w!=null)it.when=w;if(n!=null)it.name=n;if(d!=null)it.dose=d});
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function go(v){S.view=v;try{history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo({top:0})}

document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.view)});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="go"){go(b.dataset.v);return}
  if(a==="go-tema"){O.open=+b.dataset.n;O.filter="all";O.q="";go("opos");setTimeout(()=>{const el=document.getElementById("ot_"+b.dataset.n);if(el)el.scrollIntoView({block:"center"})},80);return}
  if(/^o-(af|ses|st[a-z])/.test(a)&&a!=="o-stage"&&a!=="o-study"){v22Opos(a,b);return}
  if(a.startsWith("l-")){lecturasAction(a,b);return}
  if(/^m-(f[a-z]|a(form|fil|done|del)$|ev)/.test(a)){master3Action(a,b);return}
  if(/^m[tk]-/.test(a)){mtAction(a,b);return}
  if(a==="o-sub"){O.sub=b.dataset.k;render();window.scrollTo({top:0});return}
  if(/^[tkpf]-/.test(a)){studyAction(a,b);return}
  if(/^[rx]-/.test(a)){extrasAction(a,b);return}
  if(a.startsWith("o-")){oposAction(a,b);return}
  if(a.startsWith("ag-")){agendaAction(a,b);return}
  if(a.startsWith("m-")){(["m-sel","m-month","m-att"].includes(a)?masterAction:master2Action)(a,b);return}
  if(a.startsWith("c-")){calmAction(a,b);return}
  if(a.startsWith("s-")){sleepAction(a,b);return}
  if(a.startsWith("sp-")){sportAction(a,b);return}
  if(a.startsWith("j-")){journalAction(a,b);return}
  const idx=()=>S.habits.findIndex(h=>h.id===id);
  switch(a){
    case"go-add":go("habitos");setTimeout(()=>{const i=document.getElementById("newName");i&&i.focus()},50);break;
    case"toggle":setDone(id,S.date,!isDone(id,S.date));render();break;
    case"gtoggle":{const h=H().find(x=>x.id===id);const ds=b.dataset.d;
      if(h&&hasItems(h))setSubs(h,ds,isDone(id,ds)?[]:h.items.map(i=>i.id));else setDone(id,ds,!isDone(id,ds));render();break}
    case"expand":{const h=H().find(x=>x.id===id);const cur=S.open[id]!==undefined?S.open[id]:!isDone(id,S.date);S.open[id]=!cur;render();break}
    case"sub":{const h=H().find(x=>x.id===id);const it=b.dataset.item;const eff=subEff(h,S.date);
      setSubs(h,S.date,eff.includes(it)?eff.filter(x=>x!==it):eff.concat(it));
      if(isDone(id,S.date)){S.open[id]=true;toast("¡"+h.name.replace(/\s*\p{Extended_Pictographic}️?/gu,"").trim()+" completado!")}render();break}
    case"sub-all":{const h=H().find(x=>x.id===id);S.open[id]=true;const all=subEff(h,S.date).length===h.items.length;setSubs(h,S.date,all?[]:h.items.map(i=>i.id));render();break}
    case"iadd":captureEdit();S.editItems.push({id:"i"+uid().slice(1),when:"",name:"",dose:""});render();setTimeout(()=>{const l=S.editItems[S.editItems.length-1];const el=document.getElementById("iw_"+l.id);el&&el.focus()},30);break;
    case"irm":captureEdit();S.editItems=S.editItems.filter(x=>x.id!==b.dataset.item);render();break;
    case"day":{const n=addDays(S.date,+b.dataset.n);if(n<=todayStr())S.date=n;render();break}
    case"day-today":S.date=todayStr();render();break;
    case"gm":{const[y,m]=S.gridMonth.split("-").map(Number);const d=new Date(y,m-1+(+b.dataset.n),1);S.gridMonth=fmt(d).slice(0,7);render();break}
    case"range":S.range=b.dataset.r;render();break;
    case"filter":S.filter=id;render();break;
    case"ncolor":S.newName=(document.getElementById("newName")||{}).value||"";S.newTarget=+((document.getElementById("newTarget")||{}).value||7);S.newColor=b.dataset.c;render();break;
    case"ecolor":{S.editColor=b.dataset.c;b.parentNode.querySelectorAll(".sw").forEach(s=>s.setAttribute("aria-pressed",s===b));break}
    case"edit":{const h=S.habits.find(x=>x.id===id);S.editId=id;S.editColor=null;S.delId=null;S.editDraft=null;S.editItems=(h.items||[]).map(i=>({...i}));render();break}
    case"cancel-edit":S.editId=null;S.editDraft=null;S.editItems=null;render();break;
    case"up":case"down":{const act=S.habits.filter(h=>!h.archived);const i=act.findIndex(h=>h.id===id);const j=a==="up"?i-1:i+1;if(j<0||j>=act.length)break;
      const A=S.habits.indexOf(act[i]),B=S.habits.indexOf(act[j]);[S.habits[A],S.habits[B]]=[S.habits[B],S.habits[A]];saveHabits();render();break}
    case"archive":S.habits[idx()].archived=true;saveHabits();render();toast("Hábito archivado");break;
    case"unarchive":S.habits[idx()].archived=false;saveHabits();render();break;
    case"del":S.delId=id;S.editId=null;render();break;
    case"del-no":S.delId=null;render();break;
    case"del-yes":{S.habits.splice(idx(),1);S.delId=null;
      Object.keys(S.months).forEach(k=>{const d=S.months[k].d||{};let ch=false;Object.keys(d).forEach(day=>{const n=d[day].filter(x=>x!==id);if(n.length!==d[day].length){ch=true;if(n.length)d[day]=n;else delete d[day]}});
        const s=S.months[k].s||{};Object.keys(s).forEach(day=>{if(s[day][id]){ch=true;delete s[day][id];if(!Object.keys(s[day]).length)delete s[day]}});if(ch)saveMonth(k)});
      saveHabits();render();toast("Hábito eliminado");break}
  }
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  const k=f.dataset.form;
  if(k==="quick"){const v=document.getElementById("quickName").value;if(addHabit(v)){render();toast("Añadido: "+v.trim())}}
  if(k==="add"){const v=document.getElementById("newName").value;const t=+document.getElementById("newTarget").value;
    if(addHabit(v,S.newColor,t)){S.newName="";S.newColor=null;S.newTarget=7;render();toast("Añadido: "+v.trim())}else toast("Escribe un nombre para el hábito.")}
  if(k==="edit"){const id=f.dataset.id;const h=S.habits.find(x=>x.id===id);captureEdit();const n=document.getElementById("en_"+id).value.trim();if(!n){toast("El nombre no puede quedar vacío.");return}
    h.name=n;h.target=+document.getElementById("et_"+id).value;if(S.editColor)h.color=S.editColor;
    const items=(S.editItems||[]).map(i=>({id:i.id,when:i.when.trim(),name:i.name.trim(),dose:i.dose.trim()})).filter(i=>i.name);
    if(items.length)h.items=items;else delete h.items;
    S.editId=null;S.editColor=null;S.editDraft=null;S.editItems=null;saveHabits();render()}
});

function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function defaultFocus(){const h=new Date().getHours();return h<11?"energia":h<18?"foco":"relax"}
function curFocus(){return C.focus||defaultFocus()}
function logFor(ds){const m=C.log[ym(ds)];return((m&&m.s)||[]).filter(x=>x.date===ds)}

function buildSession(ds,focus,reroll){
  const r=rng(ds+"|"+focus+"|"+reroll);const cfg=C.cfg;
  const yest=addDays(ds,-1);const ry=rng(yest+"|"+focus+"|0");
  const bOpts=Object.keys(BREATHS).filter(k=>BREATHS[k].foci.includes(focus));
  const mOpts=Object.keys(MEDS).filter(k=>MEDS[k].foci.includes(focus));
  // evitar repetir lo de ayer
  const yB=pick(ry,bOpts),yM=pick(ry,mOpts);
  const breath=pick(r,bOpts.length>1?bOpts.filter(x=>x!==yB):bOpts);
  const med=pick(r,mOpts.length>1?mOpts.filter(x=>x!==yM):mOpts);
  // movilidad: ponderado por foco, hasta llenar el tiempo
  const budget=cfg.mobMin*60;const pool=MOBS.map(m=>({m,w:(m.foci.includes(focus)?3:.6)*(.5+r())})).sort((a,b)=>b.w-a.w);
  const chosen=[];let t=0;const areas={};
  for(const {m} of pool){const d=m.dur*(m.sides?2:1)+8;if(t+d>budget+20)continue;if((areas[m.area]||0)>=2)continue;chosen.push(m);t+=d;areas[m.area]=(areas[m.area]||0)+1;if(t>=budget-15)break}
  // orden: de pie/dinámico → suelo → descanso
  const order=["Cuello","Hombros","Pecho y hombros","Espalda alta","Columna","Global","Cadena posterior","Cadera y tobillos","Tobillos","Gemelos","Cuádriceps","Cadera","Glúteo","Aductores","Glúteo y cadera","Isquiotibiales","Muñecas","Espalda"];
  chosen.sort((a,b)=>order.indexOf(a.area)-order.indexOf(b.area));
  return{ds,focus,breath,med,mobs:chosen.map(m=>m.id),phrase:PHRASES[Math.floor(rng(ds)()*PHRASES.length)]};
}
const mobById=id=>MOBS.find(m=>m.id===id);
function sessionSteps(sess,parts){
  parts=parts||C.cfg.parts;const st=[];
  if(parts.mob)sess.mobs.forEach(id=>{const m=mobById(id);if(m)st.push({type:"mob",m,dur:8+m.dur*(m.sides?2:1)})});
  if(parts.breath)st.push({type:"breath",b:sess.breath,dur:C.cfg.breathMin*60});
  if(parts.med)st.push({type:"med",k:sess.med,dur:C.cfg.medMin*60});
  return st;
}

let SILENT=null;function silentWav(){const n=8000,b=new Uint8Array(44+n),v=new DataView(b.buffer);const w=(o,s)=>[...s].forEach((c,i)=>b[o+i]=c.charCodeAt(0));w(0,"RIFF");v.setUint32(4,36+n,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,"data");v.setUint32(40,n,true);b.fill(128,44);let s="";b.forEach(x=>s+=String.fromCharCode(x));return"data:audio/wav;base64,"+btoa(s)}

function medCues(k,dur){
  const M=MEDS[k];const cues=[];const o=M.open,c=M.close;
  o.forEach((x,i)=>cues.push({at:i*12,text:x}));
  const cs=Math.max(o.length*12+20,dur-c.length*14);
  c.forEach((x,i)=>cues.push({at:cs+i*14,text:x}));
  const start=o.length*12+15,end=cs-15;const n=Math.max(1,Math.min(M.body.length,Math.floor((end-start)/30)+1));
  const body=[];for(let i=0;i<n;i++)body.push(M.body[i%M.body.length]);
  body.forEach((x,i)=>cues.push({at:start+(n===1?0:i*(end-start)/(n-1)),text:x}));
  return cues.sort((a,b)=>a.at-b.at);
}

}
