<style>
/* Layout: one-screen quiz app in a phone-width column. Header with progress and score, a countdown bar, and one scrollable screen at a time (category card, question, answer reveal, final). Single deliberate night look from the Wrapped: night sky, Cortadura sunset, her pink. */
:root{
  --noche:#191339; --noche-2:#241D4D; --rosa:#FF8FC7; --atardecer:#FF6A3D; --marea:#0E5E6F; --arena:#F6E7C8;
  --tinta:#16112E; --blanco:#FFF8F0; --muted:#B9B3D9; --ok:#3DDC97; --ko:#FF5C6C;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0d0a20;color:var(--blanco);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--noche);overflow:hidden}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .where{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .score{flex:none;font-family:var(--display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;background:var(--noche-2);border-radius:999px;padding:6px 12px}
.top[hidden]{display:none!important}
.prog{flex:none;height:4px;margin:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--rosa);width:0;transition:width .3s}
.timer{flex:none;height:6px;margin:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;visibility:hidden}
.timer.on{visibility:visible}
.timer i{display:block;height:100%;width:100%;background:var(--atardecer);transform-origin:left;border-radius:3px}
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:18px;
  padding-top:18px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen > *{min-width:0}
.ts{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ts b{color:var(--blanco);font-weight:600}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-weight:900;font-size:clamp(34px,10vw,48px);line-height:1}
h2{font-weight:800;font-size:clamp(22px,6.4vw,28px);line-height:1.15}
p{margin:0;line-height:1.45;font-size:16px}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border:0;border-radius:16px;padding:14px 20px;font-weight:800;font-size:17px;cursor:pointer;background:var(--rosa);color:var(--tinta);width:100%}
.btn.ghost{background:transparent;color:var(--blanco);border:2px solid rgba(255,255,255,.22)}
.btn:focus-visible,.tile:focus-visible,.switch:focus-visible{outline:3px solid var(--blanco);outline-offset:3px}
.btn:active,.tile:active{transform:scale(.98)}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
/* start */
.hero{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(var(--noche-2),var(--noche-2));min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px}
.hero .sun{position:absolute;right:10%;bottom:52px;width:120px;height:120px;border-radius:50%;background:var(--atardecer)}
.hero .sea{position:absolute;left:0;right:0;bottom:0;height:70px;background:var(--marea)}
.hero .z{position:relative}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--noche-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.facts b{font-family:var(--display);font-size:20px;font-weight:800}
.facts span{font-size:12px;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--noche-2);border:0;border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.switch .knob{flex:none;width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,.2);position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--blanco);transition:transform .2s}
.switch[aria-checked="true"] .knob{background:var(--atardecer)}
.switch[aria-checked="true"] .knob::after{transform:translateX(18px)}
/* category */
.cat{flex:1;border-radius:28px;padding:26px 22px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:380px}
.cat .num{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.08em}
.cat h1{font-size:clamp(38px,12vw,58px)}
.cat .bg-shape{width:96px;height:96px}
.c-rosa{background:var(--rosa);color:var(--tinta)}
.c-atardecer{background:var(--atardecer);color:var(--tinta)}
.c-marea{background:var(--marea);color:var(--blanco)}
.c-arena{background:var(--arena);color:var(--tinta)}
.c-noche{background:var(--noche-2);color:var(--blanco);box-shadow:inset 0 0 0 2px rgba(255,143,199,.5)}
/* question */
.qcard{background:var(--blanco);color:var(--tinta);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:8px}
.qcard .qn{font-family:var(--mono);font-size:12px;font-weight:600;color:#6A6158}
.qcard h2{font-family:var(--body);font-weight:800;font-size:clamp(20px,5.8vw,24px);line-height:1.25;letter-spacing:-.01em}
.qcard.quote h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,6.6vw,28px)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;border:0;border-radius:18px;padding:14px 14px 16px;min-height:96px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;text-align:left;cursor:pointer;font-weight:800;font-size:17px;line-height:1.2;transition:opacity .25s,transform .1s}
.tile svg{width:26px;height:26px;flex:none}
.tile .tx{overflow-wrap:anywhere}
.tile.big{min-height:150px;font-family:var(--display);font-size:22px}
.tile.big svg{width:40px;height:40px}
.tile.emoji .tx{font-size:40px;line-height:1}
.t0{background:var(--rosa);color:var(--tinta)}
.t1{background:var(--atardecer);color:var(--tinta)}
.t2{background:var(--marea);color:var(--blanco)}
.t3{background:var(--arena);color:var(--tinta)}
.tiles.done .tile{cursor:default}
.tiles.done .tile.dim{opacity:.28}
.tile .mark{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--tinta);color:var(--blanco);font-size:16px;font-weight:800}
.tile.right{box-shadow:0 0 0 4px var(--ok)}
.tile.wrong{box-shadow:0 0 0 4px var(--ko)}
/* reveal */
.verdict{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:18px;padding:14px 16px}
.verdict.good{background:var(--ok);color:var(--tinta)}
.verdict.bad{background:var(--ko);color:var(--tinta)}
.verdict .w{font-family:var(--display);font-weight:900;font-size:24px}
.verdict .pts{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.verdict .pts small{display:block;font-family:var(--body);font-weight:700;font-size:12px}
.info{background:var(--noche-2);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.info .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--rosa)}
.info .bigN{font-family:var(--display);font-weight:900;font-size:clamp(40px,13vw,60px);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.info p{font-size:16px}
.info .foot{font-size:14px;color:var(--muted)}
.bubble{align-self:flex-start;max-width:92%;background:#1F5F4F;color:var(--blanco);border-radius:4px 16px 16px 16px;padding:10px 12px 8px;display:flex;flex-direction:column;gap:4px}
.bubble.me{align-self:flex-end;background:#3B2F7A;border-radius:16px 4px 16px 16px}
.bubble .who{font-size:12px;font-weight:800;color:var(--rosa)}
.bubble .t{font-size:16px;line-height:1.35}
.bubble .when{font-family:var(--mono);font-size:10px;color:var(--muted);align-self:flex-end}
.duel{display:flex;flex-direction:column;gap:10px}
.duel .row{display:grid;grid-template-columns:70px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:14px}
.duel .row b{font-variant-numeric:tabular-nums;font-size:15px}
.duel .track{height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.duel .track i{display:block;height:100%;border-radius:7px}
.duel .p i{background:#2FA7BF}
.duel .a i{background:var(--rosa)}
.rank{display:flex;flex-direction:column;gap:8px}
.rank .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:15px}
.rank .row b{font-variant-numeric:tabular-nums}
.rank .row .track{grid-column:1 / -1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.rank .row .track i{display:block;height:100%;background:var(--atardecer);border-radius:3px}
.rank .row.first .track i{background:var(--rosa)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--blanco);color:var(--tinta);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.longword{font-family:var(--display);font-weight:900;font-size:18px;line-height:1.15;word-break:break-all;color:var(--arena)}
.chart{display:flex;flex-direction:column;gap:6px}
.chart .bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid rgba(255,255,255,.25)}
.chart .bars i{flex:1;min-width:0;border-radius:3px 3px 0 0;background:rgba(255,143,199,.35)}
.chart .bars i.hi{background:var(--rosa)}
.chart .axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted)}
.next{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(transparent,var(--noche) 30%)}
/* end */
.final{border-radius:28px;padding:24px 20px;background:var(--rosa);color:var(--tinta);display:flex;flex-direction:column;gap:12px}
.final .rk{font-family:var(--display);font-weight:900;font-size:clamp(30px,9vw,42px);line-height:1}
.final .sc{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.letter{background:var(--noche-2);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.letter p{font-size:17px}
.letter .sign{font-family:var(--display);font-weight:800;color:var(--rosa)}
.recap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.recap div{background:var(--noche-2);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.recap b{font-variant-numeric:tabular-nums}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.prog i,.switch .knob,.switch .knob::after{transition:none}}
</style>
</head>

var GOOD=["¡Biennn!","¡Oleee!","¡Olé tú!","¡Pitonisa!","¡Valee, sí!"];
var BAD=["Lloro","Jooo","Casi casi","☹️"];
var LIMIT=20;
var STEPS=[];
CATS.forEach(function(c,ci){STEPS.push({t:"cat",ci:ci});c.qs.forEach(function(q,qi){STEPS.push({t:"q",ci:ci,qi:qi})})});
var TOTALQ=STEPS.filter(function(s){return s.t==="q"}).length;
var KEY="trivial-nosotros-v1";
var S=fresh();
function fresh(){return {i:-1,score:0,correct:0,streak:0,best:0,timer:true,ans:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&typeof v.i==="number")return v}catch(e){}return null}

var $screen=document.getElementById("screen"),$top=document.getElementById("top"),$where=document.getElementById("where"),$score=document.getElementById("score"),$prog=document.getElementById("prog"),$timer=document.getElementById("timer");
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var raf=null,deadline=0,phase="idle",cur=null;
function stopTimer(){if(raf)cancelAnimationFrame(raf);raf=null;$timer.classList.remove("on")}
function qIndex(i){var n=0;for(var k=0;k<=i;k++)if(STEPS[k].t==="q")n++;return n}

function chrome(show){
  $top.hidden=!show;$prog.hidden=!show;
  if(show){
    var s=STEPS[S.i];var c=CATS[s.ci];
    $where.textContent=c.name+(s.t==="q"?" · "+qIndex(S.i)+"/"+TOTALQ:"");
    $score.textContent=fmt(S.score)+" pts";
    $prog.firstElementChild.style.width=(qIndex(S.i)/TOTALQ*100)+"%";
  }
}
function scrollTop(){$screen.scrollTop=0}

function renderStart(){
  stopTimer();chrome(false);phase="idle";
  var saved=load();var resume=saved&&saved.i>=0&&saved.i<STEPS.length;
  $screen.innerHTML=
   '<div class="ts">[1/12/26] <b>ale &lt;3</b> &amp; <b>parrado</b></div>'+
   '<div class="hero"><div class="sun"></div><div class="sea"></div><div class="z stack"><h1>¿Cuánto sabes de nosotros?</h1></div></div>'+
   '<p>El trivial de vuestro chat de WhatsApp: 229.507 mensajes, del 7 de enero de 2025 al 17 de noviembre de 2026. Después de cada respuesta verás el dato completo.</p>'+
   '<div class="facts"><div><b>'+CATS.length+'</b><span>categorías</span></div><div><b>'+TOTALQ+'</b><span>preguntas</span></div><div><b>~25</b><span>minutos</span></div></div>'+
   '<button class="switch" id="tsw" role="switch" aria-checked="'+(S.timer?"true":"false")+'" type="button"><span><b>Cuenta atrás de '+LIMIT+' s</b><br><span class="muted" style="font-size:14px">Cuanto antes contestes, más puntos</span></span><span class="knob" aria-hidden="true"></span></button>'+
   '<div class="grow"></div>'+
   '<div class="stack">'+(resume?'<button class="btn" id="cont" type="button">Seguir por la pregunta '+Math.max(1,qIndex(saved.i))+'</button><button class="btn ghost" id="go" type="button">Empezar de cero</button>':'<button class="btn" id="go" type="button">Jugar</button>')+'</div>';
  document.getElementById("tsw").onclick=function(){S.timer=!S.timer;this.setAttribute("aria-checked",S.timer?"true":"false")};
  document.getElementById("go").onclick=function(){var t=S.timer;S=fresh();S.timer=t;S.i=0;save();go()};
  if(resume)document.getElementById("cont").onclick=function(){var t=S.timer;S=saved;S.timer=t;go()};
  scrollTop();
}

function go(){
  if(S.i>=STEPS.length){renderEnd();return}
  var s=STEPS[S.i];
  if(s.t==="cat")renderCat(s);else{
    var key=s.ci+"-"+s.qi;
    if(S.ans[key])renderQ(s,true);else renderQ(s,false);
  }
}
function next(){S.i++;save();go()}

function renderCat(s){
  stopTimer();chrome(true);phase="cat";
  var c=CATS[s.ci];
  $screen.innerHTML='<section class="cat c-'+c.color+' pop">'+
   '<div class="num">CATEGORÍA '+(s.ci+1)+' DE '+CATS.length+'</div>'+
   '<div class="stack" style="gap:12px"><h1>'+esc(c.name)+'</h1><p style="font-size:18px;font-weight:600">'+esc(c.sub)+'</p></div>'+
   '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px"><span style="font-weight:700">'+c.qs.length+' preguntas</span><span class="bg-shape">'+SHAPES[s.ci%4].replace('<svg','<svg width="96" height="96"')+'</span></div>'+
   '</section><button class="btn" id="nx" type="button">Vamos</button>';
  document.getElementById("nx").onclick=next;
  scrollTop();
}

function optionsOf(q){
  if(q.t==="who")return [{k:"A",label:"ale <3",cls:"t0",shape:0},{k:"P",label:"parrado",cls:"t2",shape:1}];
  return q.o.map(function(o,i){return {k:i,label:o,cls:"t"+i,shape:i}});
}
function isRight(q,k){return q.t==="who"?k===q.a:k===q.a}

function renderQ(s,answered){
  var c=CATS[s.ci],q=c.qs[s.qi],key=s.ci+"-"+s.qi;
  chrome(true);
  var opts=optionsOf(q);
  var html='<div class="qcard'+(q.quote?' quote':'')+' pop"><div class="qn">PREGUNTA '+qIndex(S.i)+' DE '+TOTALQ+(q.t==="who"?' · ¿TÚ O PABLO?':'')+'</div><h2>'+esc(q.q)+'</h2></div>';
  html+='<div class="tiles" id="tiles">'+opts.map(function(o){
    return '<button class="tile '+o.cls+(q.t==="who"?' big':'')+(q.emoji?' emoji':'')+'" type="button" data-k="'+o.k+'">'+SHAPES[o.shape]+'<span class="tx">'+esc(o.label)+'</span></button>';
  }).join("")+'</div><div id="reveal" class="stack" style="gap:14px"></div>';
  $screen.innerHTML=html;scrollTop();
  var tiles=[].slice.call(document.querySelectorAll(".tile"));
  if(answered){showReveal(s,S.ans[key],false);return}
  phase="ask";
  tiles.forEach(function(b){b.onclick=function(){var k=b.getAttribute("data-k");answer(s,q.t==="who"?k:+k)}});
  if(S.timer){
    $timer.classList.add("on");var bar=$timer.firstElementChild;deadline=performance.now()+LIMIT*1000;
    (function tick(){var left=deadline-performance.now();var f=Math.max(0,left/(LIMIT*1000));bar.style.transform="scaleX("+f+")";bar.style.background=f<.25?"var(--ko)":"var(--atardecer)";
      if(left<=0){answer(s,null);return}raf=requestAnimationFrame(tick)})();
  }else stopTimer();
}

function answer(s,k){
  if(phase!=="ask")return;phase="reveal";
  var left=S.timer?Math.max(0,deadline-performance.now()):LIMIT*1000;stopTimer();
  var q=CATS[s.ci].qs[s.qi],ok=k!==null&&isRight(q,k);
  var pts=ok?(S.timer?Math.round(500+500*left/(LIMIT*1000)):1000):0;
  if(ok){S.correct++;S.streak++;S.best=Math.max(S.best,S.streak)}else S.streak=0;
  S.score+=pts;
  var rec={k:k,ok:ok,pts:pts,streak:S.streak,w:ok?GOOD[Math.floor(Math.random()*GOOD.length)]:(k===null?"Se acabó el tiempo":BAD[Math.floor(Math.random()*BAD.length)])};
  S.ans[s.ci+"-"+s.qi]=rec;save();
  showReveal(s,rec,true);
}

function infoHTML(i){
  var h='<div class="info pop"><div class="lbl">El dato</div>';
  if(i.big)h+='<div class="bigN">'+esc(i.big)+'</div>';
  if(i.text)h+='<p>'+esc(i.text)+'</p>';
  if(i.word)h+='<div class="longword">'+esc(i.word)+'</div>';
  if(i.quote)h+='<div class="bubble'+(i.quote.who==="parrado"?" me":"")+'"><span class="who">'+esc(i.quote.who)+'</span><span class="t">'+esc(i.quote.text)+'</span><span class="when">'+esc(i.quote.when)+'</span></div>';
  if(i.duel){var mx=Math.max(i.duel[0],i.duel[1])||1;
    h+='<div class="duel">'+(i.duelLbl?'<div class="muted" style="font-size:13px">'+esc(i.duelLbl)+'</div>':'')+
     '<div class="row p"><span>parrado</span><span class="track"><i style="width:'+(i.duel[0]/mx*100)+'%"></i></span><b>'+fmt(i.duel[0])+'</b></div>'+
     '<div class="row a"><span>ale &lt;3</span><span class="track"><i style="width:'+(i.duel[1]/mx*100)+'%"></i></span><b>'+fmt(i.duel[1])+'</b></div></div>'}
  if(i.rank){var m2=Math.max.apply(null,i.rank.map(function(r){return r[1]}))||1;
    h+='<div class="rank">'+i.rank.map(function(r,ix){return '<div class="row'+(ix===0?' first':'')+'"><span>'+esc(r[0])+'</span><b>'+fmt(r[1])+'</b><span class="track"><i style="width:'+(r[1]/m2*100)+'%"></i></span></div>'}).join("")+'</div>'}
  if(i.chips)h+='<div class="chips">'+i.chips.map(function(c){return '<span>'+esc(c)+'</span>'}).join("")+'</div>';
  if(i.chart)h+=chartHTML(i.chart);
  if(i.foot)h+='<p class="foot">'+esc(i.foot)+'</p>';
  return h+'</div>';
}
function chartHTML(kind){
  var d,hi,ax;
  if(kind==="hours"){d=HOURS;hi=22;ax=["0h","6h","12h","18h","23h"]}
  else if(kind==="week"){d=WEEK;hi=5;ax=["lun","mar","mié","jue","vie","sáb","dom"]}
  else{d=MONTHS;hi=11;ax=["ene 25","jul 25","ene 26","jul 26","nov 26"]}
  var mx=Math.max.apply(null,d);
  return '<div class="chart" role="img" aria-label="Gráfico de mensajes"><div class="bars">'+d.map(function(v,ix){return '<i class="'+(ix===hi?'hi':'')+'" style="height:'+(v/mx*100)+'%"></i>'}).join("")+'</div><div class="axis">'+ax.map(function(a){return '<span>'+a+'</span>'}).join("")+'</div></div>';
}

function showReveal(s,rec,fresh){
  phase="reveal";stopTimer();
  var q=CATS[s.ci].qs[s.qi];
  var tiles=document.getElementById("tiles");tiles.classList.add("done");
  [].slice.call(tiles.children).forEach(function(b){
    var k=b.getAttribute("data-k");k=q.t==="who"?k:+k;b.disabled=true;
    if(isRight(q,k)){b.classList.add("right");b.insertAdjacentHTML("beforeend",'<span class="mark" aria-label="Correcta">✓</span>')}
    else if(rec.k!==null&&k===rec.k){b.classList.add("wrong");b.insertAdjacentHTML("beforeend",'<span class="mark" aria-label="Tu respuesta">✕</span>')}
    else b.classList.add("dim");
  });
  var v='<div class="verdict '+(rec.ok?'good':'bad')+' pop"><span class="w">'+esc(rec.w)+'</span><span class="pts">+'+fmt(rec.pts)+(rec.ok&&rec.streak>1?'<small>Racha de '+rec.streak+'</small>':'')+'</span></div>';
  var last=S.i===STEPS.length-1;
  document.getElementById("reveal").innerHTML=v+infoHTML(q.info)+'<div class="next"><button class="btn" id="nx" type="button">'+(last?'Ver resultado':'Siguiente')+'</button></div>';
  chrome(true);
  document.getElementById("nx").onclick=next;
  if(fresh){setTimeout(function(){var r=document.getElementById("reveal");if(r)r.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})},350)}
}

function rankOf(p){
  if(p>=.9)return ["Pitonisa oficial","Lo sabes todo de nosotros. «soy pitonisa», dijiste. Confirmado."];
  if(p>=.7)return ["La mejor seño del mundo","Y la que más sabe de este chat."];
  if(p>=.5)return ["¡Biennn!","Aprobado con nota. El resto lo repasamos juntos."];
  return ["Lloro","Pero te amo igual. Y tenemos muchos mensajes más para que lo mejores."];
}
function renderEnd(){
  stopTimer();phase="end";$top.hidden=false;$prog.hidden=false;
  $where.textContent="Resultado";$score.textContent=fmt(S.score)+" pts";$prog.firstElementChild.style.width="100%";
  var p=S.correct/TOTALQ,r=rankOf(p);
  var catRows=CATS.map(function(c,ci){var ok=0;c.qs.forEach(function(q,qi){var a=S.ans[ci+"-"+qi];if(a&&a.ok)ok++});return '<div><span>'+esc(c.name)+'</span><b>'+ok+'/'+c.qs.length+'</b></div>'}).join("");
  $screen.innerHTML='<section class="final pop"><div class="ts" style="color:var(--tinta)">TU RANGO</div><div class="rk">'+esc(r[0])+'</div><p>'+esc(r[1])+'</p><div class="sc">'+S.correct+' de '+TOTALQ+' · '+fmt(S.score)+' puntos</div>'+(S.best>1?'<div style="font-weight:700">Mejor racha: '+S.best+' seguidas</div>':'')+'</section>'+
   '<div class="recap">'+catRows+'</div>'+
   '<div class="letter"><div class="bubble"><span class="who">ale &lt;3</span><span class="t">me encantan esos detallitos que tienes, y sé que jamás vas a dejar de tenerlos</span><span class="when">8/10/25, 23:00</span></div>'+
   '<p>229.507 mensajes, 8.461 «te amo» y 680 días. Y esto es solo lo que cabe en un chat.</p><p>Feliz 1 de diciembre, mi niña. Quedan 23 días de calendario.</p><div class="sign">Pablo</div></div>'+
   '<button class="btn ghost" id="again" type="button">Volver a jugar</button>';
  document.getElementById("again").onclick=function(){var t=S.timer;S=fresh();S.timer=t;save();renderStart()};
  scrollTop();
}

document.addEventListener("keydown",function(e){
  if(phase==="ask"&&/^[1-4]$/.test(e.key)){var t=document.querySelectorAll(".tile")[+e.key-1];if(t)t.click()}
  else if((phase==="reveal"||phase==="cat")&&e.key==="Enter"){var n=document.getElementById("nx");if(n&&document.activeElement!==n){e.preventDefault();n.click()}}
});
document.addEventListener("visibilitychange",function(){if(document.hidden&&phase==="ask"&&S.timer){deadline+=0}});

var saved=load();if(saved){S.timer=saved.timer!==false}
renderStart();
})();
</script>
