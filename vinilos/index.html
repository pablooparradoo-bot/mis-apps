<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Discoteca</title>
<meta name="description" content="Tu colección de vinilos: portadas, canciones, precios, wishlist y PDF para regalar">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Discoteca">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161A2D" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
/* Versión GitHub Pages: fuera de Claude no hay base de datos de la cuenta. Este adaptador imita las piezas que usa la app:
   - db: colección y wishlist en localStorage de este dispositivo
   - assets: portadas en IndexedDB de este dispositivo
   - downloads: compartir/guardar archivos (copia, PDF, CSV)
   - sample: solo si el usuario guarda su clave de la API de Anthropic (Autocompletar e Identificar por la foto) */
(function(){
  if(window.claude)return;window.__ghApp=true;
  const clone=o=>JSON.parse(JSON.stringify(o));
  const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  /* ---------- db ---------- */
  const LS="discoteca.db";
  let store;try{store=JSON.parse(localStorage.getItem(LS)||"null")}catch(e){}if(!store||typeof store!=="object")store={};
  const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){throw{code:"quota_exceeded",message:"Sin espacio en el dispositivo"}}};
  const colL={},docL={};
  const meta={fromCache:false,hasPendingWrites:false};
  const snapDoc=(col,id)=>{const d=(store[col]||{})[id];return{id,exists:!!d,data:()=>d?clone(d):undefined,metadata:meta}};
  const snapCol=col=>{const docs=Object.keys(store[col]||{}).sort().map(id=>snapDoc(col,id));return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:meta}};
  const emit=(col,id)=>setTimeout(()=>{(colL[col]||[]).slice().forEach(f=>{try{f(snapCol(col))}catch(e){}});(docL[col+"/"+id]||[]).slice().forEach(f=>{try{f(snapDoc(col,id))}catch(e){}})},0);
  const docRef=(col,id)=>({id,path:col+"/"+id,
    async get(){return snapDoc(col,id)},
    async set(d){const prev=store[col]&&store[col][id];(store[col]=store[col]||{})[id]=clone(d);try{persist()}catch(e){if(prev)store[col][id]=prev;else delete store[col][id];throw e}emit(col,id)},
    async update(d){const c=(store[col]||{})[id];if(!c)throw{code:"invalid_argument",message:"No existe"};store[col][id]={...c,...clone(d)};try{persist()}catch(e){store[col][id]=c;throw e}emit(col,id)},
    async delete(){if(store[col]&&store[col][id]){delete store[col][id];persist()}emit(col,id)},
    onSnapshot(next){const k=col+"/"+id;(docL[k]=docL[k]||[]).push(next);setTimeout(()=>next(snapDoc(col,id)),0);return()=>{docL[k]=(docL[k]||[]).filter(f=>f!==next)}}});
  const colRef=col=>({path:col,doc:id=>docRef(col,id||rid()),
    async add(d){const r=docRef(col,rid());await r.set(d);return r},
    onSnapshot(next){(colL[col]=colL[col]||[]).push(next);setTimeout(()=>next(snapCol(col)),0);return()=>{colL[col]=(colL[col]||[]).filter(f=>f!==next)}}});
  const db={doc:p=>{const s=p.split("/");return docRef(s.slice(0,-1).join("/"),s[s.length-1])},collection:colRef};

  /* ---------- portadas (IndexedDB) ---------- */
  const urls=new Map();let idbP=null;
  const idb=()=>idbP||(idbP=new Promise((res,rej)=>{const r=indexedDB.open("discoteca",1);r.onupgradeneeded=()=>r.result.createObjectStore("covers");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const run=async(mode,fn)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("covers",mode);fn(t.objectStore("covers"));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
  window.__ghCoverUrl=id=>urls.get(id)||"";
  window.__ghCoversReady=(async()=>{try{const d=await idb();await new Promise(res=>{const req=d.transaction("covers","readonly").objectStore("covers").openCursor();req.onsuccess=()=>{const c=req.result;if(c){try{urls.set(String(c.key),URL.createObjectURL(c.value))}catch(e){}c.continue()}else res()};req.onerror=()=>res()})}catch(e){}})();
  const assets={
    async upload(blob,opts){const b=opts&&opts.type&&blob.type!==opts.type?new Blob([blob],{type:opts.type}):blob;const id=rid();
      try{await run("readwrite",st=>st.put(b,id))}catch(e){throw{code:"quota_or_state",message:"Sin espacio"}}
      urls.set(id,URL.createObjectURL(b));return{id,url:urls.get(id),sizeBytes:b.size,contentType:b.type}},
    async delete(id){try{await run("readwrite",st=>st.delete(id))}catch(e){}const u=urls.get(id);if(u){URL.revokeObjectURL(u);urls.delete(id)}return{deleted:true}},
    async list(){return{assets:[],usage:{files:urls.size,bytes:0,maxFiles:0,maxBytes:0}}}};

  /* ---------- descargas ---------- */
  const MIME={json:"application/json",csv:"text/csv",pdf:"application/pdf"};
  const downloads={async save({filename,data}){
    const ext=(String(filename).split(".").pop()||"").toLowerCase();
    const blob=data instanceof Blob?new Blob([data],{type:MIME[ext]||data.type||"application/octet-stream"}):new Blob([data],{type:MIME[ext]||"application/octet-stream"});
    let file=null;try{file=new File([blob],filename,{type:blob.type})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return{status:"saved"}}
      catch(e){if(e&&e.name==="AbortError")throw{code:"declined",message:"Cancelado"}}
    }
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);return{status:"saved"}}};

  /* ---------- Claude con clave propia (opcional) ---------- */
  const key=()=>{try{return localStorage.getItem("discoteca.apikey")||""}catch(e){return""}};
  const MODEL="claude-sonnet-5-5";
  async function toB64(blob){
    let b=blob;
    try{const bmp=await createImageBitmap(blob);const sc=Math.min(1,1568/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85))||blob}catch(e){}
    const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});
    const m=/^data:([^;]+);base64,(.*)$/.exec(url);return{media_type:m[1],data:m[2]};
  }
  async function call(input,opts){
    opts=opts||{};const k=key();if(!k)throw{code:"not_granted",message:"Sin clave"};
    const imgs=[];if(opts.images){const list=opts.images instanceof Blob?[opts.images]:Array.from(opts.images);for(const im of list.slice(0,3)){const x=await toB64(im);imgs.push({type:"image",source:{type:"base64",media_type:x.media_type,data:x.data}})}}
    const turns=typeof input==="string"?[{role:"user",content:input}]:input;
    const messages=turns.map((m,i)=>({role:m.role,content:i===turns.length-1&&imgs.length?[...imgs,{type:"text",text:m.content}]:m.content}));
    let res;
    try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opts.signal,headers:{"content-type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL,max_tokens:4000,messages})})}
    catch(e){throw{code:e&&e.name==="AbortError"?"cancelled":"upstream_error",message:String(e)}}
    if(!res.ok){const c=res.status===429||res.status===529?"rate_limited":res.status===401||res.status===403?"not_granted":"upstream_error";throw{code:c,message:"HTTP "+res.status}}
    const j=await res.json();const text=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim();
    if(!text)throw{code:"empty_completion",message:"Sin texto"};
    if(opts.onText)try{opts.onText({text,delta:text})}catch(e){}
    return{text,truncated:j.stop_reason==="max_tokens",modelTierApplied:"default"};
  }
  const sample=(i,o)=>call(i,o);
  sample.json=async(i,o)=>{const r=await call(typeof i==="string"?i+"\n\nResponde únicamente con el JSON, sin texto alrededor.":i,o);const t=r.text;
    const tries=[t,(/```(?:json)?\s*([\s\S]*?)```/.exec(t)||[])[1],(()=>{const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));return a>=0&&b>a?t.slice(a,b+1):null})()];
    for(const x of tries){if(!x)continue;try{return JSON.parse(x)}catch(e){}}throw{code:"invalid_json",message:"Respuesta sin JSON",text:t}};
  sample.limits=async()=>({maxPromptBytes:65536,images:{maxCount:3,maxInputBytes:20e6,mediaTypes:["image/png","image/jpeg","image/webp","image/gif"]}});

  window.claude={use:async n=>n==="db"?db:n==="assets"?assets:n==="downloads"?downloads:n==="sample"&&key()?sample:null};
})();
</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: tienda de discos — cabecera fija, separadores de cajón A–Z, rejilla de fundas con el disco asomando */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#14162B; --muted:#5D6179; --line:#D5D8E3;
  --accent:#2F45DB; --accent-ink:#FFFFFF; --sticker:#FFCF33; --sticker-ink:#14162B;
  --good:#18865A; --bad:#C3362C; --gift:#FF7AA2; --gift-ink:#14162B; --vinyl:#121214; --vinyl-groove:#232327; --shadow:0 1px 2px rgba(20,22,43,.08),0 8px 24px rgba(20,22,43,.10);
  --scrim:rgba(14,16,32,.55);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F1D; --surface:#161A2D; --surface-2:#1C2036; --ink:#ECEEF7; --muted:#9CA2BF; --line:#2A2F4A;
  --accent:#8291FF; --accent-ink:#0D0F1D; --sticker:#FFD84D; --sticker-ink:#14162B;
  --good:#4CC38A; --bad:#FF6F62; --gift:#FF8FB1; --gift-ink:#14162B; --vinyl:#050507; --vinyl-groove:#1A1A20; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.65); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F1D; --surface:#161A2D; --surface-2:#1C2036; --ink:#ECEEF7; --muted:#9CA2BF; --line:#2A2F4A;
  --accent:#8291FF; --accent-ink:#0D0F1D; --sticker:#FFD84D; --sticker-ink:#14162B;
  --good:#4CC38A; --bad:#FF6F62; --gift:#FF8FB1; --gift-ink:#14162B; --vinyl:#050507; --vinyl-groove:#1A1A20; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-disc{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--surface) 0 7%,var(--sticker) 8% 30%,var(--vinyl) 31% 33%,var(--vinyl-groove) 34% 36%,var(--vinyl) 37% 100%)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:28px;line-height:.95;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.brand h1 small{display:block;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.tab{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab .count{font-family:var(--f-mono);font-size:11.5px;opacity:.75}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sticker{background:var(--sticker);border-color:var(--sticker);color:var(--sticker-ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}

main{padding-block:24px 64px;overflow-x:clip}
.view{display:grid;gap:22px}

/* Stats strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.strip .cell{background:var(--surface);padding:14px 18px;display:grid;gap:2px;min-width:0}
.strip .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.strip .val{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05}
.strip .sub{font-size:12.5px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}

/* Crate dividers */
.crate{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.divider{flex:none;min-width:34px;height:42px;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:20px;cursor:pointer;color:var(--ink);position:relative;padding:0 8px}
.divider::after{content:"";position:absolute;left:-1px;right:-1px;bottom:0;height:3px;background:var(--line)}
.divider[disabled]{color:var(--line);cursor:default}
.divider.on{background:var(--ink);color:var(--surface);transform:translateY(-4px)}
.divider.on::after{background:var(--ink)}
.divider.all{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-width:0}
.search input{border:0;background:none;outline:none;padding:9px 0;width:100%;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
select.sel,.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
select.sel{padding-right:30px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 10px;cursor:pointer;color:var(--muted);display:flex}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg svg{width:16px;height:16px}
.result-line{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Record grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));column-gap:34px;row-gap:30px}
.rec{display:grid;gap:10px;cursor:pointer;background:none;border:0;padding:0;text-align:left;min-width:0}
.sleeve{position:relative;aspect-ratio:1;max-width:100%}
.disc{position:absolute;inset:3%;border-radius:50%;z-index:0;box-shadow:0 2px 6px rgba(0,0,0,.35);
  background:radial-gradient(circle,var(--bg) 0 2%,var(--lbl,#d33) 2.3% 17%,var(--vinyl) 17.5% 18.5%,transparent 19%),
             repeating-radial-gradient(circle,var(--vinyl) 0 2px,var(--vinyl-groove) 2px 3px);
  transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.sleeve img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;border-radius:3px;box-shadow:var(--shadow);background:var(--surface-2);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.rec:hover .disc,.rec:focus-visible .disc{transform:translateX(17%) rotate(40deg)}
.rec:hover .sleeve img,.rec:focus-visible .sleeve img{transform:translateX(-3%)}
.price-sticker{position:absolute;z-index:2;top:-8px;right:-8px;width:52px;height:52px;border-radius:50%;background:var(--sticker);color:var(--sticker-ink);display:grid;place-items:center;transform:rotate(-10deg);font-family:var(--f-mono);font-weight:600;font-size:12px;line-height:1;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.price-sticker.gift{background:var(--gift);color:var(--gift-ink);font-size:10px;letter-spacing:.04em}
.fav-mark{position:absolute;z-index:2;left:8px;bottom:8px;background:var(--ink);color:var(--sticker);border-radius:999px;width:26px;height:26px;display:grid;place-items:center}
.fav-mark svg{width:14px;height:14px}
.rec-meta{display:grid;gap:1px;min-width:0}
.rec-title{font-weight:700;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rec-artist{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-artist .yr{font-family:var(--f-mono);font-size:12px}

/* List view */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.list{width:100%;border-collapse:collapse;min-width:720px}
table.list th{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover{background:var(--surface-2)}
table.list .thumb{width:44px;height:44px;border-radius:3px;object-fit:cover;display:block}
table.list td.r,table.list th.r{text-align:right}

/* Empty */
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:40px 24px;display:grid;justify-items:center;text-align:center;gap:10px;background:var(--surface)}
.empty h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:34px;text-transform:uppercase;line-height:1}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.empty .big-disc{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 4%,var(--sticker) 4.5% 30%,var(--vinyl) 31% 100%);box-shadow:var(--shadow);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:12px;align-content:start;min-width:0}

/* ---------- modal & toast ---------- */
let modalCleanup = null;
function openModal(html, { narrow = false, onClose } = {}) {
  closeModal();
  const root = $("#modalRoot");
  root.innerHTML = `<div class="overlay" data-overlay><div class="modal ${narrow ? "narrow" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov = root.firstElementChild;
  ov.addEventListener("mousedown", (e) => { if (e.target === ov) closeModal(); });
  const onKey = (e) => { if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", onKey);
  document.body.style.overflow = "hidden";
  modalCleanup = () => { document.removeEventListener("keydown", onKey); onClose && onClose(); };
  ov.querySelectorAll("form").forEach(fm => fm.addEventListener("submit", (e) => e.preventDefault()));
  const f = ov.querySelector("[autofocus]") || ov.querySelector(".x"); f && f.focus();
  return ov;
}
function closeModal() { if (modalCleanup) { const c = modalCleanup; modalCleanup = null; c(); } $("#modalRoot").innerHTML = ""; document.body.style.overflow = ""; }
let toastT;
function toast(msg) { const r = $("#toastRoot"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => r.innerHTML = "", 3200); }
function confirmBox(title, text, okLabel, onOk) {
  const ov = openModal(`<div class="modal-head"><h2>${esc(title)}</h2><button class="x" data-close aria-label="Cerrar">${ICON.x}</button></div><div class="modal-body"><p style="margin:0">${esc(text)}</p></div><div class="modal-foot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="okBtn" style="background:var(--bad);border-color:var(--bad);color:#fff">${esc(okLabel)}</button></div>`, { narrow: true });
  ov.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeModal(); });
  $("#okBtn", ov).addEventListener("click", async (e) => { e.target.disabled = true; try { await onOk(); closeModal(); } catch (err) { e.target.disabled = false; toast(dbMsg(err)); } });
}
function dbMsg(e) {
  const c = e && e.code;
  if (c === "quota_exceeded") return "No queda espacio en la colección. Borra algún registro para seguir.";
  if (c === "invalid_argument") return "No tienes permiso para guardar cambios aquí.";
  if (c === "too_large") return "La imagen es demasiado grande. Prueba con otra.";
  if (c === "quota_or_state") return "No queda espacio para más portadas.";
  if (c === "unsupported_type") return "Ese formato de imagen no vale. Usa JPG o PNG.";
  return "No se pudo guardar. Inténtalo de nuevo en un momento.";
}

/* ---------- image intake ---------- */
async function toJpeg(file, max = 1000) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    const cx = c.getContext("2d"); cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, c.width, c.height); cx.drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", .88));
  } finally { URL.revokeObjectURL(url); }
}

function wireCover(ov, F, after) {
  const drop = $("#drop", ov), file = $("#file", ov);
  const pick = () => assets ? file.click() : toast("Solo quien puede editar esta página puede subir portadas.");
  drop.addEventListener("click", pick); drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  $("#changeCover", ov)?.addEventListener("click", pick);
  file.addEventListener("change", () => file.files[0] && takeImage(ov, F, file.files[0], after));
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("drag"); const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith("image/")); if (f) takeImage(ov, F, f, after); else toast("Arrastra un archivo de imagen."); });
}
async function takeImage(ov, F, file, after) {
  if (!assets) { toast("Solo quien puede editar esta página puede subir portadas."); return; }
  try {
    const blob = await toJpeg(file);
    if (F.preview) URL.revokeObjectURL(F.preview);
    F.blob = blob; F.preview = URL.createObjectURL(blob);
    const img = $("#dropImg", ov); img.src = F.preview; img.hidden = false; $("#dropMsg", ov).hidden = true;
    after && after();
  } catch { toast("No se pudo leer esa imagen. Prueba con un JPG o PNG."); }
}
function wireAI(ov, F, kind) {

  const setMsg = (t, cls = "") => { msg.className = "msg " + cls; msg.textContent = t; };
  const fill = (res) => {
    if (!res || typeof res !== "object") throw { code: "invalid_json" };
    const filled = [];
    const set = (id, v, label) => { const el = $("#" + id, ov); if (!el || v == null || v === "" || (Array.isArray(v) && !v.length)) return; if (String(el.value).trim()) return; el.value = v; filled.push(label); };
    set("f_artist", res.artist, "artista"); set("f_title", res.title, "disco");
    set("f_year", res.year ? String(res.year) : null, "año");
    set("f_genres", Array.isArray(res.genres) ? res.genres.slice(0, 3).join(", ") : null, "géneros");

async function drawCollectionPages({ name, withPrice, list }) {

      const line2 = `DE ${name.toUpperCase()}`; fitFont(x, line2, 900, 140, D, 820); x.fillText(line2, 66, 226);
      x.save(); x.translate(905, 352); x.rotate(-0.18); x.fillStyle = C.pink; x.beginPath(); x.arc(0, 0, 84, 0, 7); x.fill();
      x.fillStyle = C.ink; x.textAlign = "center"; x.textBaseline = "middle"; x.font = `900 31px ${D}`;
      (withPrice ? ["TASADA", "Y BIEN", "CUIDADA"] : ["ESTO YA", "LO TENGO,", "GRACIAS"]).forEach((l, i) => x.fillText(l, 0, -32 + i * 32)); x.restore();

      x.fillText(withPrice ? `Coste total ${fmtEur0(t.spent)}${t.nGifts ? ` (${t.nGifts} regalos incluidos a precio medio)` : ""} · Valor de mercado ${fmtEur0(t.mkt)}` : "Antes de regalarme un disco, comprueba que no está en esta lista.", 70, 472);

      if (im) { const s = Math.max(CW / im.naturalWidth, CW / im.naturalHeight); const sw = CW / s, sh = CW / s; x.drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) / 2, sw, sh, cx0, cy0, CW, CW); }
      links.push({ page: p, x: cx0, y: cy0, w: CW, h: CW, url: safeUrl(r.appleMusicUrl) || appleSearch(r) });

      x.fillStyle = C.ink; x.font = `900 31px ${D}`; const tl = wrapLines(x, String(r.title).toUpperCase(), CW, 2); tl.forEach((l, i) => x.fillText(l, cx0, ty + i * 30)); ty += tl.length * 30 + 4;
      const pm = !r.gift && r.priceMarket != null ? `web ≈ ${fmtEur0(r.priceMarket)}` : null;
      const meta = (withPrice ? [r.year, pm || genresOf(r)[0]] : [r.year, genresOf(r)[0]]).filter(Boolean).join(" · ");
      x.fillStyle = C.muted; x.font = `500 16px ${B}`; x.fillText(wrapLines(x, meta, CW, 1)[0] || "", cx0, ty);
    }
    x.fillStyle = C.ink; x.fillRect(0, PH - 60, PW, 60);
    x.fillStyle = "#FFFFFF"; x.font = `500 18px ${M}`; x.textBaseline = "middle";
    x.fillText(withPrice ? "Valores orientativos según precios medios de internet." : "Si ya está aquí, búscame otro de la wishlist.", 70, PH - 30);
    x.textAlign = "right"; x.fillStyle = C.yellow; x.fillText(`${p < 26 ? "CARA " + String.fromCharCode(65 + p) + " · " : ""}${p + 1}/${total}`, PW - 70, PH - 30); x.textAlign = "left";
    pages.push(c); p++;

/* Un archivo .json con vinilos, wishlist, ajustes y portadas (como data: URLs). Sirve para pasar la colección
   entre la versión de Claude y la app del móvil, y para no perder nada. */
const BK = { pending: null, busy: "", msg: "" };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const blobToDataURL = (b) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
function dataURLToBlob(u) { const m = /^data:([^;,]+)(;base64)?,(.*)$/s.exec(u || ""); if (!m) throw new Error("bad"); const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: m[1] }); }
const okId = (id) => typeof id === "string" && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id) && id !== "." && id !== "..";
function bkSummary(b) { const n = (x) => Array.isArray(x) ? x.length : 0; const c = Object.keys(b.covers || {}).length; return `${n(b.vinyls)} vinilos, ${n(b.wishlist)} ${n(b.wishlist) === 1 ? "deseo" : "deseos"} y ${c} ${c === 1 ? "portada" : "portadas"}`; }
async function buildBackup() {
  const covers = {};
  const ids = [...new Set([...state.vinyls, ...state.wish].map(r => r.coverAsset).filter(Boolean))];
  for (const id of ids) {
    try { const u = assetUrl(id); if (!u) continue; const res = await fetch(u); if (!res.ok) continue; covers[id] = await blobToDataURL(await res.blob()); } catch {}
  }
  return { app: "discoteca", v: 1, exportedAt: new Date().toISOString(), settings: { ownerName: state.settings.ownerName || "" },
    vinyls: state.vinyls.map(r => ({ ...r })), wishlist: state.wish.map(r => ({ ...r })), covers };
}
async function saveBackup() {
  if (!downloads) { toast("Esta vista no permite descargar archivos."); return; }
  BK.busy = "Preparando la copia…"; render();
  try {
    const b = await buildBackup();
    BK.busy = ""; render();
    await downloads.save({ filename: `discoteca-copia-${todayStr()}.json`, data: JSON.stringify(b) });
    lsSet("lastBackup", Date.now()); toast(GH ? "Copia lista: guárdala en Archivos o iCloud" : "Copia guardada"); render();
  } catch (e) { BK.busy = ""; render(); if (e?.code !== "declined") toast("No se pudo guardar la copia."); }

function pickBackup() {

async function applyBackup(b) {
  const oldCovers = new Set([...state.vinyls, ...state.wish].map(r => r.coverAsset).filter(Boolean));
  const covers = Object.entries(b.covers || {}); const map = {};
  let i = 0;
  for (const [oldId, durl] of covers) {
    BK.busy = `Restaurando portadas… ${++i}/${covers.length}`; render();
    if (!assets) break;
    try { const blob = dataURLToBlob(durl); const up = await assets.upload(blob, { type: blob.type || "image/jpeg" }); map[oldId] = up.id; } catch {}
  }
  const prep = (r) => { const { id, ...d } = r; d.coverAsset = r.coverAsset && map[r.coverAsset] ? map[r.coverAsset] : null; return [okId(id) ? id : null, d]; };
  const V = b.vinyls || [], W = Array.isArray(b.wishlist) ? b.wishlist : [];
  const keepV = new Set(V.map(r => r.id)), keepW = new Set(W.map(r => r.id));
  BK.busy = "Restaurando la colección…"; render();
  for (const r of state.vinyls.slice()) if (!keepV.has(r.id)) await db.doc("vinyls/" + r.id).delete();
  for (const r of state.wish.slice()) if (!keepW.has(r.id)) await db.doc("wishlist/" + r.id).delete();
  i = 0;
  for (const r of V) { const [id, d] = prep(r); BK.busy = `Restaurando vinilos… ${++i}/${V.length}`; render(); if (id) await db.doc("vinyls/" + id).set(d); else await db.collection("vinyls").add(d); }
  for (const r of W) { const [id, d] = prep(r); if (id) await db.doc("wishlist/" + id).set(d); else await db.collection("wishlist").add(d); }
  if (b.settings && typeof b.settings === "object") await db.doc("settings/main").set({ ownerName: String(b.settings.ownerName || "") });
  if (GH && assets) { const used = new Set(Object.values(map)); for (const id of oldCovers) if (!used.has(id)) assets.delete(id).catch(() => {}); }
}

async function exportCsv() {

  const rows = [cols.map(c => c[0]).join(";"), ...filtered().map(r => cols.map(([, k]) => cell(typeof k === "function" ? k(r) : (typeof r[k] === "number" ? String(r[k]).replace(".", ",") : r[k]))).join(";"))];

/* ---------- boot ---------- */
document.fonts && document.fonts.ready.then(() => { fontsOk = true; coverCache.clear(); render(); });
if (GH && window.__ghCoversReady) window.__ghCoversReady.then(() => render());
(async () => {
  const c = window.claude;
  if (!c || !c.use) { state.offline = true; render(); return; }
  const use = (n) => c.use(n).catch(() => null);
  const [d, a, s, dl, u] = await Promise.all([use("db"), use("assets"), use("sample"), use("downloads"), use("user")]);
  db = d; assets = a; sample = s; downloads = dl;
  if (!db) { state.offline = true; state.error = "Inicia sesión en Claude para ver la colección."; render(); return; }
  state.canWrite = u ? (await u.can("data.write").catch(() => null)) !== false : true;
  const fail = (e) => { if (e?.code === "revoked") { state.offline = true; state.error = "Ya no tienes acceso a esta colección."; render(); } };
  db.collection("vinyls").onSnapshot(snap => { state.vinyls = snap.docs.map(x => ({ id: x.id, ...x.data() })); state.loaded.v = true; render(); }, fail);
  db.collection("wishlist").onSnapshot(snap => { state.wish = snap.docs.map(x => ({ id: x.id, ...x.data() })); state.loaded.w = true; render(); }, fail);
  db.doc("settings/main").onSnapshot(snap => { if (snap.exists) { state.settings = { ownerName: "Pablo", ...snap.data() }; render(); } }, fail);
})();
})();
</script>

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
